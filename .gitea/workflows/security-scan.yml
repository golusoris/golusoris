name: Security scan

on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gitea-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scheduled security gate
    runs-on: cauda-k8s-office-canary
    container:
      # Source and bump authority: lusoris/k8s apps/dev/gitea-actions-runner/job-image.
      image: harbor.infra.cauda.dev/library/gitea-actions-job:2.335.1-cauda3-gitea3@sha256:ca08d1bee54628ae8713133ae4bf2fe7f06a20a6db6ffd1d184f6ac63660297b
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select the repository-declared Go toolchain
        run: |
          set -euo pipefail
          declared_go=$(awk '$1 == "go" { print $2; exit }' go.mod)
          test -n "$declared_go"
          echo "GOTOOLCHAIN=go${declared_go}" >> "$GITHUB_ENV"
      - name: Scan
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck -version | grep -Fq "Scanner: govulncheck@${GOVULNCHECK_VERSION}"
          scripts/ci/go-modules.sh verify
          scripts/ci/go-modules.sh gosec
          scripts/ci/go-modules.sh vuln
          gitleaks git . -c .gitleaks.toml --redact --no-banner --verbose
          docker info
          bash scripts/ci/semgrep-scan.sh
          bash scripts/hiss/semgrep-fixtures.sh
          bash scripts/ci/trivy-scan.sh
