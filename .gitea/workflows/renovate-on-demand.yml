name: renovate-on-demand

on:
  issues:
    types: [edited]
  workflow_dispatch: {}

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    if: >-
      github.event_name != 'issues' ||
      (contains(github.event.issue.title, 'Dependency Dashboard') &&
       contains(github.event.issue.body, '[x]'))
    runs-on: cauda-k8s-office-canary
    container:
      image: docker.io/renovate/renovate:44@sha256:aba0e1146d259bf2657c034f72ce63597a9f8335acec8084d9f396bc4ba09522
    timeout-minutes: 30
    steps:
      - name: Run Renovate scoped to this repository
        env:
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: https://git.dev.cauda.dev/api/v1
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: Renovate Bot <renovate@cauda.dev>
          RENOVATE_FETCH_CHANGE_LOGS: "off"
          LOG_LEVEL: info
          NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
        run: renovate
