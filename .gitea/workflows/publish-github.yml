name: Publish validated refs to GitHub

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'

permissions:
  contents: read

concurrency:
  group: github-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Fast-forward public GitHub
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: cauda-k8s-office-canary
    container:
      image: harbor.infra.cauda.dev/library/gitea-actions-job:2.335.1-cauda3-gitea3@sha256:ca08d1bee54628ae8713133ae4bf2fe7f06a20a6db6ffd1d184f6ac63660297b
    timeout-minutes: 15
    env:
      PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish only validated, non-divergent refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_GITHUB_TOKEN"
          test "$GITHUB_REPOSITORY" = "golusoris/golusoris"
          case "$(git remote get-url origin)" in
            */golusoris/golusoris|*/golusoris/golusoris.git) ;;
            *) echo "::error::checkout origin does not match golusoris/golusoris"; exit 1 ;;
          esac

          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          # Variables expand when Git invokes the generated helper.
          # shellcheck disable=SC2016
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in *Username*) printf "%s\n" "x-access-token";; *) printf "%s\n" "$PUBLIC_GITHUB_TOKEN";; esac' > "$askpass"
          chmod 0700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0

          git fetch --no-tags origin main
          git remote add public https://github.com/golusoris/golusoris.git
          git fetch --no-tags public main

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            test -n "$VALIDATED_SHA"
            git cat-file -e "$VALIDATED_SHA^{commit}"
            current=$(git rev-parse refs/remotes/origin/main)
            if [ "$VALIDATED_SHA" != "$current" ]; then
              echo "Validated commit was superseded by $current; the newer CI run will publish."
              exit 0
            fi
            git merge-base --is-ancestor refs/remotes/public/main "$VALIDATED_SHA" ||
              { echo "::error::public GitHub main diverged; refusing a non-fast-forward update"; exit 1; }
            git push public "$VALIDATED_SHA:refs/heads/main"
            exit 0
          fi

          tag=${SOURCE_REF#refs/tags/}
          test -n "$tag"
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          sha=$(git rev-parse "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          git merge-base --is-ancestor "$sha" refs/remotes/public/main
          if git ls-remote --exit-code --tags public "refs/tags/$tag" >/tmp/public-tag; then
            test "$(awk 'NR==1 {print $1}' /tmp/public-tag)" = "$(git rev-parse "refs/tags/$tag")"
          else
            git push public "refs/tags/$tag:refs/tags/$tag"
          fi
