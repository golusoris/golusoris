# Production-like local stack. Apps copy + adjust.
services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

  app:
    # Supply the repository and digest separately so the template cannot fall
    # back to a mutable tag.
    image: ${APP_IMAGE_REPOSITORY:?required}@${APP_IMAGE_DIGEST:?required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Pass a URL-encoded DSN; raw credential interpolation corrupts reserved characters.
      APP_DB_DSN: ${APP_DB_DSN:?required}
      APP_CACHE_REDIS_ADDR: redis:6379
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
