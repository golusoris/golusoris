# mockery v3 config template.
# Apps copy + adjust packages section.
all: false
dir: "{{.InterfaceDir}}/mocks"
filename: "mock_{{.InterfaceName | snakecase}}.go"
force-file-write: true
formatter: goimports
structname: "Mock{{.InterfaceName}}"
pkgname: "mocks"
template: testify
template-data:
  boilerplate-file: "tools/mockery_boilerplate.txt"

packages: {}
