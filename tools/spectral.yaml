# Strict OpenAPI ruleset (vacuum, Spectral format). Apps' `make spec-lint` runs this.
extends: ["./spectral/oas.yaml"]

rules:
  # Strict: every operation must have summary, description, operationId, tags
  # Not part of spectral:oas (only description/operationId/tags are); define it.
  operation-summary:
    description: Every operation must have a summary.
    severity: error
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace]"
    then:
      field: summary
      function: truthy
  operation-description:
    description: Every operation must have a description.
    severity: error
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace]"
    then:
      field: description
      function: truthy
  operation-operationId: error
  operation-tags: error

  # Required for ogen quality
  operation-operationId-unique: error
  path-params: error
  no-$ref-siblings: error

  # Disallow empty arrays / objects in examples
  oas3-valid-schema-example: error

  # Servers + info hygiene
  info-license:
    description: Info object must have a license object.
    severity: warn
    given: "$.info"
    then:
      field: license
      function: truthy
  info-description: warn
