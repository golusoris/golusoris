# Local dev stack template. Apps copy + adjust app service.
services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  app:
    build:
      context: ..
      dockerfile: tools/Dockerfile.template
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # db/pgx
      APP_DB_DSN: postgres://app:dev@postgres:5432/app?sslmode=disable
      # cache/redis
      APP_CACHE_REDIS_ADDR: redis:6379
      # log/
      APP_LOG_LEVEL: debug
      APP_LOG_FORMAT: tint
      # otel/ — point at a collector if you run one
      # APP_OTEL_SERVICE_NAME: myapp
      # APP_OTEL_ENDPOINT: otel-collector:4317
    ports:
      - "8080:8080"

  # Optional: Prometheus scraping the app. Uncomment + mount
  # tools/prometheus/prometheus.yml to collect metrics locally.
  # prometheus:
  #   image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
  #   volumes:
  #     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   ports:
  #     - "9090:9090"

volumes:
  pg_data:
  redis_data:
