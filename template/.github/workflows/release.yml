# Per-app release — delegates to the reusable workflow in golusoris/golusoris.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: golusoris/golusoris/.github/workflows/release-go.yml@7cbd6f9506023f0f9145d3282b7e5107c4d85ebe # v0.19.0
    with:
      image-name: ghcr.io/${{ github.repository }}
