# Per-app release — delegates to the reusable workflow in golusoris/golusoris.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: golusoris/golusoris/.github/workflows/release-go.yml@7c3fabe83c1bfa77120f7efa6bcef29448a9170e # v0.22.2
    with:
      image-name: ghcr.io/${{ github.repository }}
