# Per-app release — delegates to the reusable workflow in golusoris/golusoris.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: golusoris/golusoris/.github/workflows/release-go.yml@380b26797a8552c8b8aba03d53209b8997f2b1be # v0.10.1
    with:
      image-name: ghcr.io/${{ github.repository }}
    secrets: inherit
