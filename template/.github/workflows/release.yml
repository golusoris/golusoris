# Per-app release — delegates to the reusable workflow in golusoris/golusoris.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: golusoris/golusoris/.github/workflows/release-go.yml@16b32399916935eb30c98d23b4c81a4ec69b1186 # v0.16.5
    with:
      image-name: ghcr.io/${{ github.repository }}
