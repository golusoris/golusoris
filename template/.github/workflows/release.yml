# Per-app release — delegates to the reusable workflow in golusoris/golusoris.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: golusoris/golusoris/.github/workflows/release-go.yml@48f18d3a4d0b6683b078bd6ddbc7d3dc368992d1 # v0.11.0
    with:
      image-name: ghcr.io/${{ github.repository }}
    secrets: inherit
