# Per-app release — delegates to the reusable workflow in golusoris/golusoris.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: golusoris/golusoris/.github/workflows/release-go.yml@4b22fc0dc3c1f9c779b77e78a292539655d2dc69 # v0.12.0
    with:
      image-name: ghcr.io/${{ github.repository }}
    secrets: inherit
