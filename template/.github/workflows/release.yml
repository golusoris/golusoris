# Per-app release — delegates to the reusable workflow in golusoris/golusoris.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: golusoris/golusoris/.github/workflows/release-go.yml@d28f55331a7466f163fd26dbb00aaa00a936f197 # v0.18.0
    with:
      image-name: ghcr.io/${{ github.repository }}
