# Per-app release — delegates to the reusable workflow in golusoris/golusoris.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: golusoris/golusoris/.github/workflows/release-go.yml@1abfd4220582e868b1b1164037c2cce3f5658d7f # v0.10.2
    with:
      image-name: ghcr.io/${{ github.repository }}
    secrets: inherit
