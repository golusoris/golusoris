# Per-app release — delegates to the reusable workflow in golusoris/golusoris.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: golusoris/golusoris/.github/workflows/release-go.yml@54fae5cc9d71eb5e989eafce4bb1a569dbd36008 # v0.16.2
    with:
      image-name: ghcr.io/${{ github.repository }}
