# Per-app release — delegates to the reusable workflow in golusoris/golusoris.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: golusoris/golusoris/.github/workflows/release-go.yml@20a0d6df7afa001e9e489dd5c150ded53ea7aa73 # v0.16.3
    with:
      image-name: ghcr.io/${{ github.repository }}
