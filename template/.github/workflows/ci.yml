# Per-app CI — delegates to the reusable workflow in golusoris/golusoris.
# Refs are pinned to a release commit; Renovate bumps them.
#
# Code scanning: enable GitHub's CodeQL default setup on the app repository
# (Settings > Code security). The reusable codeql.yml was retired on
# 2026-08-28 and is not published from golusoris any more.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: golusoris/golusoris/.github/workflows/ci-go.yml@380b26797a8552c8b8aba03d53209b8997f2b1be # v0.10.1
    with:
      go-version-file: go.mod
      coverage-threshold: 70
      # Uncomment and set your Go module path to enable apidiff:
      # module-path: github.com/golusoris/app-CHANGEME

  scorecard:
    uses: golusoris/golusoris/.github/workflows/scorecard.yml@380b26797a8552c8b8aba03d53209b8997f2b1be # v0.10.1
    secrets: inherit
