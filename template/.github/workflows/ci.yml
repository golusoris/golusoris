# Per-app CI — delegates to the reusable workflow in golusoris/golusoris.
# Refs are pinned to a release commit (currently v0.7.0); Renovate bumps them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: golusoris/golusoris/.github/workflows/ci-go.yml@1d6cb261f2c901fd6a3f59c0b8b5641336ca3763 # v0.9.0
    with:
      go-version-file: go.mod
      coverage-threshold: 70
      # Uncomment and set your Go module path to enable apidiff:
      # module-path: github.com/golusoris/app-CHANGEME

  codeql:
    uses: golusoris/golusoris/.github/workflows/codeql.yml@1d6cb261f2c901fd6a3f59c0b8b5641336ca3763 # v0.9.0

  scorecard:
    uses: golusoris/golusoris/.github/workflows/scorecard.yml@1d6cb261f2c901fd6a3f59c0b8b5641336ca3763 # v0.9.0
    secrets: inherit
