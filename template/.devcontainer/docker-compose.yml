services:
  app:
    # renovate: datasource=docker depName=mcr.microsoft.com/devcontainers/go
    # renovate-version: 2.3.1-1.27-bookworm
    image: mcr.microsoft.com/devcontainers/go@sha256:adc326255c019241228f9da4a1cb5d6a89abaaa0eb8d926a355b00af7daafd00
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - APP_DB_DSN=postgres://dev:dev@db:5432/dev?sslmode=disable
      - APP_CACHE_REDIS_ADDR=cache:6379
      - APP_NATS_URL=nats://nats:4222
    depends_on:
      - db
      - cache
      - nats

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  cache:
    image: redis:8-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    restart: unless-stopped
    ports:
      - "6379:6379"

  nats:
    image: nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"   # NATS monitoring

volumes:
  postgres-data:
