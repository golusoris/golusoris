services:
  app:
    # renovate: datasource=docker depName=mcr.microsoft.com/devcontainers/go
    # renovate-version: 2.3.1-1.27-bookworm
    image: mcr.microsoft.com/devcontainers/go@sha256:adc326255c019241228f9da4a1cb5d6a89abaaa0eb8d926a355b00af7daafd00
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - APP_DB_DSN=postgres://dev:dev@db:5432/dev?sslmode=disable
      - APP_CACHE_REDIS_ADDR=cache:6379
      - APP_NATS_URL=nats://nats:4222
    depends_on:
      - db
      - cache
      - nats

  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  cache:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    restart: unless-stopped
    ports:
      - "6379:6379"

  nats:
    image: nats:2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"   # NATS monitoring

volumes:
  postgres-data:
