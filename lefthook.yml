#
# lefthook git-hook gate (fleet convention: cordanallm/praetor).
#   install:  make tools-bootstrap && lefthook install
#   dry-run:  lefthook run pre-commit --no-auto-install [--all-files | --file <path>]
#
# Praetor governance jobs plus repository-specific multi-module checks.
# Optional tools skip locally when absent; CI make verify-all remains authoritative.
agent-checkpoint-tool:
  commands:
    checkpoint:
      run: python3 -B .config/lefthook/scripts/checkpoint.py --event tool --json --marker
agent-checkpoint-stop:
  commands:
    checkpoint:
      run: python3 -B .config/lefthook/scripts/checkpoint.py --event stop --json --marker

pre-commit:
  parallel: true
  commands:
    gofumpt:
      glob: "*.go"
      run: bash scripts/hooks/gofumpt.sh {staged_files}
    gci:
      glob: "*.go"
      run: bash scripts/hooks/gci.sh {staged_files}
    golangci-lint:
      glob: "*.go"
      run: bash scripts/hooks/golangci-lint.sh {staged_files}
    govet:
      glob: "*.go"
      run: bash scripts/hooks/govet.sh {staged_files}
    context-check:
      run: sh .config/lefthook/engine.sh compile-context --verify
    hiss-audit:
      run: sh .config/lefthook/engine.sh audit
    hiss-coverage:
      run: sh .config/lefthook/engine.sh hiss coverage --verify
    reuse:
      run: bash scripts/hooks/reuse.sh
    gitleaks:
      run: bash scripts/hooks/gitleaks.sh

commit-msg:
  commands:
    conventional-dco:
      run: bash scripts/hooks/commit-msg.sh {1}

post-commit:
  commands:
    state-sync:
      run: sh .config/lefthook/engine.sh state sync .
    dedupe-cadence:
      run: sh .config/lefthook/engine.sh dedupe cadence --threshold=20 --record .

pre-push:
  parallel: false
  commands:
    build-test:
      run: bash scripts/hooks/pre-push.sh
    security:
      run: if command -v govulncheck >/dev/null 2>&1; then GO_MODULE_GROUP=primary scripts/ci/go-modules.sh vuln; else echo govulncheck is not installed, skipping >&2; fi
    audit:
      run: sh .config/lefthook/engine.sh audit
