version: 1
repository:
    owner: golusoris
    name: golusoris
    visibility: public
    description: ""
    homepage: ""
    topics: []
profiles:
    - framework
facets:
    - security:high
    - api:public-contract
    - docs:seo-portal
    - agent:sandboxed

# Framework archetype bounds (strictness can only be increased, never reduced).
overrides:
    complexity:
        max_cyclomatic: 10
        max_cognitive: 15
        max_func_loc: 75
        max_statements: 50
    branch_protection:
        enforce_linear_history: true
        require_signed_commits: true
        required_approving_reviewers: 1
        # Single maintainer today: praetor renders 0 required approvals and no
        # code-owner review, exactly as cordanaLLM/praetor declares for itself.
        # Switch back to independent once a second maintainer or a review bot
        # can approve; the required count stays so the switch restores it.
        review_mode: single_maintainer
        dismiss_stale_reviews: true
    supply_chain:
        slsa_level: 3
        enforce_cosign: true
        require_sbom: true
