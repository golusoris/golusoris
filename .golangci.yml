        linters:
          - wrapcheck
          - gosec
          - forbidigo
      # cmd/ is CLI surface — fmt.Print* is how CLIs output.
      - path: cmd/
        linters:
          - forbidigo
      # clock/ is the sanctioned owner of time.Now.
      - path: clock/
        linters:
          - forbidigo
      # apidocs marshals MCP (JSON-RPC) protocol fields, which are camelCase
      # by spec. tagliatelle's snake-case rule doesn't apply.
      - path: apidocs/
        linters:
          - tagliatelle
      # Vite's manifest.json schema is camelCase (isEntry, dynamicImports, …).
      - path: httpx/vite/
        linters:
          - tagliatelle
      # SCIM 2.0 (RFC 7643/7644) mandates camelCase wire field names.
      - path: auth/scim/
        linters:
          - tagliatelle
      # Google reCAPTCHA wire format uses kebab-case `error-codes`.
      - path: auth/captcha/
        linters:
          - tagliatelle
      # Postmark wire format is PascalCase (From, To, HtmlBody, …) per spec.
      - path: notify/postmark/
        linters:
          - tagliatelle
      # SES webhook uses camelCase (notificationType, emailAddress) + Postmark
      # bounce webhook uses PascalCase.
      - path: notify/bounce/
        linters:
          - tagliatelle
      # SES inbound uses camelCase (messageId) + Postmark inbound uses
      # PascalCase (FromFull, ToFull, TextBody, HtmlBody).
      - path: notify/inbound/
        linters:
          - tagliatelle
      # Teams MessageCard wire format uses @context/@type/themeColor by spec.
      - path: notify/teams/
        linters:
          - tagliatelle
      # Meilisearch wire format uses camelCase (estimatedTotalHits, processingTimeMs).
      - path: search/meilisearch/
        linters:
          - tagliatelle
      # Cloud KMS REST wire format is camelCase (pemCrc32c, verifiedDigestCrc32c).
      - path: container/registry/sign/kms/gcp/
        linters:
          - tagliatelle
      # APNs wire format uses kebab-case (thread-id, content-available) per spec.
      - path: notify/apns2/
        linters:
          - tagliatelle
      # OAuth 2.0 (RFC 6749) standard wire field name `access_token`.
      - path: auth/oauth2server/
        linters:
          - gosec   # G117 false-positive on RFC-mandated field name
      # testifylint go-require false positives: tests use require inside
      # httptest server handlers — calls happen on the test goroutine, not
      # via t.Run, so the FailNow restriction doesn't actually bite.
      - path: _test\.go$
        linters:
          - testifylint

formatters:
  enable:
    # gofumpt is intentionally standalone: the repository pins v0.12.0 in
    # tools/tool-versions.env instead of inheriting golangci-lint's bundled
    # formatter version.
    - gci
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/golusoris/golusoris)
      custom-order: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
