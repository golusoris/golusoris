#
# SPDX-License-Identifier: EUPL-1.2
#
# Declared enforcement evidence for the HISS invariants in THIS repository (HISS-20).
#
# Every claim here is replayed against .config/hiss/testdata by `praetorctl hiss coverage
# --verify`, which runs in `make verify-all` (target: hiss-coverage) and in the lefthook
# pre-commit governance block next to hiss-audit. A claim is only as good as the fixture that
# demonstrates it.
#
# The check runs in BOTH directions. A state claiming detection must report each of its
# positive fixtures; a state claiming none must leave its gap fixtures undetected. So the
# catalogue fails when it becomes too optimistic AND when it becomes too pessimistic: the day
# a rule gains coverage, the gap fixture it was supposed to miss fires and this file must be
# updated to say so.
#
# States:
#   enforced       every shape the corpus describes is reported
#   partial        some shapes reported; gap/ names the rest
#   unsupported    nothing reported for this language; gap/ records what goes undetected
#   not_applicable the axiom does not apply to this language
#   manual         upheld by review, not by a runnable check -- never report it as a gate
#
# `runner` names the tool that decides the rule. An omitted runner means the HISS scanner
# (`praetorctl audit`), whose verdicts the verifier replays directly. Any other value is a
# DELEGATED claim: the fixtures are still replayed, but against the opposite expectation,
# because what the verifier can check for a tool it does not run is the ATTRIBUTION, not the
# enforcement. If the scanner reports a fixture credited to golangci-lint, the attribution is
# wrong. The measurement that backs a delegated claim is in its rationale, taken from running
# that tool against that fixture; nothing here is asserted from reading a config file alone.
#
# Four claims (HISS-11, HISS-12, HISS-16, HISS-20) carry no positive fixture. For three of
# them the mechanism decides a repository-global property -- go.sum and pinned action digests,
# one canonical AGENTS.md, this catalogue -- that no single file can exhibit; HISS-12 has none
# for a different and equally deliberate reason, recorded in its rationale. Each still names
# its mechanism and records a measured gap. An absent claim is honest; an unbacked one is the
# defect this mechanism exists to prevent. Note that a delegated claim's missing positive
# bucket is NOT flagged by the verifier -- only the attribution is replayed for a delegated
# claim -- so the reason for each absence is written down here instead.
#
# Source-language claims exist for Go, Python and C code present here; all three extensions
# are read by `praetorctl audit`. HISS-10 also declares public Markdown, shell scripts, forge
# workflow YAML, HCL, and Kubernetes YAML because their delegated gates are independently
# executable. No Rust, TypeScript or Svelte source exists here, so no entry is declared for them.
#
# To update a claim when a rule gains or loses coverage, see AGENTS.md, section
# "Updating the HISS-20 enforcement coverage catalogue".
version: 1
rules:
  - id: HISS-01
    title: Control Flow - Acyclic DAG Control Flow
    coverage:
      - language: go
        state: partial
        mechanism: >-
          praetorctl audit (internal/hiss go_ast.go checkSelfRecursion and the goto branch,
          plus go_callgraph.go, which builds each package's call graph after the walk and
          reports its cycles), reached by the lefthook pre-commit job hiss-audit, the
          lefthook pre-push job audit and the Makefile target audit inside make verify-all.
        rationale: >-
          Direct self-recursion, goto and mutual recursion are reported.
          positive/direct-recursion.go, positive/goto-jump.go and
          positive/mutual-recursion.go all raise HISS-01; negative/iterative-factorial.go
          does not. mutual-recursion.go moved out of gap/ when praetor cc0e7aa added the
          call-graph pass: `praetorctl hiss coverage --verify` then failed with "[FAIL]
          HISS-01/go gap/mutual-recursion.go: a fixture recorded as an undetected gap is now
          reported; close the gap in the catalog", which is this entry's measurement.
          The gap moved rather than vanished: gap/method-cycle.go carries the same cycle on a
          method set -- Walker.Step calls Walker.Hop calls Walker.Step -- and goes unreported,
          because a call through a receiver is not resolved to a call-graph node. No other
          gate in this repository looks at the call graph at all.
      - language: c
        state: partial
        mechanism: >-
          praetorctl audit (internal/hiss rules.go native goto matcher), same three entry
          points as Go. The single .c file in the tree, pkg/sockmap/bpf/sockmap.bpf.c, is in
          the scanner's file scope.
        rationale: >-
          Only goto is reported: positive/goto-cleanup.c raises HISS-01.
          gap/direct-recursion.c is the same cycle the Go scanner reports and the native line
          matcher does not decide recursion at all, so it passes unreported.
      - language: python
        state: partial
        mechanism: >-
          praetorctl audit (internal/hiss selfcall.go, the direct-recursion check of the
          line-scanned languages, run by script.go for Python), same three entry points as
          Go.
        rationale: >-
          Direct self-recursion is reported: positive/recursive-walk.py raises HISS-01 and
          negative/iterative-walk.py does not. recursive-walk.py moved out of gap/ when the
          praetor ede0d5d55 audit started reporting it: `praetorctl hiss coverage --verify`
          failed with "[FAIL] HISS-01/python gap/recursive-walk.py: a fixture recorded as an
          undetected gap is now reported; close the gap in the catalog". The scanner reads one
          function's text at a time, so a cycle through two functions stays unreported:
          gap/mutual-recursion.py (walk_even -> walk_odd -> walk_even) passes.
  - id: HISS-02
    title: "Loops & I/O - Bounded Loops & Mandatory I/O Timeouts"
    coverage:
      - language: go
        state: partial
        mechanism: >-
          praetorctl audit (internal/hiss go_ast.go, `for {}` / `for ;;`) for the loop half;
          for the I/O half, the .semgrep.yml rules http-client-must-set-timeout,
          no-http-default-client, no-default-http-client-in-tests and no-http-listenandserve
          run over every repository Go file by scripts/ci/semgrep-scan.sh, make semgrep-scan
          and required CI job "Custom SAST (semgrep)"; plus noctx, contextcheck and fatcontext
          in all-module golangci-lint. no-default-http-client-in-tests is replayed by
          scripts/hiss/semgrep-fixtures.sh against .config/hiss/semgrep/testdata/HISS-02.
        rationale: >-
          positive/unbounded-for.go raises HISS-02; negative/bounded-for.go, which counts to a
          named constant, does not. gap/condition-without-scalar-bound.go is the honest limit
          of the loop half: `for !done` has no scalar upper bound, which is what the axiom
          demands, but the scanner reports only a loop whose condition is absent. The I/O half
          is reported by Semgrep and golangci-lint rather than by the HISS scanner. Semgrep
          1.177.0 runs from the declared digest with strict parsing and proves all 721 selected
          repository Go files were scanned; scanner errors, omissions and findings fail. The
          test-request rule fires on its eight positive fixtures, stays silent on four negative
          and two gap fixtures (a client literal without Transport, and http.DefaultTransport
          handed to a wrapper), and fails the replay when removed.
      - language: c
        state: partial
        mechanism: praetorctl audit (internal/hiss rules.go nativeUnboundedLoop).
        rationale: >-
          positive/unbounded-while.c raises HISS-02 and negative/bounded-for.c does not. The
          I/O-timeout half of the axiom has no native check anywhere in this repository.
      - language: python
        state: partial
        mechanism: praetorctl audit (internal/hiss rules.go pythonWhileTrue).
        rationale: >-
          positive/while-true.py raises HISS-02 and negative/bounded-range.py does not.
          gap/while-one.py is the identical unbounded loop written `while 1:` and is matched by
          nothing. The I/O-timeout half has no Python check.
  - id: HISS-03
    title: Zero Frame Malloc
    coverage:
      - language: go
        state: partial
        runner: allocation-budget
        mechanism: >-
          scripts/ci/allocation-budget.sh parses benchmem output against
          scripts/ci/allocation-budgets.tsv and fails closed on missing, duplicate, malformed,
          byte-over-budget or allocations-over-budget results. make allocation-budget runs in
          make verify-all; required hosted allocation jobs run the same wrapper.
        rationale: >-
          scripts/ci/allocation-budget-policy_test.sh measures positive/over-budget_test.go at
          16 B/op against an 8 B/op cap and requires failure, measures
          negative/within-budget_test.go at 0 B/op and negative/at-budget_test.go at exactly
          8 B/op and requires success, then proves allocation-over, missing-result and
          duplicate-result failures. The production gate covers five named benchmarks;
          gap/hot-path-allocation.go remains undetected because no static rule finds an
          unbenchmarked hot path.
  - id: HISS-04
    title: "Complexity Bounds & Modular Sizing"
    coverage:
      - language: go
        state: partial
        mechanism: >-
          praetorctl audit (internal/hiss go_ast.go checkFuncLOC) against
          .standards.yaml overrides.complexity.max_func_loc = 60, plus gocyclo
          (min-complexity 10), gocognit (15), funlen (60 lines / 50 statements) and cyclop (18)
          in .golangci.yml, run for all 26 modules by CI jobs "Lint" and "Module sweep" and by
          make ci-all; lefthook pre-commit job golangci-lint covers staged packages.
        rationale: >-
          The scanner decides function length only: positive/overlong-function.go (90
          statements) raises HISS-04 and negative/short-function.go does not.
          gap/high-cyclomatic-function.go is 30 lines and therefore invisible to the scanner,
          while golangci-lint with this repository's .golangci.yml reports "cyclomatic
          complexity 12 of func `Classify` is high (> 10) (gocyclo)". The cyclomatic, cognitive
          and statement caps are golangci-lint's, so they are held as gaps here rather than
          counted as scanner coverage. Both independent function-length gates use 60 LOC.
      - language: c
        state: partial
        mechanism: praetorctl audit (internal/hiss rules.go braceTracker).
        rationale: >-
          Function length is decided by brace tracking: positive/overlong-function.c raises
          HISS-04 and negative/short-function.c does not. The three other caps have no native
          check; the Clang and clang-tidy gate does not enforce their exact thresholds.
      - language: python
        state: partial
        mechanism: praetorctl audit (internal/hiss rules.go python indentation tracker).
        rationale: >-
          Function length is decided by indentation: positive/overlong-function.py raises
          HISS-04 and negative/short-function.py does not. The three other caps have no Python
          check.
  - id: HISS-05
    title: Variable Scoping
    coverage:
      - language: go
        state: partial
        runner: golangci-lint
        mechanism: >-
          .golangci.yml with govet `enable-all: true` (so the shadow analyzer is on), revive's
          redefines-builtin-id rule, the predeclared and reassign linters and importas, run by
          CI jobs "Lint" and "Module sweep" across all 26 modules and by make ci-all; lefthook
          pre-commit job golangci-lint covers staged packages. internal/hiss implements no
          HISS-05 rule.
        rationale: >-
          Measured with golangci-lint 2.13.2 and this repository's .golangci.yml verbatim.
          positive/shadowed-error.go -> 'shadow: declaration of "err" shadows declaration at
          line 13 (govet)'. positive/redefined-builtin.go -> 'redefines-builtin-id:
          redefinition of the built-in function len (revive)'. negative/distinct-scopes.go ->
          "0 issues.". gap/package-level-mutable-state.go is mutable state at the widest scope
          in the package and also produced "0 issues.": gochecknoglobals is not in the enable
          list, so nothing in this repository decides package-scoped mutable state.
  - id: HISS-06
    title: Bounded Concurrency
    coverage:
      - language: go
        state: partial
        runner: semgrep
        mechanism: >-
          .semgrep.yml no-unbounded-goroutine-in-loop, run over every repository Go file by
          scripts/ci/semgrep-scan.sh, make semgrep-scan and required CI job "Custom SAST
          (semgrep)"; its focused corpus is replayed by make hiss-fixtures. internal/hiss has
          no Go HISS-06 rule; race tests decide a different property.
        rationale: >-
          gap/unrelated-send-before-spawn.go and gap/counted-loop-len-in-variable.go are the
          shapes nothing reports: a send on an unrelated channel before the spawn, which the
          semgrep rule accepts as an acquire, and a loop bounded by a variable holding
          len(xs), which it cannot tell from a constant bound. The nine shapes the semgrep
          rule does report are positives of that corpus, not of this one, because this file
          records what praetorctl's scanner decides.
  - id: HISS-07
    title: "Checked Errors & Zero Unwrap"
    coverage:
      - language: go
        state: partial
        mechanism: >-
          praetorctl audit (internal/hiss go_ast.go checkBlankAssign, checkPanic and
          checkEmptyErrBranch), plus errcheck, errorlint, nilerr, nilnil, nilnesserr and
          wrapcheck in .golangci.yml, executed across all 26 modules by "Lint" and "Module
          sweep" plus make ci-all.
        rationale: >-
          positive/discarded-error.go (`_ = os.Remove(path)`), positive/empty-error-branch.go
          and positive/panic-in-production.go each raise HISS-07;
          negative/propagated-error.go does not. gap/unchecked-call-statement.go calls
          os.Remove and binds nothing: deciding that the dropped result IS an error needs type
          information the syntax scanner does not build, and golangci-lint reports it as
          'Error return value of `os.Remove` is not checked (errcheck)' in the same gate.
      - language: python
        state: partial
        mechanism: praetorctl audit (internal/hiss rules.go bare-except matcher).
        rationale: >-
          positive/bare-except.py raises HISS-07 and negative/explicit-except.py, which names
          the one exception it handles, does not. Ruff's S rules report selected exception
          anti-patterns, but swallowed return codes remain outside both mechanisms.
  - id: HISS-08
    title: "Static Determinism & Banned Functions"
    coverage:
      - language: go
        state: partial
        runner: semgrep
        mechanism: >-
          .semgrep.yml no-dynamic-code-loading and no-dynamic-exec-command, run over every
          repository Go file by scripts/ci/semgrep-scan.sh, make semgrep-scan and required CI
          job "Custom SAST (semgrep)"; focused corpora are replayed by make hiss-fixtures.
          internal/hiss implements HISS-08 for Python and C only.
        rationale: >-
          gap/command-name-from-environment.go is the shape nothing reports: the command name
          comes from an environment variable held in a plain variable, and both semgrep rules
          match interpreter literals and call-site assembly rather than taint. plugin.Open,
          plugin.Lookup, reflect.MakeFunc and the interpreter and assembled-name spellings
          are positives of the semgrep corpus. There are zero dynamic-loading call sites in
          the tree today.
      - language: python
        state: partial
        mechanism: praetorctl audit (internal/hiss rules.go hasBannedCall for eval and exec).
        rationale: >-
          positive/dynamic-eval.py raises HISS-08 and negative/static-dispatch.py, which
          dispatches through a closed table, does not. gap/os-system.py hands a string built at
          run time to /bin/sh, which is the same axiom violation for a different interpreter,
          and the matcher knows only the two builtin names.
      - language: c
        state: partial
        mechanism: >-
          praetorctl audit (internal/hiss rules.go hasBannedCall for gets, strcpy and sprintf).
        rationale: >-
          positive/banned-strcpy.c raises HISS-08 and negative/bounded-copy.c, which uses
          snprintf, does not. gap/dlopen-unverified.c maps an unpinned, unverified shared
          object into the process at run time and is not decided by a rule that matches three
          string primitives.
  - id: HISS-09
    title: "Reference Safety & Mandatory Safety Proofs"
    coverage:
      - language: go
        state: partial
        mechanism: >-
          praetorctl audit (internal/hiss go_ast.go checkUnsafe), with .semgrep.yml
          unsafe-requires-safety-proof covering the import form and aliased import. The custom
          rule runs over every repository Go file through scripts/ci/semgrep-scan.sh, make
          semgrep-scan and required CI; its corpus lives in .config/hiss/semgrep/testdata.
        rationale: >-
          The scanner reports an unproven unsafe.Pointer, unproven Slice and String
          conversions, an unproven import, a usage with no proof at all and a proof detached
          from the code by a blank line; negative/proven-pointer.go, which states the proof
          directly above, is not reported. It misses `import raw "unsafe"`, because it
          matches a selector spelled `unsafe`; the semgrep rule reports that alias and is
          what closes the gap here. Whether a proof is truthful is decided by review, and
          there are zero `unsafe` imports in the tree today.
      - language: c
        state: unsupported
        mechanism: >-
          none. internal/hiss implements HISS-09 for Go and Rust only. c-quality compiles with
          Clang and runs clang-tidy, but no selected rule requires a SAFETY proof or establishes
          pointer bounds; no sanitizer executes.
        rationale: >-
          positive/ is empty because no mechanism reports an unproven native memory operation.
          gap/raw-pointer-arithmetic.c dereferences base+offset with no bound and no proof and
          is reported by nothing.
  - id: HISS-10
    title: 5-Layer Zero-Warnings Cascade
    coverage:
      - language: go
        state: partial
        runner: golangci-lint
        mechanism: >-
          golangci-lint v2 with this repository's .golangci.yml (69 linters enabled, default
          none), reached across all 26 modules by CI jobs "Lint" and "Module sweep" and by make
          ci-all inside make verify-all; lefthook pre-commit jobs golangci-lint and govet cover
          staged packages. gofumpt, gci and goimports are part of the same config and are also
          enforced by lefthook pre-commit jobs gofumpt and gci. internal/hiss implements no
          HISS-10 rule.
        rationale: >-
          Measured with golangci-lint 2.13.2 and this repository's config verbatim. 3/3
          positives reported: 'ineffectual assignment to sum (ineffassign)', 'func helper is
          unused (unused)', 'printf: fmt.Sprintf format %d has arg name of wrong type string
          (govet)'. negative/clean-and-formatted.go produced "0 issues.".
          gap/unexplained-nolint.go carries a bare `//nolint:errcheck` with no reason and also
          produced "0 issues.", because nolintlint is enabled with require-explanation and
          require-specific unset. `scripts/ci/go-modules.sh list` discovers 26 modules; local
          make ci-all and hosted primary plus four split shards run this same lint config for
          every discovered module.
      - language: markdown
        state: partial
        runner: praetor-docs-lint
        mechanism: >-
          Praetor's locked documentation gate tools/markdownlint/verify.mjs (byte-locked by
          praetorctl audit): markdownlint 0.41.1 from tools/markdownlint/package-lock.json,
          installed by npm ci with lifecycle scripts disabled, with the rules of
          tools/markdownlint/markdownlint-cli2.yaml only; repository markdownlint config files
          are ignored. Selection covers tracked plus non-ignored untracked public Markdown,
          minus Praetor's built-in generated-context exclusions and the documentation.style_exclude
          globs in .standards.yaml (docs/upstream snapshots, these HISS fixtures,
          core/CHANGELOG.md). Make target docs-lint runs inside make verify-all; the
          "Documentation Governance" job of .github/workflows/praetor-docs.yml and the Gitea CI
          gate run the same script.
        rationale: >-
          Measured with the gate's own lint child (node tools/markdownlint/verify.mjs --lint
          <locked install> <fixture>) and with --only under default settings:
          positive/missing-heading-blank.md reports "MD022/blanks-around-headings" and exits 1;
          negative/clean-document.md and gap/long-prose-line.md exit 0 with no finding, the gap
          because the locked config sets MD013 false. node tools/markdownlint/verify.mjs
          --self-test replays Praetor's positive, negative, exclusion, symlink and bound fixtures.
      - language: mkdocs-markdown
        state: partial
        runner: mkdocs
        mechanism: >-
          Material for MkDocs 9.7.7 from its immutable image digest through
          scripts/ci/mkdocs-build.sh, with no network, a read-only container, dropped
          capabilities, and MkDocs strict mode. Make target mkdocs-build runs inside make
          verify-all; required CI job "Documentation build (MkDocs)" feeds "CI success";
          the Pages workflow and Gitea CI use the same wrapper.
        rationale: >-
          Measured by scripts/ci/mkdocs-build-policy_test.sh: positive/broken-link.md warns and
          fails strict mode; negative/clean-page.md passes; gap/external-link.md passes because
          MkDocs does not fetch or verify external targets. The policy suite also proves the
          immutable container contract, input symlink rejection and Docker-failure propagation.
      - language: shell
        state: partial
        runner: shellcheck
        mechanism: >-
          ShellCheck 0.11.0 at style severity through scripts/ci/shellcheck.sh. Its bounded Git
          selector covers tracked plus non-ignored untracked *.sh, *.bash, *.ksh and shell-
          shebang files, rejects symlinks, and follows repository sources. The wrapper also
          rejects ShellCheck disable directives without an inline WHY across those scripts and
          both workflow roots. Make target shellcheck runs inside make verify-all; required CI
          job "Shell scripts (ShellCheck)" feeds "CI success"; Gitea uses the same wrapper.
        rationale: >-
          Measured by scripts/ci/shellcheck-policy_test.sh: positive/unquoted-expansion.sh
          reports SC2086; positive/unexplained-disable.sh fails the wrapper's WHY policy; and
          negative/clean-script.sh passes. The policy suite proves explained suppressions,
          workflow-embedded suppressions, tracked, untracked, extensionless-shebang, fixture
          exclusion, binary/NUL, symlink, version-mismatch and scanner-failure behavior.
      - language: workflow-yaml
        state: partial
        runner: actionlint
        mechanism: >-
          actionlint v1.7.12 with .github/actionlint.yaml and pinned ShellCheck 0.11.0 through
          scripts/ci/actionlint.sh. Its bounded Git selector covers tracked plus non-ignored
          untracked .github/workflows and .gitea/workflows YAML and rejects symlinks. Make
          target actionlint runs inside make verify-all; required CI job "Workflows
          (actionlint)" feeds "CI success"; Gitea's CI gate runs the same wrapper.
        rationale: >-
          Measured by scripts/ci/actionlint-policy_test.sh:
          positive/undefined-expression.yml reports undefined variable unknown;
          negative/clean-workflow.yml reports nothing; gap/unpinned-action.yml reports nothing
          because actionlint validates workflow structure and expressions, not immutable action
          references. The wrapper currently selects all 20 GitHub and Gitea workflow files and
          the policy suite proves both roots, untracked input, symlink, version mismatch and
          scanner failure.
      - language: hcl
        state: partial
        runner: terraform
        mechanism: >-
          Terraform 1.16.3 through scripts/ci/terraform-validate.sh, preferring an exact native
          binary and otherwise using hashicorp/terraform by immutable image digest. The bounded
          selector covers every immediate deploy/terraform/modules child, rejects symlinks,
          requires .terraform.lock.hcl, runs recursive format checking, initializes with backend
          disabled and lockfile readonly, then validates. Make target terraform-validate runs
          inside make verify-all; required CI job "Terraform modules" feeds "CI success";
          Gitea's CI gate runs the same wrapper.
        rationale: >-
          Measured by scripts/ci/terraform-policy_test.sh: positive/unformatted.tf fails format
          checking; negative/clean.tf passes format, locked init and validate;
          gap/undocumented-variable.tf passes because Terraform does not require a variable
          description. The policy suite also proves both production modules are selected and
          version mismatch, missing lock, symlink, format, init and validate failures fail closed.
      - language: kubernetes-yaml
        state: partial
        runner: kubeconform
        mechanism: >-
          kubeconform v0.8.0 from an immutable image digest validates repository-owned static
          manifests plus default and feature-complete Helm renders in strict mode against
          Kubernetes v1.37.0 schemas and external CRD schemas at immutable source commits.
          scripts/ci/kubeconform.sh selects tracked plus non-ignored untracked manifests,
          rejects symlinks, and fails on missing schemas except the explicit local AppStack
          claim. Make target kubeconform runs inside make verify-all; required CI job
          "Kubernetes schemas (kubeconform)" feeds "CI success"; Gitea uses the same wrapper.
        rationale: >-
          Measured by scripts/ci/kubeconform-policy_test.sh:
          positive/unknown-field.yaml fails strict schema validation;
          negative/clean-configmap.yaml passes; gap/local-appstack.yaml passes because its local
          XRD has no generated kubeconform schema and AppStack is explicitly skipped. Production
          validation finds 33 resources across 12 static files and two Helm renders: 32 valid,
          zero invalid or errored, and exactly one declared AppStack skip. Policy tests also
          prove version, immutable schema, selection, symlink and scanner-failure controls.
      - language: python
        state: partial
        runner: ruff
        mechanism: >-
          Ruff 0.16.8 from its immutable image digest through scripts/ci/python-lint.sh. The
          bounded Git selector covers tracked plus non-ignored untracked Python, rejects
          symlinks, excludes the HISS corpus and vendor trees, rejects file-level noqa, and
          requires specific codes plus an inline WHY on scoped noqa. make python-lint runs
          inside make verify-all; GitHub Lint and the Gitea CI gate use the same wrapper.
        rationale: >-
          scripts/ci/python-lint-policy_test.sh proves positive/unused-import.py reports F401,
          positive/unexplained-noqa.py fails the suppression policy, and
          negative/clean-module.py passes. The suite also proves explained, empty-reason and
          file-level suppression handling plus tracked, untracked, fixture-exclusion, symlink,
          immutable-container, and scanner-failure behavior. Production Ruff selects
          E/F/I/B/UP/S/RUF/PERF/ASYNC/C90.
      - language: c
        state: partial
        runner: clang
        mechanism: >-
          Clang and clang-tidy 22.1.8 from the immutable silkeh/clang image through
          scripts/ci/c-quality.sh. The bounded Git selector covers tracked plus non-ignored
          untracked C and rejects symlinks. The wrapper compiles with -Wall -Wextra -Werror,
          treats clang-tidy findings as errors, and reproduces the checked-in stripped eBPF
          object. make c-quality, GitHub Build, and the Gitea CI gate run it.
        rationale: >-
          scripts/ci/c-quality-policy_test.sh proves positive/unused-variable.c fails,
          negative/clean.c passes, and gap/suppressed-unused-variable.c passes because Clang
          accepts unexplained diagnostic and NOLINT suppressions. The suite also proves
          untracked selection, fixture exclusion, symlink rejection, immutable-container
          failure propagation, and checked-object parity. Production compiles and analyzes the
          one C source and matches its reproducibly rebuilt object.
  - id: HISS-11
    title: Hermetic Supply Chain
    coverage:
      - language: go
        state: partial
        runner: ci
        mechanism: >-
          go.sum verification by the Go toolchain, reached by make build-all and make ci-all;
          gomoddirectives (replace-allow-list empty, exclude-forbidden) and gomodguard_v2 in
          .golangci.yml; the CI job "Dependency review" (fails on high/critical advisories and
          copyleft licences entering the tree); renovate.json extending
          helpers:pinGitHubActionDigests with pinDigest enabled; sbom.yml (SPDX SBOM plus
          Sigstore-keyless attestations on every tag); verify-provenance.yml (cosign verify
          plus gh attestation verify); scorecard.yml. Custom Semgrep, Material for MkDocs,
          Ruff, Clang, kubeconform, Terraform, Trivy and REUSE execute from version-plus-digest image
          authorities in tools/tool-versions.env; Renovate updates each pair atomically and
          policy tests reject ambient or version-only bypasses. Its regex manager also tracks
          immutable integration-test references in internal/testimages/images.go and the CI
          cache manifest; policy tests require their parity except declared ClamAV absence.
          .standards.yaml declares
          supply_chain.slsa_level 3, enforce_cosign and require_sbom, which praetorctl audit
          checks as configuration. scripts/ci/govulncheck.sh parses pinned govulncheck v1.8.0
          symbol JSON for every module and rejects every reachable finding with no exception
          list; it also rejects invalid or unexpected scanner configuration and any finding
          that lacks an OSV id or trace.
        rationale: >-
          No positive fixture exists because every mechanism above decides a repository-global
          property -- the lockfile, the pinned digest, the signed attestation -- that no single
          source file can exhibit; stating that is more useful than inventing a fixture that
          would prove nothing. Two real gaps are recorded instead.
          gap/go-generate-floating-tool.go fetches a codegen tool at @latest from a
          //go:generate line: no gate pins go:generate tool versions.
          gap/unpinned-action.yml is a workflow step on a mutable tag; Renovate rewrites that
          shape in .github/workflows/, but nothing FAILS on it, so one introduced by hand
          between Renovate runs merges unreported. scripts/ci/govulncheck-policy_test.sh
          measures the vulnerability path: a clean stream and imported-but-uncalled module or
          package findings pass, while every reachable finding (a GO-2026-6452-shaped Excelize
          trace included), invalid, empty, missing, duplicated or drifted scanner
          configuration, findings without an OSV id or trace, scanner failure and scanner
          version drift each fail closed. Mutants of govulncheck.sh that ignore findings,
          skip the trace or configuration check, or count uncalled findings each fail that
          test. The real 26-module sweep reports zero reachable vulnerabilities.
  - id: HISS-12
    title: Secret Leak Prevention
    coverage:
      - language: go
        state: partial
        runner: gitleaks
        mechanism: >-
          gitleaks GITLEAKS_VERSION (tools/tool-versions.env, 8.30.1) with this repository's
          .gitleaks.toml, run over the FULL history by the CI job "Secret scan (gitleaks)"
          (`gitleaks git . -c .gitleaks.toml --redact --no-banner --verbose`, installed by
          scripts/ci/install-gitleaks.sh only after the archive matches
          GITLEAKS_LINUX_X64_SHA256, then version-pinned by `test "$(gitleaks version)" =
          "$GITLEAKS_VERSION"`) and over the staged diff by the lefthook pre-commit job gitleaks
          (scripts/hooks/gitleaks.sh). GitHub native secret scanning and push protection sit in
          front of both.
        rationale: >-
          There is deliberately no positive fixture. A corpus of credential-shaped strings is
          how one would demonstrate that this rule fires, and this repository's .gitleaks.toml
          allowlists by EXACT VALUE rather than by path, on purpose, so that "any real secret
          in a test file [is] still detected". Adding the corpus would force either a
          permanent failure of the repository's own secret gate on every push -- the CI job
          scans all history -- or a path exemption that would blind the scanner to a real
          credential committed under it. The absence is the honest claim; the mechanism is
          named and the gap is measured. gap/split-literal-token.go assembles a GitHub-PAT
          shaped credential from three concatenated literals; scanned as a real git repository
          with this repository's config, gitleaks reported "no leaks found", while the
          compiler reassembles the credential verbatim.
  - id: HISS-13
    title: Monotonic Debt Ratchet
    coverage:
      - language: go
        state: partial
        runner: baseline
        mechanism: >-
          .standards-baseline.json (total_infractions 0) evaluated by praetorctl audit, reached
          by the lefthook pre-commit job hiss-audit, the lefthook pre-push job audit and the
          Makefile target audit inside make verify-all. The ratchet's reach is exactly the HISS
          scanner's rule set; no other tool's findings feed the baseline.
        rationale: >-
          Replayed by staging each fixture as a scanned package in this worktree and running
          praetorctl audit. positive/new-goto-debt.go -> "[FAIL] HISS invariant violations
          introduced (1 total infractions, 1 new unbaselined, 0 in touched files): [HISS-01]
          ... Legacy non-DAG control flow jump (goto) (new)". negative/clean-addition.go ->
          "[PASS] HISS invariant scan verified: 0 active violations within 0 baselined limit".
          gap/cyclomatic-debt.go is real HISS-04 debt -- golangci-lint reports 'cyclomatic
          complexity 12 of func `Classify` is high (> 10) (gocyclo)' -- and the same audit run
          reported "0 active violations", because golangci-lint findings never reach
          .standards-baseline.json.
  - id: HISS-14
    title: "Append-Only ABI & Migration Footers"
    coverage:
      - language: go
        state: manual
        runner: ci
        mechanism: >-
          Review, plus two conventions that record the intent without deciding the change: the
          "Breaking change" checkbox in .github/PULL_REQUEST_TEMPLATE.md, which asks for a
          `Migration:` section, and the Conventional-Commits `!` / `BREAKING CHANGE:` footer
          checked for SHAPE by scripts/hooks/commit-msg.sh and the CI job "PR title
          (Conventional Commits)" and consumed by release-please for the version bump. The CI
          job "API compatibility (apidiff)" executes against every discovered Go module and
          feeds the required aggregate gate; discovery or checker errors fail closed. Detected
          incompatibilities remain `::warning::` findings until v1.0.
        rationale: >-
          API coverage itself is complete and fail-closed, but nothing fails a build on a
          detected pre-v1 breaking change or checks that a `Migration:` footer is present --
          scripts/hooks/commit-msg.sh checks only the Conventional-Commits subject and DCO
          trailer. gap/removed-exported-func.go and gap/narrowed-exported-signature.go therefore
          remain honest gaps: both can land with an ordinary `fix(api):` subject.
  - id: HISS-15
    title: 3D Test Discipline
    coverage:
      - language: go
        state: partial
        runner: ci
        mechanism: >-
          CI job "Test (race + coverage)" applies the 70% aggregate to root/core; four "Module
          sweep" shards race-test every split module and retain coverage without a percentage
          floor. make ci-all race-tests all 26 modules. lefthook pre-push job build-test and the
          3D-testing PR checkbox provide narrower checks and self-attestation.
        rationale: >-
          Measured with go test -covermode=atomic against each fixture package.
          positive/untested-public-func.go exports Clamp with no sibling test and measured
          "coverage: 0.0% of statements", far below the 70% floor. negative/clamp.go plus
          clamp_test.go -- one table with positive, negative and boundary rows -- measured
          100.0% and passes, so the floor is not over-strict. The gap pair is the honest limit:
          gap/double.go is branchless and gap/double_test.go asserts only Double(21) == 42, yet
          the pair measures 100.0% statement coverage. A missing dimension is invisible to a
          statement-coverage floor, and the floor is an aggregate over the whole module, so it
          cannot decide any individual function either.
      - language: python
        state: partial
        runner: python-unittest
        mechanism: >-
          scripts/ci/python-tests.sh requires Python 3.12 or newer and executes the vendored
          Praetor checkpoint suite, command-policy hook suite, and portability-policy suite.
          Missing, linked, failing, or zero-test suites fail closed. make python-test runs
          inside make verify-all; GitHub Test and the Gitea CI gate run the same wrapper.
        rationale: >-
          The production run executes 48 tests: 33 current-Praetor checkpoint tests, five
          command-policy hook tests, and ten portability-policy tests.
          scripts/ci/python-tests-policy_test.sh proves positive/test_failing_suite.py fails and
          negative/test_complete_dimensions.py passes with positive, negative, and boundary
          cases. gap/test_positive_only.py also passes, proving unittest execution cannot
          decide 3D shape; gap/untested-public-function.py remains outside the required suites.
  - id: HISS-16
    title: "Canonical AGENTS.md & Server Gates"
    coverage:
      - language: go
        state: partial
        runner: compile-context
        mechanism: >-
          `praetorctl compile-context --verify`, reached by Makefile target
          compile-context-verify and lefthook pre-commit job context-check, verifies root
          projections and persona projections. Makefile target caveman-context, also inside
          make verify-all, lints every tracked AGENTS.md plus canonical personas, skills and
          Paperclip surfaces. Root AGENTS.md remains source for CLAUDE.md, .cursor/,
          .github/copilot-instructions.md, .windsurfrules, .gemini/ and .codex/.
        rationale: >-
          No positive fixture exists because projection comparison and bounded source
          discovery are repository-global properties no single fixture can exhibit. Measured
          `make caveman-context` across 248 canonical inputs and
          `make compile-context-verify` across root plus eight persona projections; both exit
          0. gap/nested-agents-context.md records remaining limit: nested AGENTS.md files are
          register-checked but not derived from root, so Caveman-compliant contradictions can
          persist. Praetor upstream issue #311 tracks missing native recursive coverage.
  - id: HISS-17
    title: State Ledger Discipline
    coverage:
      - language: go
        state: manual
        runner: state
        mechanism: >-
          The lefthook post-commit job state-sync (`praetorctl state sync .`), which maintains
          the git-ignored .workingdir/ ledger (BACKLOG.md, BUGS.md, OPEN.md, QUESTIONS.md,
          STATE.md, evidence/). `praetorctl state audit .` parses those current ledgers and
          returns a valid report only when the required private state exists and has no P0
          blocker.
        rationale: >-
          It is a recorder, not a gate, and is therefore declared manual rather than partial: it
          runs AFTER the commit is already made, a non-zero exit cannot reject anything, and
          .workingdir/ is listed twice in .gitignore, so CI never sees the ledger and cannot
          check it against the branch. Whether the ledger is accurate is upheld by whoever
          writes it. No fixture is declared, because no source file can exhibit the state of a
          ledger.
  - id: HISS-18
    title: CI Efficiency
    coverage:
      - language: go
        state: unsupported
        mechanism: >-
          none for the Go pipeline. .github/workflows/ci.yml triggers on every pull_request and
          every push to main with no `paths:` filter and no changed-files job selection, so all
          22 jobs run for a README-only change. Only docs.yml carries a paths filter. The
          efficiency measures that do exist -- concurrency with cancel-in-progress and the
          setup-go build/module cache -- shorten a run without selecting jobs by diff. Only the
          PR-title and DCO jobs exclude Renovate; that is event/actor applicability, not
          diff-aware gate selection.
        rationale: >-
          No fixture is declared, because the rule is about which jobs a workflow runs and no
          source file can exhibit that. The gap is the whole claim and it is stated above
          rather than implied: the Go jobs are not diff-aware at all.
  - id: HISS-19
    title: Reuse Before Writing
    coverage:
      - language: go
        state: partial
        runner: dedupe
        mechanism: >-
          `praetorctl dedupe scan .`, reached by the Makefile target dedupe-scan inside make
          verify-all, plus the lefthook post-commit job dedupe-cadence
          (`praetorctl dedupe cadence --threshold=20 --record .`), which records rather than
          gates.
        rationale: >-
          Measured by running the scan over a module holding just the fixtures. The positive
          pair reported "Duplicate Function Blocks (1): 12 lines ... duplicated-block-a.go:12
          in NormalizeName() / duplicated-block-b.go:12 in NormalizeLabel()", scored 85.0% and
          exited non-zero. gap/renamed-clone.go performs exactly the same normalisation with
          every local renamed and the two guards reordered; scanned next to
          duplicated-block-a.go it scored 100.0% and passed, so a rename plus a reorder defeats
          the comparison.
  - id: HISS-20
    title: Replayable Enforcement Evidence
    coverage:
      - language: go
        state: partial
        runner: hiss-coverage
        mechanism: >-
          This file, replayed against .config/hiss/testdata by `praetorctl hiss coverage
          --verify` via the Makefile target hiss-coverage inside make verify-all and the
          lefthook pre-commit job hiss-coverage, next to hiss-audit.
        rationale: >-
          No positive fixture exists because the corpus IS this rule's evidence: the meta-rule
          is satisfied exactly when the other nineteen claims survive their own fixtures, and a
          file demonstrating "an undeclared mechanism" would be a copy of this catalogue rather
          than a source file. partial, not enforced, for two measured reasons. First, of the 33
          claims declared here only 22 are replayed by the verifier; the other 11 name a tool
          it does not run, so for those it checks the attribution and the rationale carries the
          measurement instead. Second, four claims (HISS-11, HISS-12, HISS-16 and HISS-20
          itself) are backed by a named mechanism and a measured gap but by no positive
          fixture, and a delegated claim's missing positive bucket is not flagged by the
          verifier at all -- which is exactly why each absence is argued in its own rationale
          rather than left to be inferred.
  - id: HISS-21
    title: Platform Neutrality
    coverage:
      - language: go
        state: partial
        runner: portability
        mechanism: >-
          scripts/ci/portability.py discovers 1..64 Git-visible Go modules, requires the root
          module and 1..512 packages per module, then runs go build, go vet, and go test -short
          without a command shell. make portability-test runs the same driver locally;
          .github/workflows/portability.yml runs it on Linux, macOS, and Windows with
          fail-fast disabled and digest-pinned toolchain actions.
        rationale: >-
          scripts/ci/portability_test.py proves every discovered module receives all three
          phases; a Git-reported worktree deletion is excluded while an unknown deletion fails
          closed; empty discovery, missing root, zero packages, ambiguous separators, and a
          failed phase also fail closed; the 64-module bound is inclusive while 65 is refused.
          positive/windows-compile-break.go is selected and rejected by the Windows build;
          negative/portable-path.go delegates separators to filepath. The claim remains
          partial: gap/silent-platform-skip_test.go exits green after skipping its only Windows
          behavior because the driver proves packages and phases, not per-test execution.
          macOS and Windows remain hosted-only evidence until their first green run; their
          status contexts are therefore deliberately absent from the active ruleset.
