id: "agent:sandboxed"
name: "Autonomous Agent Sandboxing & Fleet Governance"
description: "Enforces canonical AGENTS.md transpilation (HISS-16), cgroup resource caps, network isolation, anti-evasion hooks, and anti-loop interception"

linters:
  - "semgrep"
  - "gocyclo"

devcontainer_features:
  - ghcr.io/devcontainers/features/common-utils:2:
      installZsh: false
      configureZshAsDefaultShell: false
      installOhMyZsh: false
      installOhMyZshConfig: false
      upgradePackages: true
      username: "vscode"
      userUid: "1000"
      userGid: "1000"
      sudoers: true
      nonFreePackages: false
      installSsl: true
