id: "api:public-contract"
name: "Public API Contract & Stability"
description: "Enforces append-only ABI evolution (HISS-14), OpenAPI schema drift checks, and breaking change PR footers"

branch_protection:
  enforce_linear_history: true
  require_signed_commits: true
  required_approving_reviewers: 2
  dismiss_stale_reviews: true

linters:
  - "buf"
  - "spectral"
  - "oapi-codegen"

devcontainer_features:
  - ghcr.io/devcontainers/features/common-utils:2:
      installZsh: false
      configureZshAsDefaultShell: false
      installOhMyZsh: false
      installOhMyZshConfig: false
      upgradePackages: true
      username: "vscode"
      userUid: "1000"
      userGid: "1000"
      sudoers: true
      nonFreePackages: false
      installSsl: true
