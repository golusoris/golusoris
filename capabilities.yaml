    replaces: [github.com/go-faster/errors, github.com/pkg/errors]
  - import: github.com/golusoris/golusoris/core/gitx
    module: github.com/golusoris/golusoris/core
    domain: git
    capabilities: [git.runner]
    description: "Package gitx runs git with the bounds the framework requires of every subprocess: an explicit context deadline, argument validation, and captured output of boun"
  - import: github.com/golusoris/golusoris/core/gitx/worktree
    module: github.com/golusoris/golusoris/core
    domain: git
    capabilities: [git.worktree]
    description: "Package worktree manages ephemeral git worktrees under a repository — one per task, on its own branch — so agents and CI jobs work in isolation and are cleaned "
  - import: github.com/golusoris/golusoris/core/id
    module: github.com/golusoris/golusoris/core
    domain: id
    capabilities: [id.uuid, id.ksuid]
    description: "Package id provides standardized identifier generators for golusoris apps."
    replaces: [github.com/gofrs/uuid, github.com/oklog/ulid, github.com/rs/xid, github.com/segmentio/ksuid]
  - import: github.com/golusoris/golusoris/core/log
    module: github.com/golusoris/golusoris/core
    domain: telemetry
    capabilities: [telemetry.logging]
