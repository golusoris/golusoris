#
# Capability contract: every importable golusoris package, the capability keys
# it satisfies, and the third-party modules it supersedes. Downstream governance
# (cordanallm/praetor: needs scan | report | migrate) resolves .needs.yaml demands
# against this file; capabilities_test.go keeps it in sync with the tree.
# Schema: core/capabilities (version 1). Keys: domain.name[.sub], lowercase.
# Regenerate the skeleton with scripts/capabilities/generate.py; hand-tune keys.
version: 1
framework: github.com/golusoris/golusoris
modules:
  - github.com/golusoris/golusoris/core
  - github.com/golusoris/golusoris/deploy/multiregion
  - github.com/golusoris/golusoris/deploy/pulumi
  - github.com/golusoris/golusoris/hw/fssnap
  - github.com/golusoris/golusoris/hw/gpio
  - github.com/golusoris/golusoris/hw/robotics
  - github.com/golusoris/golusoris/hw/udev
  - github.com/golusoris/golusoris/media/3d
  - github.com/golusoris/golusoris/media/audio
  - github.com/golusoris/golusoris/media/av
  - github.com/golusoris/golusoris/media/cv
  - github.com/golusoris/golusoris/media/game
  - github.com/golusoris/golusoris/media/img
  - github.com/golusoris/golusoris/ocr
  - github.com/golusoris/golusoris/pdf
  - github.com/golusoris/golusoris/science/bio
  - github.com/golusoris/golusoris/science/numerical
  - github.com/golusoris/golusoris/science/plot
  - github.com/golusoris/golusoris/testutil/pact
  - github.com/golusoris/golusoris/web3/evm
  - github.com/golusoris/golusoris/web3/solana
packages:
  - import: github.com/golusoris/golusoris/core/astx
    module: github.com/golusoris/golusoris/core
    domain: ast
    capabilities: [ast.analyzer, ast.rewrite]
    description: "Package astx holds the Go-source analysis primitives the framework's tooling shares — a bounded source walker, an AST-based import rewriter (the `golusoris bump"
  - import: github.com/golusoris/golusoris/core/capabilities
    module: github.com/golusoris/golusoris/core
    domain: needs
    capabilities: [needs.capabilities]
    description: "Package capabilities defines the framework's machine-readable capability contract: the schema of the repository-root capabilities.yaml that maps every golusoris"
  - import: github.com/golusoris/golusoris/core/clikit
    module: github.com/golusoris/golusoris/core
    domain: clikit
    capabilities: [clikit.cli, clikit.cobra, clikit.ioc]
    description: "Package clikit provides a cobra + fx-aware CLI builder."
    replaces: [github.com/alecthomas/kong, github.com/spf13/cobra, github.com/spf13/pflag, github.com/urfave/cli]
  - import: github.com/golusoris/golusoris/core/clock
    module: github.com/golusoris/golusoris/core
    domain: time
    capabilities: [time.clock]
    description: "Package clock exposes a mockable wall clock."
    replaces: [github.com/jonboulle/clockwork]
  - import: github.com/golusoris/golusoris/core/codec/yaml
    module: github.com/golusoris/golusoris/core
    domain: config
    capabilities: [config.yaml]
    description: "Package yaml is the framework's single YAML codec."
    replaces: [github.com/goccy/go-yaml, go.yaml.in/yaml/v3, gopkg.in/yaml.v2, gopkg.in/yaml.v3, sigs.k8s.io/yaml]
  - import: github.com/golusoris/golusoris/core/config
    module: github.com/golusoris/golusoris/core
    domain: config
    capabilities: [config.loader, config.env, config.watch]
    description: "Package config is golusoris's config layer: a thin koanf v2 wrapper that loads from env + optional YAML/JSON files, with file-watch enabled by default so a moun"
    replaces: [github.com/caarlos0/env, github.com/go-viper/mapstructure/v2, github.com/kelseyhightower/envconfig, github.com/knadh/koanf, github.com/knadh/koanf/parsers/json, github.com/knadh/koanf/parsers/yaml, github.com/knadh/koanf/providers/env/v2, github.com/knadh/koanf/providers/file, github.com/knadh/koanf/v2, github.com/spf13/viper]
  - import: github.com/golusoris/golusoris/core/crypto
    module: github.com/golusoris/golusoris/core
    domain: crypto
    capabilities: [crypto.password, crypto.aead, crypto.token]
    description: "Package crypto bundles golusoris's small set of cryptographic primitives: argon2id password hashing, AES-GCM symmetric encryption, and secure-random helpers."
    replaces: [github.com/alexedwards/argon2id]
  - import: github.com/golusoris/golusoris/core/crypto/receipt
    module: github.com/golusoris/golusoris/core
    domain: crypto
    capabilities: [crypto.receipt]
