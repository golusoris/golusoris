  - import: github.com/golusoris/golusoris/auth/jwt
    domain: auth
    capabilities: [auth.jwt]
    description: "Package jwt provides helpers for signing and verifying JWTs using golang-jwt/jwt/v5."
    replaces: [github.com/golang-jwt/jwt, github.com/golang-jwt/jwt/v5, github.com/lestrrat-go/jwx]
  - import: github.com/golusoris/golusoris/auth/linking
    domain: auth
    capabilities: [auth.linking]
