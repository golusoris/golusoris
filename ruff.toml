# Only Ruff rule source: scripts/ci/python-lint.sh passes this file with --config, and Codacy
# reads it once its Ruff tool uses the configuration file.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S", "RUF", "PERF", "ASYNC", "C90"]
