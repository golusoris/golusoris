# CI-only object store for scripts/ci/cnpg-restore.sh; @...@ tokens are rendered from pins.
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-creds
  namespace: cnpg-restore
type: Opaque
stringData:
  ACCESS_KEY_ID: golusoris-test
  SECRET_ACCESS_KEY: golusoris-test-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: versitygw
  namespace: cnpg-restore
  labels:
    app: versitygw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: versitygw
  template:
    metadata:
      labels:
        app: versitygw
    spec:
      initContainers:
        - name: init-bucket
          image: "@CNPG_POSTGRES_IMAGE@"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "mkdir -p /data/backups"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: versitygw
          image: "@VERSITY_IMAGE@"
          imagePullPolicy: Never
          args: ["posix", "/data"]
          env:
            - name: ROOT_ACCESS_KEY
              value: golusoris-test
            - name: ROOT_SECRET_KEY
              value: golusoris-test-secret
          ports:
            - containerPort: 7070
              name: s3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: versitygw
  namespace: cnpg-restore
spec:
  selector:
    app: versitygw
  ports:
    - port: 7070
      targetPort: 7070
      name: s3
