# CI-only on-demand base backup of pg-source for scripts/ci/cnpg-restore.sh.
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: pg-source-backup
  namespace: cnpg-restore
spec:
  cluster:
    name: pg-source
  method: barmanObjectStore
