---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: logging
data:
  config.alloy: |
    discovery.kubernetes "kubernetes_pods" {
      role = "pod"

      selectors {
        role  = "pod"
        field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
      }
    }

    loki.process "kubernetes_pods" {
      forward_to = [loki.write.default.receiver]

      stage.cri {
        max_partial_lines              = 100
        max_partial_line_size          = 262144
        max_partial_line_size_truncate = true
      }

      stage.labels {
        values = {
          stream = "",
        }
      }
    }

    discovery.relabel "kubernetes_pods" {
      targets = discovery.kubernetes.kubernetes_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "__host__"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "(kube-system|kube-public)"
        action        = "drop"
      }
    }

    loki.source.file "kubernetes_pods" {
      targets                 = discovery.relabel.kubernetes_pods.output
      forward_to              = [loki.process.kubernetes_pods.receiver]
      legacy_positions_file   = "/run/promtail/positions.yaml"
      on_positions_file_error = "restart_from_end"
      tail_from_end           = true

      file_match {
        enabled = true
      }
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.logging:3100/loki/api/v1/push"
      }
    }
