{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "golusoris-app.fullname" . }}
  labels:
    {{- include "golusoris-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
