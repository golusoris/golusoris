# Default values for golusoris-app.

replicaCount: 2

image:
  repository: ghcr.io/example/myapp
  pullPolicy: IfNotPresent
  # Required at render time. Never substitute a tag.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

startupProbe:
  httpGet:
    path: /startupz
    port: http
  failureThreshold: 30
  periodSeconds: 2

# Graceful termination. delaySeconds is the window in which endpoint removal
# reaches kube-proxy and load balancers before servers stop. With preStop the
# kubelet sleeps that long before SIGTERM (native sleep action, Kubernetes
# >= 1.30, no shell needed) and the app's own wait is 0s; without it the app
# (k8s/health.Module) fails /readyz on SIGTERM and waits delaySeconds itself.
# The app then drains HTTP/gRPC within shutdownSeconds. Rendered as
# <envPrefix>HEALTH_DRAIN_DELAY and <envPrefix>HTTP_TIMEOUTS_SHUTDOWN; keep the
# app's fx.StopTimeout (default 15s) above the in-app wait plus shutdownSeconds.
drain:
  delaySeconds: 5
  preStop: true
  shutdownSeconds: 10
  envPrefix: APP_

# Must exceed drain.delaySeconds + drain.shutdownSeconds; rendering fails otherwise.
terminationGracePeriodSeconds: 30

env: {}
envFrom: []

config: {}  # key-value pairs → ConfigMap → envFrom

secrets: {}  # key-value pairs → Secret (base64 encoded by Helm)

networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  ingressPodSelector: {}

serviceMonitor:
  enabled: false
  interval: 15s
  path: /metrics
  namespace: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Downward API env vars injected automatically (matches k8s/podinfo expectations)
downwardAPI:
  enabled: true

# ─────────────────────────────────────────────────────────────────────
# Scheduled pg_dump → S3/minio backup CronJob.
# Disabled by default. Enable + fill in s3.bucket + credentials secret.
# ─────────────────────────────────────────────────────────────────────
backup:
  enabled: false
  schedule: "0 2 * * *"          # 02:00 UTC daily
  dbName: app
  retentionDays: 14              # S3 lifecycle-style prune
  activeDeadlineSeconds: 3600    # job killswitch (1h)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  # Supply an owned image with pg_dump, gzip, coreutils, and AWS CLI v2.
  # Enabling backup without both fields makes Helm rendering fail closed.
  image:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent

  # Secret holding the database DSN. Key is the secret key name inside.
  databaseUrlSecret:
    name: myapp-db
    key: dsn

  # S3 (or any S3-compatible: minio, R2, B2, Wasabi).
  s3:
    bucket: ""
    prefix: ""                   # defaults to <fullname>-backups
    region: us-east-1
    # Leave empty for AWS S3. Set for minio (http://minio:9000), R2, etc.
    endpoint: ""
    credentialsSecret:
      name: myapp-backup-s3
