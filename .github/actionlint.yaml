# actionlint config: https://github.com/rhysd/actionlint/blob/main/docs/config.md
#
# actionlint has no way to know about our GitHub ARC and Gitea self-hosted
# runner-set labels, so it flags their literal `runs-on` values as unknown
# (the `runner-label` check). Declaring both here is the documented fix.
# `runs-on: ${{ inputs.runs-on }}` (an expression) is unaffected either way —
# actionlint only checks literal label strings.
self-hosted-runner:
  labels:
    - arc-cauda-golusoris-golusoris
    - cauda-k8s-office-canary
    - ubuntu-26.04
