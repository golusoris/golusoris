name: Set up repository Go toolchain
description: Install the go.mod toolchain with the shared all-module cache key

inputs:
  cache:
    description: Enable the Go module and build caches
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version-file: go.mod
        cache: ${{ inputs.cache }}
        cache-dependency-path: '**/go.sum'
