# Renovate owns the bump, the merge train commits the rebuilt bundle (ADR-0032
# of plurano/horistes); this job fails when the embedded release passes the
# age bound.
name: scalar-bundle

on:
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scalar-bundle
  cancel-in-progress: false

jobs:
  check:
    name: Check embedded bundle age
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check embedded release age
        run: bash scripts/ci/scalar-bundle-update.sh age-check
