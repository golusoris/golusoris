# Dispatch-only proof that the release jobs' pinned tool installs work on the
# hosted runner, without cutting a release. It installs the same versions
# through the same SHA-pinned actions as release.yml, release-go.yml,
# rebuild-on-base.yml and tiny-trainer-images.yml, then checks each version and
# a local cosign sign/verify round trip.
name: Release runner tool contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: Verify pinned release tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.52.0

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          install-only: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          bash scripts/ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Verify the release runtime contract
        shell: bash
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          test -n "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          test -w "$RUNNER_TOOL_CACHE"
          for tool in bash git curl tar gzip zip sha256sum gh go node docker cosign syft goreleaser gitleaks; do
            command -v "$tool"
          done
          gh --version
          go version
          node --version
          docker info
          docker buildx version | grep -Eq '^github.com/docker/buildx v0\.37\.1([[:space:]]|$)'
          cosign version | grep -Eq '^GitVersion:[[:space:]]+v?3\.1\.3(\+dirty)?[[:space:]]*$'
          syft version | grep -Eq 'Version:[[:space:]]+1\.52\.0([[:space:]]|$)'
          goreleaser --version | grep -Eq 'GitVersion:[[:space:]]+v?2\.18\.3([[:space:]]|$)'
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
          roundtrip_dir="$(mktemp -d "$RUNNER_TEMP/cosign-roundtrip.XXXXXX")"
          trap 'rm -rf "$roundtrip_dir"' EXIT
          printf 'release contract\n' > "$roundtrip_dir/artifact"
          (
            cd "$roundtrip_dir"
            COSIGN_PASSWORD='' cosign generate-key-pair
            COSIGN_PASSWORD='' cosign sign-blob --yes --key cosign.key \
              --bundle artifact.sigstore.json artifact
            cosign verify-blob --key cosign.pub \
              --bundle artifact.sigstore.json artifact
          )

      - name: Select the repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify the selected Go toolchain
        run: go version
