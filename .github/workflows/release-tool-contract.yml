name: Release runner tool contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: Verify rootless release tools
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify the release runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          test -w "$RUNNER_TOOL_CACHE"
          command -v verify-arc-runner-tools
          verify-arc-runner-tools
          for tool in bash git curl tar gzip zip sha256sum gh go node docker cosign syft goreleaser gitleaks; do
            command -v "$tool"
          done
          gh --version
          go version
          node --version
          docker --version
          docker buildx version | grep -q 'v0.36.1'
          cosign version | grep -Eq 'GitVersion:[[:space:]]+v?3\.1\.3([[:space:]]|$)'
          syft version | grep -Eq 'Version:[[:space:]]+1\.51\.1([[:space:]]|$)'
          goreleaser --version | grep -Eq 'GitVersion:[[:space:]]+v?2\.18\.0([[:space:]]|$)'
          test "$(gitleaks version)" = "8.30.1"
          roundtrip_dir="$(mktemp -d "$RUNNER_TEMP/cosign-roundtrip.XXXXXX")"
          trap 'rm -rf "$roundtrip_dir"' EXIT
          printf 'release contract\n' > "$roundtrip_dir/artifact"
          (
            cd "$roundtrip_dir"
            COSIGN_PASSWORD='' cosign generate-key-pair
            COSIGN_PASSWORD='' cosign sign-blob --yes --key cosign.key \
              --bundle artifact.sigstore.json artifact
            cosign verify-blob --key cosign.pub \
              --bundle artifact.sigstore.json artifact
          )

      - name: Select the repository Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify the selected Go toolchain
        run: go version
