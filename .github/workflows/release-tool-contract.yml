# Proof on workflow_dispatch and on pull requests changing release tool files
# that the release jobs' pinned tool installs work on the hosted runner without
# cutting a release, installing the same versions through the same SHA-pinned
# actions as the release workflows, then checking each version and a local cosign
# sign/verify round trip.
name: Release runner tool contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-build.yml
      - .github/workflows/release-go.yml
      - .github/workflows/release-tool-contract.yml
      - .github/workflows/rebuild-on-base.yml
      - .github/workflows/tiny-litert-sidecar-image.yml
      - .github/workflows/tiny-trainer-images.yml
      - tools/tool-versions.env

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tools:
    name: Verify pinned release tools
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          install-only: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.1

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          bash scripts/ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Verify the release runtime contract
        shell: bash
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          test -n "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          test -w "$RUNNER_TOOL_CACHE"
          for tool in bash git curl tar gzip zip sha256sum gh go node docker cosign syft goreleaser gitleaks; do
            command -v "$tool"
          done
          gh --version
          go version
          node --version
          docker info
          docker buildx version | grep -Eq '^github.com/docker/buildx v0\.38\.1([[:space:]]|$)'
          cosign version | grep -Eq '^GitVersion:[[:space:]]+v?3\.1\.4(\+dirty)?[[:space:]]*$'
          syft version | grep -Eq 'Version:[[:space:]]+1\.54\.1([[:space:]]|$)'
          goreleaser --version | grep -Eq 'GitVersion:[[:space:]]+v?2\.18\.3([[:space:]]|$)'
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
          roundtrip_dir="$(mktemp -d "$RUNNER_TEMP/cosign-roundtrip.XXXXXX")"
          trap 'rm -rf "$roundtrip_dir"' EXIT
          printf 'release contract\n' > "$roundtrip_dir/artifact"
          (
            cd "$roundtrip_dir"
            COSIGN_PASSWORD='' cosign generate-key-pair
            COSIGN_PASSWORD='' cosign sign-blob --yes --key cosign.key \
              --bundle artifact.sigstore.json artifact
            cosign verify-blob --key cosign.pub \
              --bundle artifact.sigstore.json artifact
          )

      - name: Select the repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify the selected Go toolchain
        run: go version
