name: Platform Neutrality

on:
  pull_request:
    branches:
      - main
      - 'lts-*'
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - 'lts-*'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# main requires these matrix contexts, so the merge queue runs them too; each leg had its first hosted green
# before it became required: Platform Neutrality (Linux), Platform Neutrality (macOS), Platform Neutrality (Windows).
jobs:
  portability:
    name: Platform Neutrality (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-26.04
          - name: macOS
            runner: macos-26
          - name: Windows
            runner: windows-2025
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - name: Verify portability driver policy
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/ci/portability_test.py
      - name: Install cgo system libraries on Linux
        # hw/udev links libudev; media/3d links OpenAL, Vorbis, GL and X11 (go-gl/glfw).
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci/install-cgo-libs.sh
      - name: Install verified Pact FFI on Unix
        if: runner.os != 'Windows'
        run: |
          pact_dir="${RUNNER_TEMP}/pact-ffi"
          install -d -m 0700 "$pact_dir"
          python -B scripts/ci/pact_ffi.py --lib-dir "$pact_dir"
          echo "PACT_GO_LIB_DOWNLOAD_PATH=$pact_dir" >> "$GITHUB_ENV"
          # pact-go's cgo flags search only /tmp, /opt/pact/lib and /usr/local/lib.
          echo "CGO_LDFLAGS=-L$pact_dir -Wl,-rpath,$pact_dir" >> "$GITHUB_ENV"
      - name: Install verified Pact FFI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pactDir = Join-Path $env:RUNNER_TEMP 'pact-ffi'
          New-Item -ItemType Directory -Force -Path $pactDir | Out-Null
          python -B scripts/ci/pact_ffi.py --lib-dir $pactDir
          $pactDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CGO_LDFLAGS=-L$pactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACT_GO_LIB_DOWNLOAD_PATH=$pactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build, vet, and short-test every Go module
        env:
          GOFLAGS: -mod=readonly
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/ci/portability.py
