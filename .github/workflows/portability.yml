name: Platform Neutrality

on:
  pull_request:
    branches:
      - main
      - 'lts-*'
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - 'lts-*'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# main requires these matrix contexts, so the merge queue runs them too; each leg had its first hosted green
# before it became required: Platform Neutrality (Linux), Platform Neutrality (Linux arm64), Platform Neutrality (macOS), Platform Neutrality (macOS Intel), Platform Neutrality (Windows).
# Platform Neutrality (Windows arm64) is advisory (continue-on-error) until #1341 is fixed.
jobs:
  portability:
    name: Platform Neutrality (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-26.04
          # Release archives ship linux/arm64 binaries (tools/.goreleaser.yml).
          - name: Linux arm64
            runner: ubuntu-26.04-arm
          - name: macOS
            runner: macos-26
          # Release archives ship darwin/amd64 binaries (tools/.goreleaser.yml).
          - name: macOS Intel
            runner: macos-15-intel
          - name: Windows
            runner: windows-2025
    steps: &portability-steps
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Decide the CI scope gate
        shell: bash
        env:
          CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          gated="$(python -B scripts/ci/ci_scope.py gate)"
          case "$gated" in run | skip) ;; *) echo "::error::ci-scope gate printed: $gated"; exit 1 ;; esac
          echo "CI_GATED=$gated" >> "$GITHUB_ENV"
          echo "ci-scope: gate=$gated" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Go
        if: env.CI_GATED != 'skip'
        uses: ./.github/actions/setup-go
      - name: Verify portability driver policy
        if: env.CI_GATED != 'skip'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/ci/portability_test.py
      - name: Release depth gate on this platform
        # The release job runs it on Linux; this leg proves it on macOS bash 3.2 and Git Bash too.
        if: env.CI_GATED != 'skip'
        shell: bash
        env:
          PYTHON: python
        run: bash scripts/ci/release-depth-evidence_test.sh
      - name: Install cgo system libraries on Linux
        # hw/udev links libudev; media/3d links OpenAL, Vorbis, GL and X11 (go-gl/glfw).
        if: runner.os == 'Linux' && env.CI_GATED != 'skip'
        timeout-minutes: 15
        uses: ./.github/actions/install-cgo-libs
      - name: Resolve Pact FFI asset digest
        id: pact-ffi-asset
        if: env.CI_GATED != 'skip'
        shell: bash
        run: |
          digest="$(python -B scripts/ci/pact_ffi.py --asset-digest)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad Pact FFI asset digest: $digest" >&2; exit 1; }
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Cache verified Pact FFI on Unix
        if: runner.os != 'Windows' && env.CI_GATED != 'skip'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .workingdir/cache/pact-ffi
          key: pact-ffi-${{ runner.os }}-${{ runner.arch }}-${{ steps.pact-ffi-asset.outputs.sha256 }}
      - name: Install verified Pact FFI on Unix
        if: runner.os != 'Windows' && env.CI_GATED != 'skip'
        run: |
          # go1.27.4 walks pact-go's -L/tmp while /tmp is os.TempDir(); move temp files outside that scan.
          install -d -m 0700 "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          pact_dir="${RUNNER_TEMP}/pact-ffi"
          install -d -m 0700 "$pact_dir"
          python -B scripts/ci/pact_ffi.py --cache-dir .workingdir/cache/pact-ffi --lib-dir "$pact_dir"
          echo "PACT_GO_LIB_DOWNLOAD_PATH=$pact_dir" >> "$GITHUB_ENV"
          # pact-go's cgo flags search only /tmp, /opt/pact/lib and /usr/local/lib.
          echo "CGO_LDFLAGS=-L$pact_dir -Wl,-rpath,$pact_dir" >> "$GITHUB_ENV"
      - name: Resolve llvm-mingw archive pin on Windows arm64
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && env.CI_GATED != 'skip'
        id: llvm-mingw-pin
        shell: bash
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          [[ "$LLVM_MINGW_VERSION" =~ ^[0-9]{8}$ ]]
          [[ "$LLVM_MINGW_UCRT_AARCH64_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf 'version=%s\n' "$LLVM_MINGW_VERSION" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$LLVM_MINGW_UCRT_AARCH64_SHA256" >> "$GITHUB_OUTPUT"
      - name: Cache llvm-mingw archive on Windows arm64
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && env.CI_GATED != 'skip'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .workingdir/cache/llvm-mingw
          key: llvm-mingw-${{ runner.os }}-${{ runner.arch }}-${{ steps.llvm-mingw-pin.outputs.sha256 }}
      - name: Install pinned llvm-mingw on Windows arm64
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && env.CI_GATED != 'skip'
        timeout-minutes: 18
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: ${{ steps.llvm-mingw-pin.outputs.version }}
          LLVM_MINGW_UCRT_AARCH64_SHA256: ${{ steps.llvm-mingw-pin.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-aarch64"
          $cache = Join-Path $env:GITHUB_WORKSPACE '.workingdir/cache/llvm-mingw'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $archive = Join-Path $cache "$name.zip"
          if (-not (Test-Path -LiteralPath $archive)) {
            $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip"
            foreach ($attempt in 1..3) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $archive -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 300
                break
              } catch {
                if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:LLVM_MINGW_UCRT_AARCH64_SHA256) {
            throw 'llvm-mingw archive digest mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = Join-Path $destination "$name/bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:CC = 'aarch64-w64-mingw32-clang'
          $env:CXX = 'aarch64-w64-mingw32-clang++'
          "CC=$env:CC", "CXX=$env:CXX" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $bin "$env:CC.exe") --version
          if ($LASTEXITCODE -ne 0) { throw 'llvm-mingw compiler version check failed' }
      - name: Cache verified Pact FFI on Windows
        if: runner.os == 'Windows' && env.CI_GATED != 'skip'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .workingdir/cache/pact-ffi
          key: pact-ffi-${{ runner.os }}-${{ runner.arch }}-${{ steps.pact-ffi-asset.outputs.sha256 }}
      - name: Install verified Pact FFI on Windows
        if: runner.os == 'Windows' && env.CI_GATED != 'skip'
        shell: pwsh
        run: |
          $pactDir = Join-Path $env:RUNNER_TEMP 'pact-ffi'
          New-Item -ItemType Directory -Force -Path $pactDir | Out-Null
          python -B scripts/ci/pact_ffi.py --cache-dir .workingdir/cache/pact-ffi --lib-dir $pactDir
          $pactDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CGO_LDFLAGS=-L$pactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACT_GO_LIB_DOWNLOAD_PATH=$pactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Time SQLite open phases on Windows (#778)
        if: runner.os == 'Windows' && env.CI_GATED != 'skip'
        shell: bash
        env:
          GOFLAGS: -mod=readonly
        run: go test -run '^TestOpenPhaseTimings$' -count=1 -v ./db/sqlite/
      - name: Build, vet, and short-test every Go module
        if: env.CI_GATED != 'skip'
        env:
          GOFLAGS: -mod=readonly
          PYTHONDONTWRITEBYTECODE: '1'
          CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python -B scripts/ci/portability.py

  portability-advisory:
    name: Platform Neutrality (Windows arm64)
    runs-on: windows-11-arm
    timeout-minutes: 90
    continue-on-error: true
    steps: *portability-steps
