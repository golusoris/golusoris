# release-please prepares release metadata on public GitHub. Gitea remains the
# canonical source: an equivalent Gitea PR must pass canonical CI before its
# immutable vX.Y.Z tag is created there and forwarded to GitHub.
name: release-please

# Serialize release-PR maintenance; cancel a stale run when a newer push
# supersedes it (#196).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Release-PR-only mode: tags and releases originate on Gitea.
          skip-github-release: true
