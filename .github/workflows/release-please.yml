# release-please prepares release metadata on public GitHub. Gitea remains the
# canonical source: an equivalent Gitea PR must pass canonical CI before its
# immutable vX.Y.Z tag is created there and forwarded to GitHub.
name: release-please

# Serialize release-PR maintenance; cancel a stale run when a newer push
# supersedes it (#196).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A release pull request opened with the workflow token starts no checks; the App token does.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Release-PR-only mode: tags and releases originate on Gitea.
          skip-github-release: true

  # The CI runs of a pull request opened with the repository token wait for an
  # approval, and main requires the CI success check. A dispatched run does not
  # count for the pull request, so the waiting runs are approved here.
  release-pr-ci:
    name: Run CI on the release pull request
    needs: release-please
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Approve the waiting runs on the release branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release-pr-ci.sh "$GITHUB_REPOSITORY"
