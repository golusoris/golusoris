---
name: Generated files

on:
  push:
    branches:
      - 'renovate/**'

permissions:
  contents: read

concurrency:
  group: regen-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    name: Regenerate generated files
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Regenerate generated files
        run: python3 -B scripts/ci/regenerate.py write --out "$RUNNER_TEMP/regenerated"

      - name: Write step summary
        env:
          MANIFEST: ${{ runner.temp }}/regenerated/manifest.json
        run: |
          python3 -B - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          path = pathlib.Path(os.environ["MANIFEST"])
          if path.is_file():
              manifest = json.loads(path.read_text(encoding="utf-8"))
              print(manifest["head"] + ": " + ", ".join(f["path"] for f in manifest["files"]))
          else:
              print("nothing to regenerate")
          PY

      - name: Upload regenerated files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regenerated-${{ github.sha }}
          path: ${{ runner.temp }}/regenerated
          if-no-files-found: ignore
          retention-days: 7
