name: tiny trainer images

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # main requires the contract and smoke contexts, so the merge queue runs them too.
  merge_group:
  push:
    tags:
      - 'tiny-trainers-v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish immutable images instead of build-only validation'
        required: true
        default: false
        type: boolean
      version:
        description: 'Immutable vX.Y.Z image tag; required when publish is true'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tiny-trainers-${{ inputs.version || github.ref }}
  # Only build-only PR runs cancel; the publish job keeps its own non-cancelling group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Python contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Run positive, negative, and boundary contracts
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          python3 scripts/ci/ci_scope.py any 'ai/tiny/*' || rc=$?
          if ((rc == 1)); then
            printf 'ci-scope: no ai/tiny files changed; skipping unittest\n'
            exit 0
          elif ((rc != 0)); then
            exit "$rc"
          fi
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=ai/tiny \
            python -m unittest discover -s ai/tiny/trainers -p 'test_*.py' -v

      - name: Verify direct pins and hash locks are coupled
        shell: bash
        run: bash scripts/ci/tiny-trainer-locks.sh --check

      - name: Audit hash-locked dependencies
        shell: bash
        run: bash scripts/ci/tiny-trainer-locks.sh --audit

  build-only:
    name: Build and smoke (${{ matrix.trainer }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        trainer: [gemma, litert]
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read release tool pins
        shell: bash
        run: bash scripts/ci/export-release-tool-pins.sh

      - uses: ./.github/actions/setup-oci-publish

      - name: Build multi-arch (validation only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ai/tiny/trainers/${{ matrix.trainer }}
          file: ai/tiny/trainers/${{ matrix.trainer }}/Dockerfile
          build-contexts: |
            common=ai/tiny/trainers/common
          build-args: |
            VCS_REF=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: local/tiny-${{ matrix.trainer }}-trainer:multiarch-${{ github.sha }}

      - name: Build amd64 for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ai/tiny/trainers/${{ matrix.trainer }}
          file: ai/tiny/trainers/${{ matrix.trainer }}/Dockerfile
          build-contexts: |
            common=ai/tiny/trainers/common
          build-args: |
            VCS_REF=${{ github.sha }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/tiny-${{ matrix.trainer }}-trainer:${{ github.sha }}

      - name: Smoke fixed non-root I/O contract
        shell: bash
        env:
          IMAGE: local/tiny-${{ matrix.trainer }}-trainer:${{ github.sha }}
          TRAINER: ${{ matrix.trainer }}
        run: TMPDIR="$RUNNER_TEMP" bash scripts/ci/tiny-trainer-smoke.sh "$TRAINER" "$IMAGE"

  publish-policy:
    name: Verify publication controls
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require explicit remote-control enablement
        shell: bash
        env:
          PUBLISH_ENABLED: ${{ vars.TINY_TRAINER_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_ENABLED" != true ]]; then
            printf '%s\n' 'trainer publication is blocked until the protected environment and tag ruleset exist' >&2
            exit 1
          fi

  publish:
    name: Publish (${{ matrix.trainer }})
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [contracts, publish-policy]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: tiny-trainer-publish
    concurrency:
      group: tiny-trainers-publish-${{ matrix.trainer }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - trainer: gemma
            image: tiny-gemma-trainer
          - trainer: litert
            image: tiny-litert-trainer
    env:
      IMAGE_NAME: ${{ matrix.image }}
      IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Publish verified tiny image
        id: image
        uses: ./.github/actions/publish-tiny-image
        with:
          version: ${{ inputs.version }}
          tag-prefix: tiny-trainers-
          error-prefix: ${{ matrix.trainer }}
          context: ai/tiny/trainers/${{ matrix.trainer }}
          dockerfile: ai/tiny/trainers/${{ matrix.trainer }}/Dockerfile
          build-contexts: common=ai/tiny/trainers/common
          trainer: ${{ matrix.trainer }}
          smoke-script: scripts/ci/tiny-trainer-smoke.sh
          sbom-path: ${{ matrix.trainer }}.spdx.json
          token: ${{ secrets.GITHUB_TOKEN }}
          workflow-file: tiny-trainer-images.yml

      - name: Record immutable digest
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ${{ env.IMAGE_REPO }}
          TRAINER: ${{ matrix.trainer }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "$TRAINER.digest.txt"
          printf '%s\n' "### $TRAINER trainer" '' "\`$IMAGE:$VERSION@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tiny-${{ matrix.trainer }}-${{ steps.image.outputs.version }}
          path: |
            ${{ matrix.trainer }}.digest.txt
            ${{ matrix.trainer }}.spdx.json
          if-no-files-found: error
          retention-days: 90
