name: tiny trainer images

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # main requires the contract and smoke contexts, so the merge queue runs them too.
  merge_group:
  push:
    tags:
      - 'tiny-trainers-v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish immutable images instead of build-only validation'
        required: true
        default: false
        type: boolean
      version:
        description: 'Immutable vX.Y.Z image tag; required when publish is true'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tiny-trainers-${{ inputs.version || github.ref }}
  # Only build-only PR runs cancel; the publish job keeps its own non-cancelling group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Python contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Run positive, negative, and boundary contracts
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          python3 scripts/ci/ci_scope.py any 'ai/tiny/*' || rc=$?
          if ((rc == 1)); then
            printf 'ci-scope: no ai/tiny files changed; skipping unittest\n'
            exit 0
          elif ((rc != 0)); then
            exit "$rc"
          fi
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=ai/tiny \
            python -m unittest discover -s ai/tiny/trainers -p 'test_*.py' -v

      - name: Verify direct pins and hash locks are coupled
        shell: bash
        run: bash scripts/ci/tiny-trainer-locks.sh --check

      - name: Audit hash-locked dependencies
        shell: bash
        run: bash scripts/ci/tiny-trainer-locks.sh --audit

  build-only:
    name: Build and smoke (${{ matrix.trainer }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        trainer: [gemma, litert]
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read release tool pins
        shell: bash
        run: bash scripts/ci/export-release-tool-pins.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v${{ env.BUILDX_VERSION }}

      - name: Build multi-arch (validation only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ai/tiny/trainers/${{ matrix.trainer }}
          file: ai/tiny/trainers/${{ matrix.trainer }}/Dockerfile
          build-contexts: |
            common=ai/tiny/trainers/common
          build-args: |
            VCS_REF=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: local/tiny-${{ matrix.trainer }}-trainer:multiarch-${{ github.sha }}

      - name: Build amd64 for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ai/tiny/trainers/${{ matrix.trainer }}
          file: ai/tiny/trainers/${{ matrix.trainer }}/Dockerfile
          build-contexts: |
            common=ai/tiny/trainers/common
          build-args: |
            VCS_REF=${{ github.sha }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/tiny-${{ matrix.trainer }}-trainer:${{ github.sha }}

      - name: Smoke fixed non-root I/O contract
        shell: bash
        env:
          IMAGE: local/tiny-${{ matrix.trainer }}-trainer:${{ github.sha }}
          TRAINER: ${{ matrix.trainer }}
        run: TMPDIR="$RUNNER_TEMP" bash scripts/ci/tiny-trainer-smoke.sh "$TRAINER" "$IMAGE"

  publish-policy:
    name: Verify publication controls
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require explicit remote-control enablement
        shell: bash
        env:
          PUBLISH_ENABLED: ${{ vars.TINY_TRAINER_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_ENABLED" != true ]]; then
            printf '%s\n' 'trainer publication is blocked until the protected environment and tag ruleset exist' >&2
            exit 1
          fi

  publish:
    name: Publish (${{ matrix.trainer }})
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [contracts, publish-policy]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: tiny-trainer-publish
    concurrency:
      group: tiny-trainers-publish-${{ matrix.trainer }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - trainer: gemma
            image: tiny-gemma-trainer
          - trainer: litert
            image: tiny-litert-trainer
    env:
      IMAGE_NAME: ${{ matrix.image }}
      IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Compute image repository
        shell: bash
        run: |
          set -euo pipefail
          image_repo="$IMAGE_REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          echo "IMAGE_REPO=$image_repo" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Read release tool pins
        shell: bash
        run: bash scripts/ci/export-release-tool-pins.sh

      - name: Resolve and validate immutable version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            version=${REF_NAME#tiny-trainers-}
          else
            version=$DISPATCH_VERSION
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'version must match vX.Y.Z, got %q\n' "$version" >&2
            exit 1
          fi
          expected_tag="tiny-trainers-$version"
          if [[ "$REF_TYPE" != tag || "$REF_NAME" != "$expected_tag" || \
            "$FULL_REF" != "refs/tags/$expected_tag" ]]; then
            printf 'publication requires exact tag refs/tags/%s, got %q\n' \
              "$expected_tag" "$FULL_REF" >&2
            exit 1
          fi
          checked_out_sha=$(git rev-parse HEAD)
          if [[ "$checked_out_sha" != "$SOURCE_SHA" ]]; then
            printf 'checked-out SHA %s differs from event SHA %s\n' \
              "$checked_out_sha" "$SOURCE_SHA" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v${{ env.BUILDX_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v${{ env.COSIGN_VERSION }}

      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v${{ env.SYFT_VERSION }}

      - name: Verify supply-chain tools
        shell: bash
        run: |
          set -euo pipefail
          command -v cosign
          command -v gh
          command -v syft
          cosign_version="$(cosign version)"; grep -Eq "^GitVersion:[[:space:]]+v?${COSIGN_VERSION//./\\.}(\+dirty)?[[:space:]]*$" <<<"$cosign_version"
          syft_version="$(syft version)"; grep -Eq "Version:[[:space:]]+${SYFT_VERSION//./\\.}([[:space:]]|$)" <<<"$syft_version"

      - name: Resolve trusted resumable immutable tag
        id: existing
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REPO }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/${{ matrix.trainer }}-inspect-error"
          if digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{json .Manifest.Digest}}' 2>"$error_file" | tr -d '"'); then
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              printf 'registry returned invalid digest: %q\n' "$digest" >&2
              exit 1
            fi
            docker buildx imagetools inspect "$IMAGE@$digest" --raw | \
              python3 -B scripts/ci/tiny-trainer-manifest-identity.py "$digest" --index
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eqi '404 Not Found|manifest unknown|not found' "$error_file"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

      - name: Build and push multi-arch candidate by digest
        id: push
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ai/tiny/trainers/${{ matrix.trainer }}
          file: ai/tiny/trainers/${{ matrix.trainer }}/Dockerfile
          build-contexts: |
            common=ai/tiny/trainers/common
          build-args: |
            VCS_REF=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Select candidate digest
        id: candidate
        shell: bash
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          IMAGE: ${{ env.IMAGE_REPO }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          candidate=${EXISTING_DIGEST:-$PUSHED_DIGEST}
          if [[ ! "$candidate" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'publish path did not produce one expected digest: %q\n' \
              "$candidate" >&2
            exit 1
          fi
          docker buildx imagetools inspect "$IMAGE@$candidate" --raw | \
            python3 -B scripts/ci/tiny-trainer-manifest-identity.py "$candidate" --index
          echo "digest=$candidate" >> "$GITHUB_OUTPUT"

      - name: Smoke exact publish candidate
        shell: bash
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ env.IMAGE_REPO }}
          TRAINER: ${{ matrix.trainer }}
        run: |
          set -euo pipefail
          digest="$DIGEST"
          docker pull --platform linux/amd64 "$IMAGE@$digest"
          TMPDIR="$RUNNER_TEMP" bash scripts/ci/tiny-trainer-smoke.sh "$TRAINER" "$IMAGE@$digest"

      - name: Verify release identity of every platform
        shell: bash
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ env.IMAGE_REPO }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          digest="$DIGEST"
          for platform in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$IMAGE@$digest" \
              --format "{{json (index .Image \"$platform\")}}" | \
              python3 -B scripts/ci/tiny-trainer-manifest-identity.py \
              --config "$platform" "$SOURCE_URL" "$SOURCE_SHA" "$VERSION"
          done

      - name: Tag verified candidate
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ env.IMAGE_REPO }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          digest="$DIGEST"
          error_file="$RUNNER_TEMP/${{ matrix.trainer }}-tag-check-error"
          if docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{json .Manifest.Digest}}' 2>"$error_file"; then
            printf 'tag appeared concurrently: %s:%s\n' "$IMAGE" "$VERSION" >&2
            exit 1
          elif ! grep -Eqi '404 Not Found|manifest unknown|not found' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$digest"

      - name: Verify immutable published image
        id: image
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ env.IMAGE_REPO }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          expected_digest="$CANDIDATE_DIGEST"
          if [[ ! "$expected_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'publish path did not produce one expected digest: %q\n' \
              "$expected_digest" >&2
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'registry returned invalid digest: %q\n' "$digest" >&2
            exit 1
          fi
          if [[ "$digest" != "$expected_digest" ]]; then
            printf 'published digest differs from tested push: %s != %s\n' \
              "$digest" "$expected_digest" >&2
            exit 1
          fi
          docker buildx imagetools inspect "$IMAGE@$digest" --raw | \
            python3 -B scripts/ci/tiny-trainer-manifest-identity.py "$digest" --index
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image digest
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Generate SPDX SBOM
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.image.outputs.digest }}
          TRAINER: ${{ matrix.trainer }}
        run: |
          set -euo pipefail
          syft packages "$IMAGE" -o spdx-json > "$TRAINER.spdx.json"

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ matrix.trainer }}.spdx.json
          push-to-registry: true

      - name: Verify published supply-chain identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.image.outputs.digest }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/ci/tiny-trainer-verify-image.sh \
            "$IMAGE" "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$SOURCE_REF" \
            tiny-trainer-images.yml tiny-trainers-

      - name: Record immutable digest
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ${{ env.IMAGE_REPO }}
          TRAINER: ${{ matrix.trainer }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "$TRAINER.digest.txt"
          printf '%s\n' "### $TRAINER trainer" '' "\`$IMAGE:$VERSION@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tiny-${{ matrix.trainer }}-${{ steps.version.outputs.value }}
          path: |
            ${{ matrix.trainer }}.digest.txt
            ${{ matrix.trainer }}.spdx.json
          if-no-files-found: error
          retention-days: 90
