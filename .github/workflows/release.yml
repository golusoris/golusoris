# Framework release — triggers when the canonical Gitea v*.*.* tag is
# forwarded to GitHub, with manual dispatch available for an idempotent retry.
#
# The framework ships Go library + two CLIs (no Docker image), so this
# workflow runs goreleaser directly instead of calling the reusable
# release-go.yml (which is aimed at app repos that DO build images).
#
# Produces:
#   - Multi-arch tarballs (+ zip on windows) for cmd/golusoris and cmd/golusoris-mcp
#   - checksums.txt + checksums.txt.sigstore.json (cosign keyless bundle)
#   - SPDX SBOMs on the archives (syft)
#   - SLSA-L3 provenance on all release artifacts (actions/attest-build-provenance)
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual escape hatch: (re)build + sign an existing canonical tag's artifacts.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to build + sign the release for'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 30
    permissions:
      contents: write       # create the GitHub Release + upload artifacts
      id-token: write       # cosign keyless OIDC + SLSA
      attestations: write   # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify pre-baked release tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in cosign syft goreleaser; do command -v "$tool"; done
          cosign version | grep -Eq 'GitVersion:[[:space:]]+v?3\.1\.3([[:space:]]|$)'
          syft version | grep -Eq 'Version:[[:space:]]+1\.51\.1([[:space:]]|$)'
          goreleaser --version | grep -Eq 'GitVersion:[[:space:]]+v?2\.18\.0([[:space:]]|$)'

      - name: Run GoReleaser
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On dispatch, force the tag goreleaser builds; empty on push (it uses the pushed tag).
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          args=(release --config=tools/.goreleaser.yml --clean)
          # On a dispatched rebuild of an already-cut tag, skip the before-hooks:
          # the tag's immutable tree may carry a stale/broken hook (e.g. the
          # pre-fix `go generate` eBPF clang compile). Binaries still build from
          # the tag's committed Go source + go.sum — hooks are only orchestration.
          if [ -n "$DISPATCH_TAG" ]; then args+=(--skip=before); fi
          goreleaser "${args[@]}"

      - name: Verify the keyless checksum bundle
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            dist/checksums.txt

      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          # Also attest the per-archive SPDX SBOMs goreleaser emits, so the
          # header's "provenance on all release artifacts" holds directly, not
          # just transitively via the attested checksums.txt (issue #192).
          subject-path: 'dist/*.tar.gz,dist/*.zip,dist/checksums.txt,dist/*.sbom.json'
