# Framework release — triggers when the canonical Gitea v*.*.* tag is
# forwarded to GitHub. Retry the original tag-triggered run; a separate manual
# ref can diverge from the OIDC source identity and immutable release target.
#
# The framework ships Go library + two CLIs (no Docker image), so this
# workflow runs goreleaser directly instead of calling the reusable
# release-go.yml (which is aimed at app repos that DO build images).
#
# Produces:
#   - Multi-arch tarballs (+ zip on windows) for cmd/golusoris and cmd/golusoris-mcp
#   - checksums.txt + checksums.txt.sigstore.json (cosign keyless bundle)
#   - SPDX SBOMs on the archives (syft)
#   - Build-provenance attestations on all release artifacts (build + attest run
#     in release-build.yml, reusable, SLSA Build L3)
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is built or published until the tagged commit shows a green
  # `CI success`. Ancestry is not validation: the Gitea tag-forward checks only
  # that the commit is an ancestor of main, and this workflow's `push: tags`
  # trigger fires seconds later while main's CI is still running.
  require-green-ci:
    uses: ./.github/workflows/require-green-ci.yml
    # A called workflow gets no more than its caller grants; the gate reads
    # check runs and CI workflow runs, so without checks: read and actions: read
    # the tag run fails at startup.
    permissions:
      contents: read
      checks: read
      actions: read
    with:
      ref: ${{ github.sha }}

  # Unprivileged on purpose: it runs the tagged code and hands only text to the release job.
  apidiff:
    name: API compatibility summary
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      section: ${{ steps.section.outputs.section }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: '**/go.sum'

      # apidiff type-checks every module, including the cgo ones.
      - name: Install cgo system libraries
        timeout-minutes: 10
        run: bash scripts/ci/install-cgo-libs.sh

      - name: Install apidiff
        shell: bash
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          go install "github.com/joelanford/go-apidiff@${GO_COMPAT_TOOL_VERSION}"

      - name: Compose the API compatibility section
        id: section
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous="$(scripts/ci/previous-published-release.sh "$RELEASE_TAG")"
          if [[ -z "$previous" ]]; then
            scripts/ci/release-notes-breaking.sh api none \
              --unavailable 'there is no earlier published release to compare with' \
              >"$RUNNER_TEMP/api-section.md"
          else
            # A checker error leaves no coverage line; the section then says the run did not finish.
            if ! GO_APIDIFF_BIN="$(go env GOPATH)/bin/go-apidiff" \
              scripts/ci/go-apidiff.sh "$previous" HEAD >"$RUNNER_TEMP/apidiff.txt" 2>&1; then
              echo '::warning::go-apidiff.sh did not finish; the release notes state that.'
            fi
            cat "$RUNNER_TEMP/apidiff.txt"
            scripts/ci/release-notes-breaking.sh api "$previous" \
              --apidiff "$RUNNER_TEMP/apidiff.txt" >"$RUNNER_TEMP/api-section.md"
          fi
          cat "$RUNNER_TEMP/api-section.md"
          echo "section=$(base64 -w0 <"$RUNNER_TEMP/api-section.md")" >>"$GITHUB_OUTPUT"

  release-build:
    name: GoReleaser
    needs: [require-green-ci, apidiff]
    # The API summary is informational: when its job fails, the notes say so and the release goes on.
    if: ${{ !cancelled() && needs.require-green-ci.result == 'success' }}
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      api-result: ${{ needs.apidiff.result }}
      api-section: ${{ needs.apidiff.outputs.section }}
