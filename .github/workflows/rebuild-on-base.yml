# Reusable workflow: rebuild + re-sign OCI image when Renovate bumps the base image digest.
#
# Apps call it with:
#   jobs:
#     rebuild:
#       uses: golusoris/golusoris/.github/workflows/rebuild-on-base.yml@<full-framework-commit-sha>
#       with:
#         image-name: ghcr.io/myorg/myapp
#
name: rebuild-on-base (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: OCI image name (e.g. ghcr.io/myorg/myapp)
        type: string
        required: true
      platforms:
        description: Comma-separated build platforms
        type: string
        default: linux/amd64,linux/arm64

permissions:
  contents: read

concurrency:
  group: rebuild-on-base-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild on base update
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless + provenance OIDC
      attestations: write   # build provenance + SBOM attestations
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.37.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image tags
        id: tag
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # rebuild-tag-resolver:start
          TAG_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          checkout_sha="$(git rev-parse HEAD)"
          if [[ ! "$checkout_sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ || \
            "$checkout_sha" != "$EVENT_SHA" ]]; then
            echo '::error::checked-out commit does not match the workflow event SHA.'
            exit 1
          fi
          # Describe only when a release tag is reachable, so a git failure is not read as "untagged".
          release_tag=''
          reachable_tags="$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*')"
          if [[ -n "$reachable_tags" ]]; then
            release_tag="$(git describe --tags --abbrev=0 \
              --match 'v[0-9]*.[0-9]*.[0-9]*')"
          fi
          if [[ ! "$release_tag" =~ $TAG_PATTERN ]]; then
            release_tag="sha-$checkout_sha"
          fi
          image_tag="${release_tag//+/_}"
          if ((${#image_tag} > 115)); then
            image_tag="sha-$checkout_sha"
          fi
          {
            printf 'tag=%s\n' "$image_tag"
            printf 'sha=sha-%s\n' "$checkout_sha"
            printf 'created=%s\n' "$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
          # rebuild-tag-resolver:end

      - name: Build and push (base rebuild)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: tools/Dockerfile.template
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          no-cache: true   # force fresh base layer pull
          tags: |
            ${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}-base-rebuild
            ${{ inputs.image-name }}:${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tag.outputs.created }}

      - name: Verify pre-baked supply-chain tools
        shell: bash
        run: |
          set -euo pipefail
          command -v cosign
          command -v syft
          cosign version | grep -Eq '^GitVersion:[[:space:]]+v?3\.1\.3(\+dirty)?[[:space:]]*$'
          syft version | grep -Eq 'Version:[[:space:]]+1\.52\.0([[:space:]]|$)'

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            "${{ inputs.image-name }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        shell: bash
        env:
          IMAGE: ${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
        run: syft packages "$IMAGE" -o spdx-json > sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
