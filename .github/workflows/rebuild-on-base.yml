# Reusable workflow: rebuild + re-sign OCI image when Renovate bumps the base image digest.
#
# Apps call it with:
#   jobs:
#     rebuild:
#       uses: golusoris/golusoris/.github/workflows/rebuild-on-base.yml@main
#       with:
#         image-name: ghcr.io/myorg/myapp
#       secrets: inherit
#
# Wire Renovate to trigger it by adding a "postUpgradeTasks" section in renovate.json
# that dispatches a repository_dispatch event of type "base-image-updated".
name: rebuild-on-base (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: OCI image name (e.g. ghcr.io/myorg/myapp)
        type: string
        required: true
      go-version-file:
        description: Path to go.mod
        type: string
        default: go.mod
      goreleaser-config:
        description: Path to .goreleaser.yml
        type: string
        default: tools/.goreleaser.yml
      platforms:
        description: Comma-separated build platforms
        type: string
        default: linux/amd64,linux/arm64
    secrets:
      COSIGN_PASSWORD:
        required: false

  # Allow manual trigger from downstream repos via repository_dispatch
  repository_dispatch:
    types: [base-image-updated]

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild on base update
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless + provenance OIDC
      attestations: write   # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ inputs.go-version-file || 'go.mod' }}
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current image tag
        id: tag
        run: |
          # Use the latest git tag if available, otherwise use the short SHA
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "sha-$(git rev-parse --short HEAD)")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push (base rebuild)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          file: tools/Dockerfile.template
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          no-cache: true   # force fresh base layer pull
          tags: |
            ${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}-base-rebuild
            ${{ inputs.image-name }}:${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Verify pre-baked supply-chain tools
        shell: bash
        run: |
          set -euo pipefail
          command -v cosign
          command -v syft
          cosign version | grep -Eq 'GitVersion:[[:space:]]+v?3\.1\.3([[:space:]]|$)'
          syft version | grep -Eq 'Version:[[:space:]]+1\.51\.1([[:space:]]|$)'

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            "${{ inputs.image-name }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        shell: bash
        env:
          IMAGE: ${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
        run: syft packages "$IMAGE" -o spdx-json > sbom.spdx.json

      - name: Attach SBOM to image
        run: |
          cosign attach sbom \
            --sbom sbom.spdx.json \
            "${{ inputs.image-name }}@${{ steps.build.outputs.digest }}"
