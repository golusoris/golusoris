# Reusable CI workflow for golusoris-based Go applications.
#
# Apps call it with:
#   jobs:
#     ci:
#       uses: golusoris/golusoris/.github/workflows/ci-go.yml@main
#       with:
#         runs-on: arc-cauda-golusoris-myapp
#         working-directory: .
#         go-version-file: go.mod
#         coverage-threshold: 70
#         module-path: github.com/myorg/myapp
name: ci-go (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Self-hosted runner-set label the caller's ARC scale set is registered under. Every job in this workflow runs on this label (the test job's matrix included).
        type: string
        default: arc-cauda-golusoris-golusoris
      working-directory:
        description: "Directory holding the Go module's go.mod, relative to the repository root (empty path segment = the repo root). Wired via job-level `defaults.run.working-directory`, so it only reaches `run:` steps — `uses:` steps (setup-go, upload-artifact, upload-sarif) take root-relative paths regardless and are adjusted explicitly where needed."
        type: string
        default: "."
      go-version-file:
        description: "Path to go.mod for Go version resolution, relative to the repository ROOT (not to `working-directory`) — this is an `actions/setup-go` input, and job `defaults.run.working-directory` only applies to `run:` steps. Callers with a non-root module must pass this explicitly, e.g. `<working-directory>/go.mod`."
        type: string
        default: go.mod
      prior-go-version:
        description: "Deprecated/unused — a prior-minor Go leg can't build a module whose go.mod requires the latest toolchain. Kept so callers that still pass it don't break."
        type: string
        default: ""
      golangci-version:
        description: golangci-lint version
        type: string
        default: v2.12.2
      golangci-config:
        description: "Path to a golangci-lint config, relative to `working-directory` (golangci-lint-action's own `working-directory` input is wired below, so this — like its config auto-discovery — resolves against the module directory, not the repo root). Empty = golangci-lint auto-discovers the caller's .golangci.yml in that same directory."
        type: string
        default: ""
      lint-timeout:
        description: golangci-lint timeout
        type: string
        default: 5m
      test-timeout:
        description: go test timeout
        type: string
        default: 10m
      needs-docker:
        description: Verify the Docker daemon is reachable before tests (testcontainers) — set false for apps with no container-backed tests
        type: boolean
        default: true
      container:
        description: "Container image to run the Go-compiling jobs in (empty = run directly on the runner). Apps whose build needs a custom image (cgo/system libs) set this. Linux-only — the macOS test leg always runs on the host."
        type: string
        default: ""
      system-packages:
        description: "Space-separated Debian packages that must already be pre-baked in the rootless ARC image (empty = none)."
        type: string
        default: ""
      coverage-threshold:
        description: Minimum coverage percentage (0 = skip check)
        type: number
        default: 70
      module-path:
        description: Go module path for apidiff (e.g. github.com/myorg/myapp)
        type: string
        default: ""
      skip-apidiff:
        description: Skip apidiff check (set true for first release)
        type: boolean
        default: false
      openapi-spec:
        description: Path to OpenAPI spec file for spectral lint (empty = skip)
        type: string
        default: ""
      spectral-ruleset:
        description: Path to a Spectral ruleset (empty = spectral's built-in oas ruleset)
        type: string
        default: ""
      spectral-version:
        description: "@stoplight/spectral-cli version to run via npx"
        type: string
        default: 6.15.0
      spectral-fail-severity:
        description: Minimum severity that fails the spectral lint (error|warn|info|hint)
        type: string
        default: warn

permissions:
  contents: read

jobs:
  # ── Conventional-commit PR title ──────────────────────────────────────────
  pr-title:
    name: PR title
    if: github.actor != 'renovate[bot]' && github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\(.+\))?(!)?: .+'; then
            echo "::error::PR title does not follow Conventional Commits."
            echo "::error::Got: $PR_TITLE"
            echo "::error::Expected: <type>(<scope>): <description>"
            echo "::error::Valid types: feat fix docs chore refactor test perf ci build revert"
            exit 1
          fi
          echo "OK: $PR_TITLE"

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    if: github.actor != 'renovate[bot]'
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify pre-baked system packages
        if: ${{ inputs.system-packages != '' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          "${GITHUB_WORKSPACE}/scripts/ci/verify-system-packages.sh" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ inputs.golangci-version }}
          working-directory: ${{ inputs.working-directory }}
          # Pass --config only when the caller supplies one; otherwise golangci-lint
          # auto-discovers the app's own .golangci.yml (issue #197).
          args: ${{ inputs.golangci-config != '' && format('--config={0} --timeout={1}', inputs.golangci-config, inputs.lint-timeout) || format('--timeout={0}', inputs.lint-timeout) }}

  # ── Security scan (gosec) ─────────────────────────────────────────────────
  gosec:
    name: Security (gosec)
    if: github.actor != 'renovate[bot]'
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify pre-baked system packages
        if: ${{ inputs.system-packages != '' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          "${GITHUB_WORKSPACE}/scripts/ci/verify-system-packages.sh" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          EXCLUDE_RULES="testutil/.*:G115,G404,G204;search/typesense/.*:G704;notify/apns2/.*:G704;notify/fcm/.*:G101;hash/.*:G304,G401,G505;auth/policy/.*:G401,G505;auth/oauth2server/.*:G117;storage/.*:G304;secrets/.*:G304;docs/epub/.*:G304;cmd/golusoris/.*:G204,G304;archive/.*:G302,G304;webhooks/in/.*:G505"
          gosec -exclude-generated --exclude-rules="$EXCLUDE_RULES" -fmt sarif -out gosec.sarif ./... || true
          gosec -exclude-generated --exclude-rules="$EXCLUDE_RULES" ./...
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: ${{ inputs.working-directory }}/gosec.sarif
        continue-on-error: true

  # ── Vulnerability check ───────────────────────────────────────────────────
  vuln:
    name: Vulnerabilities (govulncheck)
    if: github.actor != 'renovate[bot]'
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify pre-baked system packages
        if: ${{ inputs.system-packages != '' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          "${GITHUB_WORKSPACE}/scripts/ci/verify-system-packages.sh" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          govulncheck ./...

  # ── Tests + coverage ──────────────────────────────────────────────────────
  # The repository-scoped Linux ARC scale set owns coverage, artifacts, and
  # Docker-backed tests without hosted-runner billing.
  test:
    name: Test (race + coverage)
    if: github.actor != 'renovate[bot]'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == inputs.runs-on && inputs.container || '' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ["${{ inputs.runs-on }}"]
        toolchain: [module]
        include:
          - os: ${{ inputs.runs-on }}
            toolchain: module
            primary: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify pre-baked system packages
        if: ${{ inputs.system-packages != '' && runner.os == 'Linux' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          "${GITHUB_WORKSPACE}/scripts/ci/verify-system-packages.sh" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      # Fail fast with a clear signal if testcontainers have no Docker daemon
      # (matches ci.yml's own preflight — issue #198).
      - name: Verify Docker is reachable
        if: ${{ inputs.needs-docker && runner.os == 'Linux' }}
        run: docker info
      - name: Run tests (Linux — full suite)
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout=${{ inputs.test-timeout }} -coverprofile=coverage.out -covermode=atomic ./...
      - name: Run tests (macOS — skip Docker-requiring packages)
        if: runner.os != 'Linux'
        run: |
          # macOS runners lack a Docker daemon; exclude testcontainers-backed
          # packages so this portability leg passes instead of failing on infra.
          # macOS ships bash 3.2 (no mapfile); word-split is safe — Go import
          # paths never contain spaces.
          PKGS=$(go list ./... | grep -vE '/testutil(/|$)|/testutil/pg' || true)
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout=${{ inputs.test-timeout }} $PKGS
      - name: Check coverage threshold
        if: ${{ matrix.primary && inputs.coverage-threshold > 0 }}
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total' | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !($COVERAGE < ${{ inputs.coverage-threshold }}) }"; then
            echo "::error::Coverage ${COVERAGE}% is below required ${{ inputs.coverage-threshold }}%"
            exit 1
          fi
      - name: Upload coverage artifact
        if: matrix.primary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: ${{ inputs.working-directory }}/coverage.out
          retention-days: 7

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    if: github.actor != 'renovate[bot]'
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify pre-baked system packages
        if: ${{ inputs.system-packages != '' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          "${GITHUB_WORKSPACE}/scripts/ci/verify-system-packages.sh" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      - run: go build ./...

  # ── OpenAPI spec lint (spectral) ─────────────────────────────────────────
  # Caller-driven: lints the spec named by `openapi-spec` from the CALLER's
  # checkout, using the caller's `spectral-ruleset` (or Spectral's built-in oas
  # ruleset when none is given). No dependency on the framework's tools/ dir, so
  # downstream apps can lint their own spec without vendoring tools/spectral.
  # Not Go-module-scoped, so `working-directory` is not wired here — spec and
  # ruleset paths are always given by the caller relative to the repo root.
  spectral:
    name: OpenAPI lint (spectral)
    if: ${{ github.actor != 'renovate[bot]' && inputs.openapi-spec != '' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Lint OpenAPI spec
        env:
          SPEC: ${{ inputs.openapi-spec }}
          RULESET: ${{ inputs.spectral-ruleset }}
          SPECTRAL_VERSION: ${{ inputs.spectral-version }}
          FAIL_SEVERITY: ${{ inputs.spectral-fail-severity }}
        run: |
          set -euo pipefail
          ARGS=(lint "$SPEC" --fail-severity "$FAIL_SEVERITY")
          if [ -n "$RULESET" ]; then
            ARGS+=(--ruleset "$RULESET")
          fi
          # No ruleset → Spectral auto-loads its built-in `spectral:oas` ruleset.
          npx --yes "@stoplight/spectral-cli@${SPECTRAL_VERSION}" "${ARGS[@]}"

  # ── API compatibility (apidiff vs previous tag) ───────────────────────────
  apidiff:
    name: API compatibility (apidiff)
    if: ${{ github.actor != 'renovate[bot]' && !inputs.skip-apidiff && inputs.module-path != '' }}
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify pre-baked system packages
        if: ${{ inputs.system-packages != '' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          "${GITHUB_WORKSPACE}/scripts/ci/verify-system-packages.sh" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20250218142911-aa4b98e5adaa
      - name: Run apidiff vs previous tag (informational pre-1.0)
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^1 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — skipping apidiff (first release)"
            exit 0
          fi
          MOD="${{ inputs.module-path }}"
          echo "Comparing HEAD against $PREV_TAG"
          apidiff -m -w /tmp/cur-api.txt "$MOD"
          git worktree add -q --detach /tmp/apidiff-prev "$PREV_TAG"
          ( cd "/tmp/apidiff-prev/${{ inputs.working-directory }}" && go mod download && apidiff -m -w /tmp/prev-api.txt "$MOD" ) \
            || echo "::warning::could not export $PREV_TAG API"
          git worktree remove /tmp/apidiff-prev --force || true
          echo "## API changes vs $PREV_TAG"
          apidiff /tmp/prev-api.txt /tmp/cur-api.txt \
            || echo "::warning::apidiff comparison unavailable (export-data version mismatch)"
          # Pre-1.0 informational; gate on `apidiff -incompatible` at v1.0.
