# Reusable CI workflow for golusoris-based Go applications.
#
# Apps call it with:
#   jobs:
#     ci:
#       uses: golusoris/golusoris/.github/workflows/ci-go.yml@main
#       with:
#         runs-on: ubuntu-24.04
#         working-directory: .
#         go-version-file: go.mod
#         coverage-threshold: 70
#         module-path: github.com/myorg/myapp
name: ci-go (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label every job in this workflow runs on (the test job's matrix included). Defaults to the GitHub-hosted ubuntu-24.04 image; pass a self-hosted runner-set label to run elsewhere.
        type: string
        default: ubuntu-24.04
      working-directory:
        description: "Directory holding the Go module's go.mod, relative to the repository root (empty path segment = the repo root). Wired via job-level `defaults.run.working-directory`, so it only reaches `run:` steps — `uses:` steps (setup-go, upload-artifact, upload-sarif) take root-relative paths regardless and are adjusted explicitly where needed."
        type: string
        default: "."
      go-version-file:
        description: "Path to go.mod for Go version resolution, relative to the repository ROOT (not to `working-directory`) — this is an `actions/setup-go` input, and job `defaults.run.working-directory` only applies to `run:` steps. Callers with a non-root module must pass this explicitly, e.g. `<working-directory>/go.mod`."
        type: string
        default: go.mod
      prior-go-version:
        description: "Deprecated/unused — a prior-minor Go leg can't build a module whose go.mod requires the latest toolchain. Kept so callers that still pass it don't break."
        type: string
        default: ""
      golangci-version:
        description: golangci-lint version
        type: string
        default: v2.14.0
      gofumpt-version:
        description: Exact standalone gofumpt version used for formatting
        type: string
        default: v0.12.0
      gosec-version:
        description: Exact gosec version
        type: string
        default: v2.29.0
      govulncheck-version:
        description: Exact govulncheck version
        type: string
        default: v1.8.0
      apidiff-version:
        description: Exact go-apidiff version
        type: string
        default: v0.8.4-0.20260910211158-c3e0953fa2fd
      golangci-config:
        description: "Path to a golangci-lint config, relative to `working-directory` (golangci-lint-action's own `working-directory` input is wired below, so this — like its config auto-discovery — resolves against the module directory, not the repo root). Empty = golangci-lint auto-discovers the caller's .golangci.yml in that same directory."
        type: string
        default: ""
      lint-timeout:
        description: golangci-lint timeout
        type: string
        default: 5m
      test-timeout:
        description: go test timeout
        type: string
        default: 10m
      needs-docker:
        description: Verify the Docker daemon is reachable before tests (testcontainers) — set false for apps with no container-backed tests
        type: boolean
        default: true
      container:
        description: "Container image to run the Go-compiling jobs in (empty = run directly on the runner). Apps whose build needs a custom image (cgo/system libs) set this. Linux-only — the macOS test leg always runs on the host."
        type: string
        default: ""
      system-packages:
        description: "Space-separated Debian packages (`name` or `name=version`) every Go job needs (empty = none). Installed or only verified per `install-system-packages`."
        type: string
        default: ""
      install-system-packages:
        description: "Install `system-packages` with bounded apt-get calls (sudo on the runner, root in a `container`) before verifying them. Set false for a self-hosted image that already bakes them in; the jobs then only verify."
        type: boolean
        default: true
      coverage-threshold:
        description: Minimum coverage percentage (0 = skip check)
        type: number
        default: 70
      module-path:
        description: Go module path for apidiff (e.g. github.com/myorg/myapp)
        type: string
        default: ""
      apidiff-base-ref:
        description: "Exact apidiff base revision; empty selects the previous root vN tag"
        type: string
        default: ""
      skip-apidiff:
        description: Skip apidiff check (set true for first release)
        type: boolean
        default: false
      openapi-spec:
        description: Path to OpenAPI spec file for spectral lint (empty = skip)
        type: string
        default: ""
      spectral-ruleset:
        description: Path to a Spectral ruleset (empty = spectral's built-in oas ruleset)
        type: string
        default: ""
      spectral-version:
        description: "Deprecated/unused; Spectral resolves from this workflow revision's package lock"
        type: string
        default: 6.16.3
      spectral-fail-severity:
        description: Minimum severity that fails the spectral lint (error|warn|info|hint)
        type: string
        default: warn

permissions:
  contents: read

jobs:
  # ── Conventional-commit PR title ──────────────────────────────────────────
  pr-title:
    name: PR title
    if: github.actor != 'renovate[bot]' && github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\(.+\))?(!)?: .+'; then
            echo "::error::PR title does not follow Conventional Commits."
            echo "::error::Got: $PR_TITLE"
            echo "::error::Expected: <type>(<scope>): <description>"
            echo "::error::Valid types: feat fix docs chore refactor test perf ci build revert"
            exit 1
          fi
          echo "OK: $PR_TITLE"

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: build
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out golusoris system-package script
        if: ${{ inputs.system-packages != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # toJSON round trip: actionlint 1.7.12 does not type job.workflow_* yet.
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          sparse-checkout: scripts/ci/verify-system-packages.sh
          sparse-checkout-cone-mode: false
          path: .golusoris-ci
          persist-credentials: false
      - name: Provide system packages
        if: ${{ inputs.system-packages != '' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
          INSTALL_SYSTEM_PACKAGES: ${{ inputs.install-system-packages }}
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          ci_root="${GITHUB_WORKSPACE}/.golusoris-ci"
          # go-apidiff refuses a dirty tree, so the helper checkout never outlives this step.
          trap 'rm -rf "$ci_root"' EXIT
          # The script must come from this workflow's revision, not the caller's tree.
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || \
            ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::called workflow revision identity is unavailable"
            exit 1
          fi
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          mode=()
          if [[ "$INSTALL_SYSTEM_PACKAGES" == true ]]; then
            mode=(--install)
          fi
          bash "$ci_root/scripts/ci/verify-system-packages.sh" "${mode[@]}" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      - name: Check gofumpt formatting
        env:
          GOFUMPT_VERSION: ${{ inputs.gofumpt-version }}
        run: |
          set -euo pipefail
          go install "mvdan.cc/gofumpt@${GOFUMPT_VERSION}"
          gofumpt -version | grep -Fq "${GOFUMPT_VERSION} "
          unformatted=$(gofumpt -l .)
          test -z "$unformatted" || {
            printf 'not gofumpt-formatted:\n%s\n' "$unformatted" >&2
            exit 1
          }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ inputs.golangci-version }}
          working-directory: ${{ inputs.working-directory }}
          # Pass --config only when the caller supplies one; otherwise golangci-lint
          # auto-discovers the app's own .golangci.yml (issue #197).
          args: ${{ inputs.golangci-config != '' && format('--config={0} --timeout={1}', inputs.golangci-config, inputs.lint-timeout) || format('--timeout={0}', inputs.lint-timeout) }}

  # ── Security scan (gosec) ─────────────────────────────────────────────────
  gosec:
    name: Security (gosec)
    needs: build
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out golusoris system-package script
        if: ${{ inputs.system-packages != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # toJSON round trip: actionlint 1.7.12 does not type job.workflow_* yet.
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          sparse-checkout: scripts/ci/verify-system-packages.sh
          sparse-checkout-cone-mode: false
          path: .golusoris-ci
          persist-credentials: false
      - name: Provide system packages
        if: ${{ inputs.system-packages != '' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
          INSTALL_SYSTEM_PACKAGES: ${{ inputs.install-system-packages }}
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          ci_root="${GITHUB_WORKSPACE}/.golusoris-ci"
          # go-apidiff refuses a dirty tree, so the helper checkout never outlives this step.
          trap 'rm -rf "$ci_root"' EXIT
          # The script must come from this workflow's revision, not the caller's tree.
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || \
            ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::called workflow revision identity is unavailable"
            exit 1
          fi
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          mode=()
          if [[ "$INSTALL_SYSTEM_PACKAGES" == true ]]; then
            mode=(--install)
          fi
          bash "$ci_root/scripts/ci/verify-system-packages.sh" "${mode[@]}" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      - name: gosec
        env:
          GOSEC_VERSION: ${{ inputs.gosec-version }}
        run: |
          set -euo pipefail
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          # One gating scan writes SARIF and logs findings. testdata is excluded
          # because gosec's own walk includes fixtures that `go list ./...` does
          # not; real exceptions belong at the finding with a reason.
          gosec -exclude-generated -exclude-dir=testdata -fmt sarif \
            -out gosec.sarif -stdout -verbose text ./...
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ inputs.working-directory }}/gosec.sarif
          # One category per module: uploads that share a category on the same
          # commit replace each other, which breaks callers that fan this
          # workflow out over a module matrix.
          category: gosec${{ inputs.working-directory != '.' && format('/{0}', inputs.working-directory) || '' }}
        continue-on-error: true

  # ── Vulnerability check ───────────────────────────────────────────────────
  vuln:
    name: Vulnerabilities (govulncheck)
    needs: build
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out golusoris system-package script
        if: ${{ inputs.system-packages != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # toJSON round trip: actionlint 1.7.12 does not type job.workflow_* yet.
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          sparse-checkout: scripts/ci/verify-system-packages.sh
          sparse-checkout-cone-mode: false
          path: .golusoris-ci
          persist-credentials: false
      - name: Provide system packages
        if: ${{ inputs.system-packages != '' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
          INSTALL_SYSTEM_PACKAGES: ${{ inputs.install-system-packages }}
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          ci_root="${GITHUB_WORKSPACE}/.golusoris-ci"
          # go-apidiff refuses a dirty tree, so the helper checkout never outlives this step.
          trap 'rm -rf "$ci_root"' EXIT
          # The script must come from this workflow's revision, not the caller's tree.
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || \
            ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::called workflow revision identity is unavailable"
            exit 1
          fi
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          mode=()
          if [[ "$INSTALL_SYSTEM_PACKAGES" == true ]]; then
            mode=(--install)
          fi
          bash "$ci_root/scripts/ci/verify-system-packages.sh" "${mode[@]}" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      - name: govulncheck
        env:
          GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck -version | grep -Fq "Scanner: govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  # ── Tests + coverage ──────────────────────────────────────────────────────
  # The Linux leg owns coverage, artifacts, and Docker-backed tests; the
  # default hosted ubuntu-24.04 image ships the Docker daemon they need.
  test:
    name: Test (race + coverage)
    needs: build
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == inputs.runs-on && inputs.container || '' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ["${{ inputs.runs-on }}"]
        toolchain: [module]
        include:
          - os: ${{ inputs.runs-on }}
            toolchain: module
            primary: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out golusoris system-package script
        if: ${{ inputs.system-packages != '' && runner.os == 'Linux' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # toJSON round trip: actionlint 1.7.12 does not type job.workflow_* yet.
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          sparse-checkout: scripts/ci/verify-system-packages.sh
          sparse-checkout-cone-mode: false
          path: .golusoris-ci
          persist-credentials: false
      - name: Provide system packages
        if: ${{ inputs.system-packages != '' && runner.os == 'Linux' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
          INSTALL_SYSTEM_PACKAGES: ${{ inputs.install-system-packages }}
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          ci_root="${GITHUB_WORKSPACE}/.golusoris-ci"
          # go-apidiff refuses a dirty tree, so the helper checkout never outlives this step.
          trap 'rm -rf "$ci_root"' EXIT
          # The script must come from this workflow's revision, not the caller's tree.
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || \
            ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::called workflow revision identity is unavailable"
            exit 1
          fi
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          mode=()
          if [[ "$INSTALL_SYSTEM_PACKAGES" == true ]]; then
            mode=(--install)
          fi
          bash "$ci_root/scripts/ci/verify-system-packages.sh" "${mode[@]}" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      # Fail fast with a clear signal if testcontainers have no Docker daemon
      # (matches ci.yml's own preflight — issue #198).
      - name: Verify Docker is reachable
        if: ${{ inputs.needs-docker && runner.os == 'Linux' }}
        run: docker info
      - name: Run tests (Linux — full suite)
        if: runner.os == 'Linux'
        env:
          # v0.44.0 can reuse a stopped shared Ryuk after a package gap
          # (testcontainers/testcontainers-go#3867). Keep it alive within this
          # bounded job until testcontainers/testcontainers-go#3868 ships.
          RYUK_RECONNECTION_TIMEOUT: 30m
        run: go test -race -count=1 -timeout=${{ inputs.test-timeout }} -coverprofile=coverage.out -covermode=atomic ./...
      - name: Run tests (macOS — skip Docker-requiring packages)
        if: runner.os != 'Linux'
        run: |
          # macOS runners lack a Docker daemon; exclude testcontainers-backed
          # packages so this portability leg passes instead of failing on infra.
          # macOS ships bash 3.2 (no mapfile); word-split is safe — Go import
          # paths never contain spaces.
          all_pkgs=$(go list ./...)
          # grep exits 1 when every package is filtered out; only exit 2 or higher is an error.
          filter_status=0
          PKGS=$(printf '%s\n' "$all_pkgs" | grep -vE '/testutil(/|$)|/testutil/pg') || filter_status=$?
          if [ "$filter_status" -gt 1 ]; then
            echo "::error::package filter failed with status $filter_status"
            exit "$filter_status"
          fi
          # shellcheck disable=SC2086 # Go package paths cannot contain spaces; deliberate list expansion.
          go test -race -count=1 -timeout=${{ inputs.test-timeout }} $PKGS
      - name: Check coverage threshold
        if: ${{ matrix.primary && inputs.coverage-threshold > 0 }}
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total' | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !($COVERAGE < ${{ inputs.coverage-threshold }}) }"; then
            echo "::error::Coverage ${COVERAGE}% is below required ${{ inputs.coverage-threshold }}%"
            exit 1
          fi
      - name: Derive a per-module artifact name
        id: artifact
        shell: bash
        run: |
          slug=$(printf '%s' "${{ inputs.working-directory }}" | tr '/.' '--' | sed -e 's/^-*//' -e 's/-*$//')
          if [ -n "$slug" ]; then echo "name=coverage-$slug" >> "$GITHUB_OUTPUT"; else echo "name=coverage" >> "$GITHUB_OUTPUT"; fi
      - name: Upload coverage artifact
        if: matrix.primary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Artifact names must be unique per run: a caller that fans this
          # workflow out over a module matrix would otherwise collide on
          # "coverage" and every upload after the first would fail.
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ inputs.working-directory }}/coverage.out
          retention-days: 7

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out golusoris system-package script
        if: ${{ inputs.system-packages != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # toJSON round trip: actionlint 1.7.12 does not type job.workflow_* yet.
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          sparse-checkout: scripts/ci/verify-system-packages.sh
          sparse-checkout-cone-mode: false
          path: .golusoris-ci
          persist-credentials: false
      - name: Provide system packages
        if: ${{ inputs.system-packages != '' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
          INSTALL_SYSTEM_PACKAGES: ${{ inputs.install-system-packages }}
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          ci_root="${GITHUB_WORKSPACE}/.golusoris-ci"
          # go-apidiff refuses a dirty tree, so the helper checkout never outlives this step.
          trap 'rm -rf "$ci_root"' EXIT
          # The script must come from this workflow's revision, not the caller's tree.
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || \
            ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::called workflow revision identity is unavailable"
            exit 1
          fi
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          mode=()
          if [[ "$INSTALL_SYSTEM_PACKAGES" == true ]]; then
            mode=(--install)
          fi
          bash "$ci_root/scripts/ci/verify-system-packages.sh" "${mode[@]}" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      - name: Check module metadata
        run: go mod tidy -diff
      - run: go build ./...

  # ── OpenAPI spec lint (spectral) ─────────────────────────────────────────
  # Caller-driven: lints the spec named by `openapi-spec` from the CALLER's
  # checkout, using the caller's `spectral-ruleset` (or the called revision's
  # locked OAS ruleset when none is given). The executable and dependency graph
  # come from the called workflow revision's integrity-checked package lock.
  # Not Go-module-scoped, so `working-directory` is not wired here — spec and
  # ruleset paths are always given by the caller relative to the repo root.
  spectral:
    name: OpenAPI lint (spectral)
    if: ${{ github.actor != 'renovate[bot]' && inputs.openapi-spec != '' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Resolve called workflow source
        id: workflow-source
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const job = JSON.parse(process.env.JOB_CONTEXT);
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(job.workflow_repository)) {
            throw new Error('called workflow repository identity is unavailable');
          }
          if (!/^[0-9a-f]{40}$/.test(job.workflow_sha)) {
            throw new Error('called workflow revision identity is unavailable');
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `repository=${job.workflow_repository}\nsha=${job.workflow_sha}\n`,
          );
          JS
      - name: Check out locked Spectral authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.sha }}
          sparse-checkout: |
            tools/spectral
            scripts/ci/spectral-default-test.sh
          path: .golusoris-ci
          persist-credentials: false
      - name: Install locked Spectral graph
        run: npm ci --prefix .golusoris-ci/tools/spectral --ignore-scripts --no-audit --no-fund
      - name: Verify locked default OAS ruleset
        run: .golusoris-ci/scripts/ci/spectral-default-test.sh
      - name: Lint OpenAPI spec
        env:
          SPEC: ${{ inputs.openapi-spec }}
          RULESET: ${{ inputs.spectral-ruleset }}
          FAIL_SEVERITY: ${{ inputs.spectral-fail-severity }}
        run: |
          set -euo pipefail
          ARGS=(lint "$SPEC" --fail-severity "$FAIL_SEVERITY")
          if [ -n "$RULESET" ]; then
            ARGS+=(--ruleset "$RULESET")
          else
            ARGS+=(--ruleset .golusoris-ci/tools/spectral/oas.yaml)
          fi
          .golusoris-ci/tools/spectral/node_modules/.bin/spectral "${ARGS[@]}"

  # ── API compatibility (apidiff vs previous tag) ───────────────────────────
  apidiff:
    name: API compatibility (apidiff)
    if: ${{ !inputs.skip-apidiff && inputs.module-path != '' }}
    needs: build
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check out golusoris system-package script
        if: ${{ inputs.system-packages != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # toJSON round trip: actionlint 1.7.12 does not type job.workflow_* yet.
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          sparse-checkout: scripts/ci/verify-system-packages.sh
          sparse-checkout-cone-mode: false
          path: .golusoris-ci
          persist-credentials: false
      - name: Provide system packages
        if: ${{ inputs.system-packages != '' }}
        shell: bash
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
          INSTALL_SYSTEM_PACKAGES: ${{ inputs.install-system-packages }}
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          ci_root="${GITHUB_WORKSPACE}/.golusoris-ci"
          # go-apidiff refuses a dirty tree, so the helper checkout never outlives this step.
          trap 'rm -rf "$ci_root"' EXIT
          # The script must come from this workflow's revision, not the caller's tree.
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || \
            ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::called workflow revision identity is unavailable"
            exit 1
          fi
          read -r -a packages <<< "$SYSTEM_PACKAGES"
          mode=()
          if [[ "$INSTALL_SYSTEM_PACKAGES" == true ]]; then
            mode=(--install)
          fi
          bash "$ci_root/scripts/ci/verify-system-packages.sh" "${mode[@]}" "${packages[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/go.sum', inputs.working-directory) || '' }}
      - name: Install apidiff
        env:
          GO_COMPAT_TOOL_VERSION: ${{ inputs.apidiff-version }}
        run: go install "github.com/joelanford/go-apidiff@${GO_COMPAT_TOOL_VERSION}"
      - name: Run apidiff vs previous tag (informational pre-1.0)
        env:
          APIDIFF_BASE_REF: ${{ inputs.apidiff-base-ref }}
          EXPECTED_MODULE: ${{ inputs.module-path }}
        run: |
          set -euo pipefail
          PREV_TAG="$APIDIFF_BASE_REF"
          if [ -z "$PREV_TAG" ]; then
            # rev-parse exits 1 when HEAD is a root commit; a parent without a reachable tag also skips.
            parent_status=0
            git rev-parse --verify --quiet 'HEAD^1' >/dev/null || parent_status=$?
            case "$parent_status" in
              0)
                reachable_tags=$(git tag --merged 'HEAD^1' --list 'v[0-9]*')
                if [ -n "$reachable_tags" ]; then
                  PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 'HEAD^1')
                fi
                ;;
              1) ;;
              *) exit "$parent_status" ;;
            esac
          fi
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — skipping apidiff (first release)"
            exit 0
          fi
          actual_module=$(go list -m -f '{{.Path}}')
          if [ "$actual_module" != "$EXPECTED_MODULE" ]; then
            echo "::error::module-path $EXPECTED_MODULE does not match $actual_module in $PWD"
            exit 2
          fi
          echo "Comparing HEAD against $PREV_TAG"
          echo "## API changes vs $PREV_TAG"
          set +e
          go-apidiff --repo-path="$GITHUB_WORKSPACE" "$PREV_TAG" HEAD \
            --print-compatible
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "::warning::$EXPECTED_MODULE contains pre-1.0 incompatible API changes"
          elif [ "$status" -ne 0 ]; then
            echo "::error::go-apidiff execution failed with status $status"
            exit "$status"
          fi
          # Pre-1.0 is informational; at v1.0, status 1 becomes blocking.
