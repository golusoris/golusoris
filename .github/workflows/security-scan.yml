# Semgrep runs fully inside its pinned container through the ARC Docker sidecar.
# The immutable cauda runner image supplies the verified Docker CLI and shares
# /var/run/docker.sock with dind. Rulesets come from the public registry without
# an account; `--config auto` is deliberately NOT used because it reports the
# project URL.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep analysis
    if: github.actor != 'renovate[bot]'
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify the pinned Docker sidecar contract
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          test "${DOCKER_HOST:-}" = "unix:///var/run/docker.sock"
          docker info

      - name: Run Semgrep
        shell: bash
        run: |
          set -euo pipefail
          # The dind daemon cannot bind-mount this workspace: separate containers,
          # separate filesystems. Stream the tree in over stdin rather than
          # reaching for a -v that would mount an empty directory.
          #
          # .config/hiss/testdata is excluded because it is a corpus of
          # deliberate violations: the HISS-20 enforcement-coverage fixtures
          # (plugin.Open, unsafe.Pointer, `sh -c`, unbounded fan-out) exist to
          # prove .semgrep.yml reports them, and the registry rulesets would
          # report them too — turning this gating job red on fixtures that are
          # correct by construction. They are replayed against .semgrep.yml,
          # in both directions, by scripts/hiss/semgrep-fixtures.sh
          # (`make hiss-fixtures`), which scans them from a temporary copy.
          tar -cf - --exclude=.git . \
            | docker run --rm -i semgrep/semgrep:1.144.0@sha256:10301f060aacf84078f9704fb1ba3a321df4ac46b009fd29c1c66880d1db8e77 \
                sh -ec 'mkdir -p /src && tar -xf - -C /src && \
                  semgrep scan \
                    --config p/golang \
                    --config p/javascript \
                    --config p/security-audit \
                    --exclude .config/hiss/testdata \
                    --exclude .config/hiss/semgrep/testdata \
                    --error --metrics=off --quiet /src'
