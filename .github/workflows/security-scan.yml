# Semgrep runs fully inside its pinned container on the hosted runner's native
# Docker daemon. Rulesets come from the public registry without an account;
# `--config auto` is deliberately NOT used because it reports the project URL.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep analysis
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify the Docker daemon
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker info

      - name: Run Semgrep
        shell: bash
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          # Stream the tree in over stdin instead of bind-mounting the
          # workspace: it skips .git and keeps working where the daemon does
          # not share the runner filesystem (dind, remote DOCKER_HOST).
          #
          # .config/hiss/testdata is excluded because it is a corpus of
          # deliberate violations: the HISS-20 enforcement-coverage fixtures
          # (plugin.Open, unsafe.Pointer, `sh -c`, unbounded fan-out) exist to
          # prove .semgrep.yml reports them, and the registry rulesets would
          # report them too — turning this gating job red on fixtures that are
          # correct by construction. They are replayed against .semgrep.yml,
          # in both directions, by scripts/hiss/semgrep-fixtures.sh
          # (`make hiss-fixtures`), which scans them from a temporary copy.
          semgrep_image="semgrep/semgrep:${SEMGREP_VERSION}@${SEMGREP_IMAGE_DIGEST}"
          tar -cf - --exclude=.git . \
            | docker run --rm -i "$semgrep_image" \
                sh -ec 'mkdir -p /src && tar -xf - -C /src && \
                  semgrep scan \
                    --config p/golang \
                    --config p/javascript \
                    --config p/security-audit \
                    --exclude .config/hiss/testdata \
                    --exclude .config/hiss/semgrep/testdata \
                    --error --metrics=off --quiet /src'

      - name: Run Trivy dependency, secret, and IaC gate
        shell: bash
        run: bash scripts/ci/trivy-scan.sh
