# Reusable workflow: verify a published OCI artifact's supply-chain provenance.
#
# Verifies all three publication claims by default:
#   - the cosign keyless signature on the image (cosign verify), and
#   - the SLSA build provenance attestation (gh attestation verify), which
#     release-go.yml / rebuild-on-base.yml push via
#     actions/attest-build-provenance, and
#   - the SPDX SBOM attestation published for the same image digest.
#
# Downstream apps call it to gate a deploy on a verified golusoris (or their own)
# image. Example:
#   jobs:
#     verify:
#       uses: golusoris/golusoris/.github/workflows/verify-provenance.yml@<full-framework-commit-sha>
#       with:
#         image: ghcr.io/myorg/myapp
#         digest: sha256:abcd...            # the exact pushed digest
#         repository: myorg/myapp           # repo whose OIDC identity signed it
#         source-ref: refs/tags/v1.2.3
#         source-digest: 012345...            # exact source commit SHA
#         signer-workflow: golusoris/golusoris/.github/workflows/release-go.yml
#         signer-digest: fedcba...            # release-go workflow commit SHA
name: verify-provenance (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: OCI image name WITHOUT tag/digest (e.g. ghcr.io/myorg/myapp)
        type: string
        required: true
      digest:
        description: Image digest to verify (e.g. sha256:abc...)
        type: string
        required: true
      repository:
        description: GitHub owner/repo whose Actions OIDC identity produced the attestation
        type: string
        default: ${{ github.repository }}
      source-ref:
        description: Exact Git ref recorded by the producing workflow (e.g. refs/tags/v1.2.3)
        type: string
        required: true
      source-digest:
        description: Exact source repository commit SHA recorded by the producing workflow
        type: string
        required: true
      signer-workflow:
        description: Exact reusable signer path (owner/repo/.github/workflows/file.yml)
        type: string
        required: true
      signer-digest:
        description: Exact commit SHA of the reusable signer workflow
        type: string
        required: true
      oidc-issuer:
        description: cosign OIDC issuer to require on the signing certificate
        type: string
        default: https://token.actions.githubusercontent.com
      registry:
        description: ghcr.io for GitHub token login; empty for a public image with no login
        type: string
        default: ghcr.io
      verify-signature:
        description: Verify the cosign keyless signature
        type: boolean
        default: true
      verify-attestation:
        description: Verify the SLSA build-provenance attestation via gh attestation
        type: boolean
        default: true
      verify-sbom:
        description: Verify the SPDX SBOM attestation via gh attestation
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify provenance
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read    # pull the image + its attestations from the registry
    steps:
      - name: Validate verification contract
        shell: bash
        env:
          DIGEST: ${{ inputs.digest }}
          IMAGE: ${{ inputs.image }}
          REPO: ${{ inputs.repository }}
          REGISTRY: ${{ inputs.registry }}
          SIGNER_DIGEST: ${{ inputs.signer-digest }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          SOURCE_DIGEST: ${{ inputs.source-digest }}
          SOURCE_REF: ${{ inputs.source-ref }}
          VERIFY_PROVENANCE: ${{ inputs.verify-attestation }}
          VERIFY_SBOM: ${{ inputs.verify-sbom }}
          VERIFY_SIGNATURE: ${{ inputs.verify-signature }}
        run: |
          set -euo pipefail
          command -v gh
          if ! gh attestation verify --help | grep -Fq -- '--signer-digest'; then
            echo '::error::gh lacks immutable signer-digest verification.'
            exit 1
          fi
          if [[ "$VERIFY_SIGNATURE" != true && "$VERIFY_PROVENANCE" != true && \
            "$VERIFY_SBOM" != true ]]; then
            echo '::error::at least one verification mode must be enabled.'
            exit 1
          fi
          if [[ -n "$REGISTRY" && "$REGISTRY" != ghcr.io ]] || \
            [[ "$REGISTRY" == ghcr.io && "$IMAGE" != ghcr.io/* ]]; then
            echo '::error::GitHub token login is restricted to matching ghcr.io images.'
            exit 1
          fi
          if [[ -z "$IMAGE" || "$IMAGE" == *'@'* || "$IMAGE" =~ [[:space:]] || \
            ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ || \
            ! "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || \
            "$SOURCE_REF" != refs/* || \
            ! "$SOURCE_DIGEST" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ || \
            ! "$SIGNER_DIGEST" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ || \
            ! "$SIGNER_WORKFLOW" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml$ ]]; then
            echo '::error::invalid provenance verification identity input.'
            exit 1
          fi

      - name: Log in to registry
        if: ${{ inputs.registry != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pre-baked cosign
        if: ${{ inputs.verify-signature }}
        shell: bash
        run: |
          set -euo pipefail
          command -v cosign
          cosign version | grep -Eq '^GitVersion:[[:space:]]+v?3\.1\.3(\+dirty)?[[:space:]]*$'

      - name: Verify cosign signature (keyless)
        if: ${{ inputs.verify-signature }}
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          REPO: ${{ inputs.repository }}
          OIDC_ISSUER: ${{ inputs.oidc-issuer }}
          SIGNER_DIGEST: ${{ inputs.signer-digest }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          SOURCE_DIGEST: ${{ inputs.source-digest }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity "https://github.com/${SIGNER_WORKFLOW}@${SIGNER_DIGEST}" \
            --certificate-github-workflow-repository "${REPO}" \
            --certificate-github-workflow-ref "${SOURCE_REF}" \
            --certificate-github-workflow-sha "${SOURCE_DIGEST}" \
            "${IMAGE}@${DIGEST}"

      - name: Verify GitHub attestations
        if: ${{ inputs.verify-attestation || inputs.verify-sbom }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          REPO: ${{ inputs.repository }}
          SIGNER_DIGEST: ${{ inputs.signer-digest }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          SOURCE_DIGEST: ${{ inputs.source-digest }}
          SOURCE_REF: ${{ inputs.source-ref }}
          VERIFY_PROVENANCE: ${{ inputs.verify-attestation }}
          VERIFY_SBOM: ${{ inputs.verify-sbom }}
        run: |
          set -euo pipefail
          verify_predicate() {
            local predicate="$1"
            gh attestation verify "oci://${IMAGE}@${DIGEST}" \
              --bundle-from-oci \
              --repo "${REPO}" \
              --signer-workflow "${SIGNER_WORKFLOW}" \
              --signer-digest "${SIGNER_DIGEST}" \
              --source-ref "${SOURCE_REF}" \
              --source-digest "${SOURCE_DIGEST}" \
              --predicate-type "$predicate"
          }
          if [[ "$VERIFY_PROVENANCE" == true ]]; then
            verify_predicate 'https://slsa.dev/provenance/v1'
          fi
          if [[ "$VERIFY_SBOM" == true ]]; then
            verify_predicate 'https://spdx.dev/Document/v2.3'
          fi
