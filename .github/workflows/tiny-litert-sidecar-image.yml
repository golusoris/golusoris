name: tiny litert sidecar image

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue runs the contract and smoke jobs too.
  merge_group:
  push:
    tags:
      - 'tiny-litert-sidecar-v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish immutable images instead of build-only validation'
        required: true
        default: false
        type: boolean
      version:
        description: 'Immutable vX.Y.Z image tag; required when publish is true'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tiny-litert-sidecar-${{ inputs.version || github.ref }}
  # Only build-only PR runs cancel; the publish job keeps its own non-cancelling group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Sidecar contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'

      - name: Run positive, negative, and boundary sidecar contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="" uv run --python 3.14 --with-requirements ai/tiny/serve/tflite/sidecar/requirements.lock \
            --with pytest python -B -m pytest -q -p no:cacheprovider ai/tiny/serve/tflite/sidecar/test_sidecar.py

      # tiny-trainer-images.yml contracts checks and audits the sidecar lock with the trainer locks.

  build-smoke:
    name: Build and smoke (litert sidecar)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-go

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Read release tool pins
        shell: bash
        run: bash scripts/ci/export-release-tool-pins.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v${{ env.BUILDX_VERSION }}

      - name: Configure Docker Hub mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Build multi-arch (validation only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ai/tiny/serve/tflite/sidecar
          file: ai/tiny/serve/tflite/sidecar/Dockerfile
          build-args: |
            VCS_REF=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: local/tiny-litert-sidecar:multiarch-${{ github.sha }}

      - name: Smoke sidecar container image
        shell: bash
        run: TMPDIR="$RUNNER_TEMP" bash scripts/ci/tiny-litert-sidecar-smoke.sh local/tiny-litert-sidecar:${{ github.sha }}

  publish-policy:
    name: Verify publication controls
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require explicit remote-control enablement
        shell: bash
        env:
          PUBLISH_ENABLED: ${{ vars.TINY_LITERT_SIDECAR_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_ENABLED" != true ]]; then
            printf '%s\n' 'sidecar publication is blocked until the protected environment and tag ruleset exist' >&2
            exit 1
          fi

  publish:
    name: Publish (litert sidecar)
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [contracts, publish-policy]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: tiny-litert-sidecar-publish
    concurrency:
      group: tiny-litert-sidecar-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE_NAME: tiny-litert-sidecar
      IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Compute image repository
        shell: bash
        run: |
          set -euo pipefail
          image_repo="$IMAGE_REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          echo "IMAGE_REPO=$image_repo" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Read release tool pins
        shell: bash
        run: bash scripts/ci/export-release-tool-pins.sh

      - uses: ./.github/actions/setup-go

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'

      - name: Configure Docker Hub mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Publish verified tiny image
        id: image
        uses: ./.github/actions/publish-tiny-image
        with:
          version: ${{ inputs.version }}
          tag-prefix: tiny-litert-sidecar-
          error-prefix: sidecar
          context: ai/tiny/serve/tflite/sidecar
          dockerfile: ai/tiny/serve/tflite/sidecar/Dockerfile
          sidecar-skip-build: '1'
          smoke-command: TMPDIR="$RUNNER_TEMP" bash scripts/ci/tiny-litert-sidecar-smoke.sh "$IMAGE@$digest"
          sbom-command: syft packages "$IMAGE" -o spdx-json > tiny-litert-sidecar.spdx.json
          sbom-path: tiny-litert-sidecar.spdx.json
          token: ${{ secrets.GITHUB_TOKEN }}
          verify-arguments: tiny-litert-sidecar-image.yml tiny-litert-sidecar-

      - name: Record immutable digest
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ${{ env.IMAGE_REPO }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > tiny-litert-sidecar.digest.txt
          printf '%s\n' "### LiteRT sidecar" '' "\`$IMAGE:$VERSION@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tiny-litert-sidecar-${{ steps.image.outputs.version }}
          path: |
            tiny-litert-sidecar.digest.txt
            tiny-litert-sidecar.spdx.json
          if-no-files-found: error
          retention-days: 90
