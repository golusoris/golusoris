name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The merge queue tests each group before it lands; PR-only jobs skip there.
  merge_group:
  workflow_dispatch:

# Praetor engine that local hooks and Make targets run; .config/lefthook/engine.sh reads this pin.
env:
  PRAETOR_REF: e1f649e43968b4c337d275a9cb4feba313cd303e

permissions:
  contents: read

# Superseding only makes sense per pull request: there `github.ref` is
# refs/pull/N/merge, so each PR owns its group and a force-push cancels only
# its own stale run. On `push` the same expression collapses to the single
# group CI-refs/heads/main that EVERY main commit shares, so each merge
# evicted the previous commit's run -- 60 consecutive main runs were cancelled
# and main never once produced a CI verdict. Every commit on main must reach a
# conclusion: it is the status the release gate reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Conventional-commit PR title ────────────────────────────────────────────
  pr-title:
    name: PR title (Conventional Commits)
    if: github.actor != 'renovate[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\(.+\))?(!)?: .+'; then
            echo "::error::PR title does not follow Conventional Commits."
            echo "::error::Got: $PR_TITLE"
            echo "::error::Expected: <type>(<scope>): <description>"
            echo "::error::Valid types: feat fix docs chore refactor test perf ci build revert"
            exit 1
          fi
          echo "OK: $PR_TITLE"

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-26.04
    # Lint timeout sizing (measured 2026-09-14 on the PR #447 tip, cold caches):
    # a full `golangci-lint run` of the root module (171 pkgs) costs ~810 CPU-s
    # (63 s wall on 32 cores; the go/packages load phase alone is ~530 CPU-s),
    # core ~44 CPU-s. The 65 min bound was sized for the retired self-hosted
    # runner fleet (750m guaranteed CPU, cold caches); it has not been
    # re-measured on the hosted ubuntu-26.04 runners yet.
    #
    # Build is the sole setup-go cache writer. This job starts only after that
    # key exists, so its post step restores but never recompresses the cache.
    # Keep the hard bound aligned with run.timeout in .golangci.yml and
    # scripts/ci/go-modules.sh.
    timeout-minutes: 65
    env:
      CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - name: Install pinned formatting and lint tools
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          go install "mvdan.cc/gofumpt@${GOFUMPT_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "github.com/bufbuild/buf/cmd/buf@${BUF_VERSION}"
      - name: Check gofumpt formatting
        run: bash scripts/ci/check-gofumpt.sh
      - name: Check gci pre-commit hook
        run: make gci-hook-test
      - name: Lint primary modules
        env:
          GO_MODULE_GROUP: primary
        run: scripts/ci/go-modules.sh lint
      - name: Lint repository Python sources
        run: |
          docker info
          bash scripts/ci/python-lint.sh
      - name: Lint protobuf and check the vendored KEDA contract (buf)
        run: bash scripts/ci/buf-lint.sh

  # ── Security scan (gosec) ───────────────────────────────────────────────────
  gosec:
    name: Security (gosec)
    needs: build
    runs-on: ubuntu-26.04
    # Measured with gosec v2.29.0 (171 root + 16 core pkgs) on a 32-core box:
    # root scan 61 s with an empty GOCACHE (2.4 GB of export data), 2 s warm;
    # core <1 s. Build now creates the shared cache before this job starts, so
    # this reader cannot lose the remaining job budget to a post-job upload.
    # The 45 min bound dates from the retired self-hosted runner fleet; it has
    # not been re-measured on the hosted ubuntu-26.04 runners yet.
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
      - name: gosec
        env:
          GO_MODULE_GROUP: primary
          GOSEC_ROOT_SARIF: ${{ github.workspace }}/gosec.sarif
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          bash scripts/ci/install-gosec.sh
          scripts/ci/go-modules.sh verify
          scripts/ci/go-modules.sh gosec
      # A fork pull request gets no security-events write token; every other run must upload.
      - name: Upload SARIF
        if: always() && github.event.pull_request.draft != true && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: gosec.sarif

  # ── Vulnerability check ─────────────────────────────────────────────────────
  vuln:
    name: Vulnerabilities (govulncheck)
    needs: build
    runs-on: ubuntu-26.04
    # Build owns the cache save; 20 minutes bounds only setup, restore, and the
    # vulnerability scan.
    timeout-minutes: 20
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
      - name: govulncheck
        env:
          GO_MODULE_GROUP: primary
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck -version | grep -Fq "Scanner: govulncheck@${GOVULNCHECK_VERSION}"
          scripts/ci/go-modules.sh vuln

  # ── Tests + coverage ────────────────────────────────────────────────────────
  # The hosted ubuntu-26.04 runner owns coverage, artifacts, and the
  # Docker-backed integration tests through its native Docker daemon.
  # go.mod is the single source of truth for the exact Go toolchain. The
  # descriptive matrix axis keeps the primary-leg metadata explicit without a
  # mutable `stable` selector. Keep the toolchain in the explicit name: GitHub
  # suffixes a plain matrix name, while praetor can only render named values.
  # Leave the runner label out: it is a required check, and an image bump
  # must not rename it (#815).
  test:
    name: Test (race + coverage) (${{ matrix.toolchain }})
    needs: build
    runs-on: ${{ matrix.os }}
    # 30: the Docker-backed suite took 13.5 min on a cold self-hosted runner
    # before the pre-pull step existed; keep headroom above the 10 min
    # per-module go test timeout plus the pre-pull. Now 60: the pre-pull owns up
    # to 30 min of that (see its ceiling below) because serialising the batches
    # trades wall-clock for pulls that actually complete, and the suite itself
    # needs ~13.5 min. Re-measure on hosted runners before shrinking it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        toolchain: [module]
        include:
          - os: ubuntu-26.04
            toolchain: module
            primary: true
    env:
      CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Decide the CI scope gate
        shell: bash
        env:
          CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          gated="$(python3 -B scripts/ci/ci_scope.py gate)"
          case "$gated" in run | skip) ;; *) echo "::error::ci-scope gate printed: $gated"; exit 1 ;; esac
          echo "CI_GATED=$gated" >> "$GITHUB_ENV"
          echo "ci-scope: gate=$gated" >> "$GITHUB_STEP_SUMMARY"
      - name: Pull Docker Hub images through mirror.gcr.io
        if: env.CI_GATED != 'skip'
        uses: ./.github/actions/docker-hub-mirror
      - uses: ./.github/actions/setup-go
        if: env.CI_GATED != 'skip'
      - name: Run repository Python regression suites
        if: env.CI_GATED != 'skip'
        run: bash scripts/ci/python-tests.sh
      # Hosted runners ship a native Docker daemon for testcontainers-backed packages.
      - name: Verify Docker is reachable
        if: runner.os == 'Linux' && env.CI_GATED != 'skip'
        run: docker info
      # Testcontainers images are immutable and identical from job to job, so
      # pulling them again every run is the actual defect -- the registry is
      # slow and variable from this runner (measured 194-221 s per image on
      # run 35084070175, 20-158 s on 35080875553), and seven images at two
      # concurrent pulls is ~15 min of wall clock per job for bytes that never
      # change. Cache the image set instead: `docker save` it once, restore and
      # `docker load` it on every later run. The pull path below is now the
      # cold-cache exception, not the steady state.
      #
      # The key is the immutable manifest hash. Renovate changes tag + digest,
      # which changes the key and repopulates the cache exactly once.
      - name: Cache testcontainers images
        if: runner.os == 'Linux' && env.CI_GATED != 'skip'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/testcontainers-images
          key: tc-images-${{ runner.os }}-${{ hashFiles('.github/testcontainers-images.txt') }}
      - name: Load or pull testcontainers images
        if: runner.os == 'Linux' && env.CI_GATED != 'skip'
        # Ceiling for the cold-cache path; a warm restore is a `docker load` of
        # a local tarball and finishes in well under a minute (HISS-02).
        timeout-minutes: 30
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cache/testcontainers-images"
          ARCHIVE="$CACHE_DIR/images.tar"
          # HISS-02: scalar upper bound on the manifest loop.
          MAX_IMAGES=32
          mapfile -t IMAGES < <(grep -vE '^[[:space:]]*(#|$)' .github/testcontainers-images.txt)
          if [ "${#IMAGES[@]}" -eq 0 ] || [ "${#IMAGES[@]}" -gt "$MAX_IMAGES" ]; then
            echo "::error::.github/testcontainers-images.txt lists ${#IMAGES[@]} images; expected 1..${MAX_IMAGES}"
            exit 1
          fi

          if [ -f "$ARCHIVE" ]; then
            echo "Restoring $(du -h "$ARCHIVE" | cut -f1) of cached images"
            docker load -i "$ARCHIVE"
          else
            echo "No image cache present; pulling the full set."
          fi

          # Pull only what the cache did not supply.
          missing=()
          for image in "${IMAGES[@]}"; do
            docker image inspect "$image" >/dev/null 2>&1 || missing+=("$image")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All ${#IMAGES[@]} images served from cache; nothing to pull."
            docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}'
            exit 0
          fi
          echo "Pulling ${#missing[@]} of ${#IMAGES[@]} images: ${missing[*]}"

          bash scripts/ci/pull-test-images.sh "${missing[@]}"

          # Re-save the whole set so the cache holds every image, not just the
          # delta. docker save shares layers across images in one archive.
          mkdir -p "$CACHE_DIR"
          docker save -o "$ARCHIVE" "${IMAGES[@]}"
          echo "Wrote $(du -h "$ARCHIVE" | cut -f1) image archive for the cache"
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Run primary-module tests with race detector and coverage
        if: env.CI_GATED != 'skip'
        env:
          GO_MODULE_GROUP: primary
          GO_COVERAGE_DIR: .coverage/primary
          GOLUSORIS_REQUIRE_CHROME: "1"
          # v0.44.0 can reuse a stopped shared Ryuk after a package gap
          # (testcontainers/testcontainers-go#3867). Keep it alive within this
          # bounded job until testcontainers/testcontainers-go#3868 ships.
          RYUK_RECONNECTION_TIMEOUT: 30m
        run: |
          # -p 4 bounds how many test binaries run at once. Go defaults it to
          # GOMAXPROCS, which the former self-hosted node reported as 16 on ~4
          # effective cores. Sixteen of this tree's packages are testcontainers-
          # backed, so the default let sixteen of them start Postgres,
          # TimescaleDB, ClickHouse and Redpanda containers simultaneously;
          # testcontainers' readiness probe (60 s inside
          # BasicWaitStrategies, independent of testutil's 3 min startTimeout)
          # then expired with the container already logging "database system is
          # ready to accept connections". Take the bound before the spawn --
          # the same rule HISS-06 applies to application code.
          scripts/ci/go-modules.sh test
      # ADR-0011 keeps the real-clamd suite behind the integration tag so the
      # local gate stays cheap; this step is where it runs.
      - name: Run the ClamAV integration suite
        if: matrix.primary && env.CI_GATED != 'skip'
        timeout-minutes: 15
        env:
          RYUK_RECONNECTION_TIMEOUT: 30m
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/clamav-integration.log"
          go test -race -count=1 -v -tags integration -run '^TestIntegration_' -timeout 10m ./storage/scan/ | tee "$LOG"
          # The suite skips without Docker; here a skip is a failure, not a pass.
          if grep -q -- '--- SKIP' "$LOG"; then
            echo "::error::the ClamAV integration suite skipped instead of running"
            exit 1
          fi
      - name: Run the envtest suite
        if: matrix.primary && env.CI_GATED != 'skip'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@${SETUP_ENVTEST_VERSION}"
          assets="$(setup-envtest use "${ENVTEST_K8S_VERSION}" --bin-dir "$RUNNER_TEMP/envtest" -p path)"
          export KUBEBUILDER_ASSETS="$assets"
          crd="$RUNNER_TEMP/cnpg-clusters.yaml"
          curl -fsSL --retry 3 --max-time 120 -o "$crd" "https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/${CNPG_CRD_VERSION}/config/crd/bases/postgresql.cnpg.io_clusters.yaml"
          echo "${CNPG_CRD_SHA256}  $crd" | sha256sum -c -
          export CNPG_CRD_PATH="$crd"
          LOG="$RUNNER_TEMP/envtest.log"
          go test -race -count=1 -v -tags envtest -run '^TestEnvtest_' -timeout 10m ./k8s/client/ ./k8s/cnpg/ ./k8s/operator/ | tee "$LOG"
          if grep -q -- '--- SKIP' "$LOG"; then
            echo "::error::the envtest suite skipped instead of running"
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestEnvtest_' "$LOG"; then
            echo "::error::no envtest tests passed"
            exit 1
          fi
      - name: Run the stripe-mock integration suite
        if: matrix.primary && env.CI_GATED != 'skip'
        timeout-minutes: 10
        env:
          RYUK_RECONNECTION_TIMEOUT: 30m
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/stripe-mock-integration.log"
          go test -race -count=1 -v -tags integration -run '^TestIntegration_' -timeout 5m ./payments/stripe/ | tee "$LOG"
          # The suite skips without Docker; here a skip is a failure, not a pass.
          if grep -q -- '--- SKIP' "$LOG"; then
            echo "::error::the stripe-mock integration suite skipped instead of running"
            exit 1
          fi
      - name: Run the Bugsink integration suite
        if: matrix.primary && env.CI_GATED != 'skip'
        timeout-minutes: 15
        env:
          RYUK_RECONNECTION_TIMEOUT: 30m
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/bugsink-integration.log"
          go test -race -count=1 -v -tags integration -run '^TestIntegration_' -timeout 10m ./observability/sentry/ | tee "$LOG"
          # The suite skips without Docker; here a skip is a failure, not a pass.
          if grep -q -- '--- SKIP' "$LOG"; then
            echo "::error::the Bugsink integration suite skipped instead of running"
            exit 1
          fi
      - name: Check coverage threshold (70%)
        if: matrix.primary && env.CI_GATED != 'skip'
        run: |
          if [[ -n "${CI_SCOPE_BASE}" && ! -f .coverage/primary/coverage.out ]]; then
            echo "ci-scope: no primary module changed; skipping the coverage threshold"
            exit 0
          fi
          COVERAGE=$(go tool cover -func=.coverage/primary/coverage.out | grep '^total' | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !($COVERAGE < 70) }"; then
            echo "::error::Coverage ${COVERAGE}% is below the required 70%"
            exit 1
          fi
      - name: Upload coverage artifact
        if: matrix.primary && env.CI_GATED != 'skip'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: .coverage/primary/coverage.out
          if-no-files-found: ${{ env.CI_SCOPE_BASE != '' && 'ignore' || 'error' }}
          retention-days: 7

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-26.04
    # Sole setup-go cache writer. Run 35457471789 proved parallel writers can
    # finish their gates and then spend 13-25 minutes compressing/uploading the
    # same 1.14 GB key until the job timeout cancels them. Build verifies every
    # module graph before saving once; every other cache user depends on this
    # job and therefore restores the completed primary key without saving it.
    timeout-minutes: 60
    env:
      CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
      - uses: ./.github/actions/setup-go
      - name: Compile and analyze repository C sources
        run: |
          docker info
          bash scripts/ci/c-quality.sh
      - name: Verify Helm deployment chart
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          go install "helm.sh/helm/v4/cmd/helm@${HELM_VERSION}"
          bash scripts/ci/helm-chart_test.sh
      - name: Restore a chart backup into a fresh database
        run: bash scripts/ci/helm-backup-restore_test.sh
      - name: Verify all module dependencies before caching
        run: scripts/ci/go-modules.sh verify
      - name: Build and vet primary modules
        env:
          GO_MODULE_GROUP: primary
        run: |
          scripts/ci/go-modules.sh tidy
          scripts/ci/go-modules.sh fix
          scripts/ci/go-modules.sh build

  # ── Nested Go modules ───────────────────────────────────────────────────────
  # Root and core keep their dedicated jobs because the root suite owns the
  # Docker-backed integration tests and the 70% aggregate. Every other module
  # runs the same gates in four deterministic shards, bounding job fan-out.
  module-sweep:
    name: Module sweep (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '0'
          - shard: '1'
          - shard: '2'
          - shard: '3'
    env:
      GO_MODULE_GROUP: split
      GO_MODULE_SHARD_COUNT: '4'
      GO_MODULE_SHARD_INDEX: ${{ matrix.shard }}
      GO_COVERAGE_DIR: .coverage/split-${{ matrix.shard }}
      CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Decide the CI scope gate
        shell: bash
        env:
          CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          gated="$(python3 -B scripts/ci/ci_scope.py gate)"
          case "$gated" in run | skip) ;; *) echo "::error::ci-scope gate printed: $gated"; exit 1 ;; esac
          echo "CI_GATED=$gated" >> "$GITHUB_ENV"
          echo "ci-scope: gate=$gated" >> "$GITHUB_STEP_SUMMARY"
      - name: Pull Docker Hub images through mirror.gcr.io
        if: env.CI_GATED != 'skip'
        uses: ./.github/actions/docker-hub-mirror
      - name: Pre-pull shard testcontainers images
        if: env.CI_GATED != 'skip'
        timeout-minutes: 30
        shell: bash
        run: bash scripts/ci/pull-split-test-images.sh
      - uses: ./.github/actions/setup-go
        if: env.CI_GATED != 'skip'
      # hw/udev and media/3d are cgo modules in this sweep; hosted images lack their headers.
      - name: Install cgo system libraries
        if: env.CI_GATED != 'skip'
        timeout-minutes: 15
        uses: ./.github/actions/install-cgo-libs
      # testutil/pact test binaries link libpact_ffi, which pact-go searches only in fixed system paths.
      - name: Install verified Pact FFI
        if: env.CI_GATED != 'skip'
        run: |
          pact_dir="${RUNNER_TEMP}/pact-ffi"
          install -d -m 0700 "$pact_dir"
          python3 -B scripts/ci/pact_ffi.py --lib-dir "$pact_dir"
          echo "PACT_GO_LIB_DOWNLOAD_PATH=$pact_dir" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$pact_dir -Wl,-rpath,$pact_dir" >> "$GITHUB_ENV"
      - name: Install pinned analysis tools
        if: env.CI_GATED != 'skip'
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          bash scripts/ci/install-gosec.sh
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck -version | grep -Fq "Scanner: govulncheck@${GOVULNCHECK_VERSION}"
      - name: Verify module graphs
        if: env.CI_GATED != 'skip'
        run: |
          scripts/ci/go-modules.sh verify
          scripts/ci/go-modules.sh tidy
          scripts/ci/go-modules.sh fix
      - name: Lint
        if: env.CI_GATED != 'skip'
        run: scripts/ci/go-modules.sh lint
      - name: Security and vulnerability gates
        if: env.CI_GATED != 'skip'
        run: |
          scripts/ci/go-modules.sh gosec
          scripts/ci/go-modules.sh vuln
      - name: Build and vet
        if: env.CI_GATED != 'skip'
        run: scripts/ci/go-modules.sh build
      - name: Test with race detector and coverage
        if: env.CI_GATED != 'skip'
        run: scripts/ci/go-modules.sh test
      - name: Upload coverage artifact
        if: env.CI_GATED != 'skip'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-modules-${{ matrix.shard }}
          path: .coverage/split-${{ matrix.shard }}
          if-no-files-found: ${{ env.CI_SCOPE_BASE != '' && 'ignore' || 'error' }}
          retention-days: 7

  # ── Public documentation build ──────────────────────────────────────────────
  mkdocs:
    name: Documentation build (MkDocs)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
      - name: Verify Docker daemon
        run: docker info
      - name: Build documentation strictly from immutable tooling
        run: bash scripts/ci/mkdocs-build.sh

  allocation-budget:
    name: Allocation budgets (HISS-03)
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
      - name: Enforce measured hot-path allocation budgets
        run: bash scripts/ci/allocation-budget.sh

  # Root code may use only the core API that go.mod requires; the in-repo
  # replace hides a missing core release, a consumer does not get one.
  core-skew:
    name: Core version skew
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
      - name: Build and test the root against the required core version
        run: bash scripts/ci/core-skew.sh

  # A recovered nil-dereference fault corrupts the heap on Windows hosts with
  # large exception contexts (golang/go#81238); code checks for nil instead.
  fault-recovery:
    name: Recovered fault scan
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Decide the CI scope gate
        shell: bash
        env:
          CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          gated="$(python3 -B scripts/ci/ci_scope.py gate)"
          case "$gated" in run | skip) ;; *) echo "::error::ci-scope gate printed: $gated"; exit 1 ;; esac
          echo "CI_GATED=$gated" >> "$GITHUB_ENV"
          echo "ci-scope: gate=$gated" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-go
        if: env.CI_GATED != 'skip'
      # hw/udev and media/3d are cgo modules; hosted images lack their headers.
      - name: Install cgo system libraries
        if: env.CI_GATED != 'skip'
        timeout-minutes: 15
        uses: ./.github/actions/install-cgo-libs
      # testutil/pact test binaries link libpact_ffi, which pact-go searches only in fixed system paths.
      - name: Install verified Pact FFI
        if: env.CI_GATED != 'skip'
        run: |
          pact_dir="${RUNNER_TEMP}/pact-ffi"
          install -d -m 0700 "$pact_dir"
          python3 -B scripts/ci/pact_ffi.py --lib-dir "$pact_dir"
          echo "PACT_GO_LIB_DOWNLOAD_PATH=$pact_dir" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$pact_dir -Wl,-rpath,$pact_dir" >> "$GITHUB_ENV"
      - name: Fail on any recovered nil-dereference fault
        if: env.CI_GATED != 'skip'
        run: bash scripts/ci/fault-recovery.sh

  release-binaries:
    name: Release binaries
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GoReleaser derives the snapshot version from the latest tag.
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          install-only: true
      - name: Verify pinned GoReleaser
        shell: bash
        run: goreleaser --version | grep -Eq 'GitVersion:[[:space:]]+v?2\.19\.0([[:space:]]|$)'
      - name: Pin the snapshot base to the root release tag
        shell: bash
        run: |
          set -euo pipefail
          # Module tags such as tiny-trainers-v0.1.0 are newer than vX.Y.Z and not semver.
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')"
          echo "GORELEASER_CURRENT_TAG=$tag" >> "$GITHUB_ENV"
      - name: Build every release target
        run: goreleaser build --config=tools/.goreleaser.yml --snapshot --clean
      - name: Record the snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version dist/metadata.json)"
          if [[ -z "$version" || "$version" == null ]]; then
            echo '::error::dist/metadata.json carries no version.'
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # tar keeps the executable bit, which upload-artifact drops.
      - name: Pack the binaries
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t binaries < <(jq -r '.[] | select(.type == "Binary") | .path' dist/artifacts.json)
          tar -cf "$RUNNER_TEMP/release-binaries.tar" dist/artifacts.json dist/metadata.json "${binaries[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-binaries
          path: ${{ runner.temp }}/release-binaries.tar
          retention-days: 1
          if-no-files-found: error

  release-smoke:
    name: Release binary smoke (${{ matrix.target }})
    needs: release-binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-24.04
          - target: linux/arm64
            runner: ubuntu-24.04-arm
          - target: darwin/amd64
            runner: macos-15-intel
          - target: darwin/arm64
            runner: macos-26
          - target: windows/amd64
            runner: windows-2025
          - target: windows/arm64
            runner: windows-11-arm
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: ${{ runner.temp }}
      - name: Unpack the binaries
        shell: bash
        # Stdin, because Git Bash tar reads the D:\ in a Windows path as a remote host.
        run: tar -xf - <"$RUNNER_TEMP/release-binaries.tar"
      - name: Run each CLI on its own target
        shell: bash
        env:
          VERSION: ${{ needs.release-binaries.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: python -B scripts/ci/release_smoke.py --version "$VERSION" --target "$TARGET"

  shellcheck:
    name: Shell scripts (ShellCheck)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: verified-download
        uses: plurano/horistes/actions/verified-download@962524ee8f56e372c3d6c46bcafaf956d7cc44a5
      - name: Install pinned ShellCheck
        env:
          VERIFIED_DOWNLOAD_LIB: ${{ steps.verified-download.outputs.lib }}
        run: |
          set -euo pipefail
          bash scripts/ci/install-shellcheck.sh "$RUNNER_TEMP/shellcheck-bin"
          echo "$RUNNER_TEMP/shellcheck-bin" >> "$GITHUB_PATH"
      - name: Lint repository-owned shell scripts
        run: bash scripts/ci/shellcheck.sh

  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # template pins name release commits and tags
      - uses: ./.github/actions/setup-go
        with:
          cache: false
      - name: Install pinned actionlint
        run: |
          . tools/tool-versions.env
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - id: verified-download
        uses: plurano/horistes/actions/verified-download@962524ee8f56e372c3d6c46bcafaf956d7cc44a5
      - name: Install pinned ShellCheck
        env:
          VERIFIED_DOWNLOAD_LIB: ${{ steps.verified-download.outputs.lib }}
        run: |
          set -euo pipefail
          bash scripts/ci/install-shellcheck.sh "$RUNNER_TEMP/shellcheck-bin"
          echo "$RUNNER_TEMP/shellcheck-bin" >> "$GITHUB_PATH"
      - name: Lint GitHub and Gitea workflows
        run: ACTIONLINT_BIN="$(go env GOPATH)/bin/actionlint" bash scripts/ci/actionlint.sh
      - name: Check template workflows against their pinned reusable workflows
        run: ACTIONLINT_BIN="$(go env GOPATH)/bin/actionlint" bash scripts/ci/template-workflows.sh

  policy:
    name: CI policy tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
        with:
          cache: false
      - name: Install pinned actionlint, Helm and buf
        run: |
          . tools/tool-versions.env
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          go install "helm.sh/helm/v4/cmd/helm@${HELM_VERSION}"
          go install "github.com/bufbuild/buf/cmd/buf@${BUF_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - id: verified-download
        uses: plurano/horistes/actions/verified-download@962524ee8f56e372c3d6c46bcafaf956d7cc44a5
      - name: Install pinned ShellCheck
        env:
          VERIFIED_DOWNLOAD_LIB: ${{ steps.verified-download.outputs.lib }}
        run: |
          set -euo pipefail
          bash scripts/ci/install-shellcheck.sh "$RUNNER_TEMP/shellcheck-bin"
          echo "$RUNNER_TEMP/shellcheck-bin" >> "$GITHUB_PATH"
      - name: Run the CI script policy tests
        run: make ci-policy-test
      - name: Require a migration guide for a breaking CHANGELOG entry
        run: make release-notes-check

  terraform:
    name: Terraform modules
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
      - name: Verify Docker daemon
        run: docker info
      - name: Format, initialize from locks, and validate modules
        run: bash scripts/ci/terraform-validate.sh

  kubeconform:
    name: Kubernetes schemas (kubeconform)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go
        with:
          cache: false
      - name: Install pinned Helm renderer
        run: |
          . tools/tool-versions.env
          go install "helm.sh/helm/v4/cmd/helm@${HELM_VERSION}"
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
      - name: Verify Docker daemon
        run: docker info
      - name: Validate static and rendered Kubernetes resources
        run: bash scripts/ci/kubeconform.sh
      # Gap C14-02: a CNPG backup must bootstrap a recovery cluster with equal data.
      - id: verified-download
        uses: plurano/horistes/actions/verified-download@962524ee8f56e372c3d6c46bcafaf956d7cc44a5
      - name: Run CNPG backup restore in kind
        timeout-minutes: 30
        env:
          VERIFIED_DOWNLOAD_LIB: ${{ steps.verified-download.outputs.lib }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/cnpg-restore.log"
          bash scripts/ci/cnpg-restore.sh 2>&1 | tee "$LOG"
          if grep -q -- '--- SKIP' "$LOG"; then
            echo "::error::the CNPG restore kind suite skipped instead of running"
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestKind_' "$LOG"; then
            echo "::error::no CNPG kind tests passed"
            exit 1
          fi

  # ── OpenAPI spec lint (vacuum; job id kept for the required check) ───────────
  # The framework has no single openapi.yaml (apps generate their own with ogen).
  # This step lints the example app spec if present; apps use ci-go.yml's
  # openapi-spec input to wire the lint for their own spec.
  spectral:
    name: OpenAPI lint (spectral)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check if example spec exists
        id: spec-check
        run: |
          if [ -f examples/full/openapi.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-go
        with:
          cache: false
      - name: Install vacuum (module sum pinned)
        run: |
          bash scripts/ci/install-vacuum.sh "$RUNNER_TEMP/vacuum-bin"
          echo "$RUNNER_TEMP/vacuum-bin" >> "$GITHUB_PATH"
      - name: Verify OpenAPI ruleset contract
        run: |
          bash scripts/ci/install-vacuum_test.sh
          bash scripts/ci/openapi-ruleset-test.sh
      - name: Lint spec
        if: steps.spec-check.outputs.exists == 'true'
        run: |
          vacuum lint examples/full/openapi.yaml -r tools/spectral/oas.yaml -n warn -b -q
          vacuum lint examples/full/openapi.yaml -r tools/spectral.yaml -n warn -b -q
      - name: No spec to lint
        if: steps.spec-check.outputs.exists != 'true'
        run: echo "No OpenAPI spec found at examples/full/openapi.yaml — skipping the lint."

  # ── API compatibility (apidiff vs previous tag) ──────────────────────────────
  apidiff:
    name: API compatibility (apidiff)
    needs: build
    runs-on: ubuntu-26.04
    # Build owns the cache save; this job restores the same all-module key.
    timeout-minutes: 20
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # need full history for git describe
      - name: Decide the CI scope gate
        shell: bash
        env:
          CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          gated="$(python3 -B scripts/ci/ci_scope.py gate)"
          case "$gated" in run | skip) ;; *) echo "::error::ci-scope gate printed: $gated"; exit 1 ;; esac
          echo "CI_GATED=$gated" >> "$GITHUB_ENV"
          echo "ci-scope: gate=$gated" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-go
        if: env.CI_GATED != 'skip'
      # apidiff type-checks every module, including the cgo ones.
      - name: Install cgo system libraries
        if: env.CI_GATED != 'skip'
        timeout-minutes: 15
        uses: ./.github/actions/install-cgo-libs
      - name: Install apidiff
        if: env.CI_GATED != 'skip'
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          go install "github.com/joelanford/go-apidiff@${GO_COMPAT_TOOL_VERSION}"
      - name: Run apidiff vs previous tag (informational pre-1.0)
        if: env.CI_GATED != 'skip'
        run: |
          set -euo pipefail
          PREV_TAG=''
          # rev-parse exits 1 when HEAD is a root commit; a parent without a reachable tag also skips.
          parent_status=0
          git rev-parse --verify --quiet 'HEAD^1' >/dev/null || parent_status=$?
          case "$parent_status" in
            0)
              reachable_tags=$(git tag --merged 'HEAD^1' --list 'v[0-9]*')
              if [ -n "$reachable_tags" ]; then
                PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 'HEAD^1')
              fi
              ;;
            1) ;;
            *) exit "$parent_status" ;;
          esac
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — skipping apidiff (first release)"
            exit 0
          fi
          apidiff_bin="$(go env GOPATH)/bin/go-apidiff"
          test -x "$apidiff_bin"
          GO_APIDIFF_BIN="$apidiff_bin" scripts/ci/go-apidiff.sh "$PREV_TAG" HEAD

  # ── Dependency review (PR-only supply-chain gate) ────────────────────────────
  # Diffs the PR's dependency manifest/lockfile changes and fails on
  # high/critical advisories or copyleft (GPL/AGPL) licences entering the tree.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Block copyleft licences that would impose obligations on adopters.
          # Lists both the `-or-later` (preferred) and plain SPDX forms so a
          # dependency declaring either variant is caught.
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later

  # ── Secret scan (gitleaks) ───────────────────────────────────────────────────
  # Scans the PR diff (and full history on push) for committed secrets.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits
      # The gitleaks-action wrapper requires a paid GITLEAKS_LICENSE for ORG
      # repos; the gitleaks binary itself is free (MIT). Run it directly with
      # the repo's .gitleaks.toml. Native secret-scanning + push-protection are
      # the first line; this adds a full-history custom-regex sweep.
      - id: gitleaks-pin
        name: Read pinned gitleaks version
        shell: bash
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          echo "version=${GITLEAKS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${GITLEAKS_LINUX_X64_SHA256}" >> "$GITHUB_OUTPUT"
      - name: Install pinned gitleaks
        uses: plurano/horistes/actions/install-gitleaks@962524ee8f56e372c3d6c46bcafaf956d7cc44a5
        with:
          version: ${{ steps.gitleaks-pin.outputs.version }}
          sha256: ${{ steps.gitleaks-pin.outputs.sha256 }}
          install-dir: ${{ runner.temp }}/gitleaks-bin
      - name: Add gitleaks to PATH
        shell: bash
        env:
          GITLEAKS_DIR: ${{ runner.temp }}/gitleaks-bin
        run: echo "$GITLEAKS_DIR" >> "$GITHUB_PATH"
      - name: gitleaks
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          command -v gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
          gitleaks git . -c .gitleaks.toml --redact --no-banner --verbose

  # ── Custom SAST (semgrep) ────────────────────────────────────────────────────
  # Runs the project-specific .semgrep.yml ruleset against every repository Go
  # source, including non-ignored untracked files, in the digest-pinned image.
  semgrep:
    name: Custom SAST (semgrep)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
      - name: Verify Docker daemon
        run: docker info
      - name: Run full-tree custom Semgrep gate
        run: bash scripts/ci/semgrep-scan.sh
      # HISS-20 enforcement coverage: replay .config/hiss/testdata against the
      # same ruleset, in both directions. A rule that stops firing on its
      # positive fixtures, or starts matching the legitimate shape its negative
      # fixtures pin, fails here instead of quietly degrading the catalogue.
      - name: Replay the HISS enforcement-coverage corpus
        run: bash scripts/hiss/semgrep-fixtures.sh

  # ── Developer Certificate of Origin ─────────────────────────────────────────
  # Every PR commit must carry a Signed-off-by trailer (LICENSING.md, CONTRIBUTING.md).
  # The squash commit copies PR commit trailers and the PR body, so both are read here for
  # model or coding-tool attribution before they can reach main.
  dco:
    name: DCO sign-off
    if: github.actor != 'renovate[bot]' && github.actor != 'github-actions[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test the DCO check
        run: bash scripts/ci/check-dco_test.sh
      - name: Check Signed-off-by on every human-authored PR commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/check-dco.sh "$BASE" "$HEAD"
      - name: Test the attribution check
        run: bash scripts/ci/check-attribution_test.sh
      - name: Refuse model or coding-tool attribution in PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/check-attribution.sh "$BASE" "$HEAD"
      - name: Refuse model or coding-tool attribution in the PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$BODY" | bash scripts/ci/check-attribution.sh --text

  # The merge queue builds the commits that land on main, so the squash body is final there:
  # a PR body edited after its last CI run and a bot PR, which the job above skips, are read here.
  attribution:
    name: Attribution (merge queue)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test the attribution check
        run: bash scripts/ci/check-attribution_test.sh
      - name: Refuse model or coding-tool attribution in the commits that land
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash scripts/ci/check-attribution.sh "$BASE" "$HEAD"

  # ── REUSE / SPDX licensing compliance ────────────────────────────────────────
  reuse:
    name: Licensing (reuse lint)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
      - name: Verify Docker daemon
        run: docker info
      - name: REUSE lint from immutable tooling
        run: bash scripts/ci/reuse-lint.sh

  # ── Scaffolded app image smoke (amd64 + arm64) ───────────────────────────────
  app-image-smoke:
    name: App image smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
      - uses: ./.github/actions/setup-go
        with:
          cache: false
      - name: Verify Docker daemon
        run: docker info
      - name: Build and smoke scaffolded app image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/ci/app-image-smoke.sh "$PLATFORM"

  # ── Aggregate gate ───────────────────────────────────────────────────────────
  # Single "green only if every gating job passed" check used by classic branch
  # protection and release verification. Current praetor excludes `if: always()`
  # jobs from generated rulesets, so the tracked ruleset names the leaf contexts
  # until cordanaLLM/praetor#76 gains aggregate selection. CodeQL stays separate.
  ci-success:
    name: CI success
    # Runs for renovate[bot] too. Mandatory jobs must succeed; only jobs whose
    # event contract makes them inapplicable may be skipped.
    if: always()
    needs:
      - pr-title
      - lint
      - gosec
      - vuln
      - test
      - build
      - module-sweep
      - mkdocs
      - allocation-budget
      - core-skew
      - fault-recovery
      - release-binaries
      - release-smoke
      - shellcheck
      - actionlint
      - policy
      - terraform
      - kubeconform
      - semgrep
      - spectral
      - dependency-review
      - gitleaks
      - dco
      - attribution
      - reuse
      - apidiff
      - app-image-smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test aggregate result policy
        run: bash scripts/ci/check-required-jobs_test.sh
      - name: Verify all gating jobs passed
        env:
          PR_TITLE: ${{ needs.pr-title.result }}
          LINT: ${{ needs.lint.result }}
          GOSEC: ${{ needs.gosec.result }}
          VULN: ${{ needs.vuln.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          MODULE_SWEEP: ${{ needs.module-sweep.result }}
          MKDOCS: ${{ needs.mkdocs.result }}
          ALLOCATION_BUDGET: ${{ needs.allocation-budget.result }}
          CORE_SKEW: ${{ needs.core-skew.result }}
          FAULT_RECOVERY: ${{ needs.fault-recovery.result }}
          RELEASE_BINARIES: ${{ needs.release-binaries.result }}
          RELEASE_SMOKE: ${{ needs.release-smoke.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          CI_POLICY: ${{ needs.policy.result }}
          TERRAFORM: ${{ needs.terraform.result }}
          KUBECONFORM: ${{ needs.kubeconform.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          SPECTRAL: ${{ needs.spectral.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          DCO: ${{ needs.dco.result }}
          ATTRIBUTION: ${{ needs.attribution.result }}
          REUSE: ${{ needs.reuse.result }}
          APIDIFF: ${{ needs.apidiff.result }}
          APP_IMAGE_SMOKE: ${{ needs.app-image-smoke.result }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          bash scripts/ci/check-required-jobs.sh
