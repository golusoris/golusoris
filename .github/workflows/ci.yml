name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Conventional-commit PR title ────────────────────────────────────────────
  pr-title:
    name: PR title (Conventional Commits)
    if: github.actor != 'renovate[bot]' && github.event_name == 'pull_request'
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 5
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\(.+\))?(!)?: .+'; then
            echo "::error::PR title does not follow Conventional Commits."
            echo "::error::Got: $PR_TITLE"
            echo "::error::Expected: <type>(<scope>): <description>"
            echo "::error::Valid types: feat fix docs chore refactor test perf ci build revert"
            exit 1
          fi
          echo "OK: $PR_TITLE"

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: arc-cauda-golusoris-golusoris
    # Lint timeout sizing (measured 2026-09-14 on the PR #447 tip, cold caches):
    # a full `golangci-lint run` of the root module (171 pkgs) costs ~810 CPU-s
    # (63 s wall on 32 cores; the go/packages load phase alone is ~530 CPU-s),
    # core ~44 CPU-s. The ARC job container is guaranteed only 750m CPU (4-CPU
    # burst limit) and starts with a cold Go module/build cache, so the root
    # step can need ~18 min under contention.
    #
    # 20m was not enough: one office worker sits on a Proxmox host carrying 26
    # vCPU on 16 threads, so it loses 1-3 cores to steal with no CFS throttling
    # to show for it, and the go/packages load ran past 20m twice (1200.7 s) on
    # that node while the Test job passed on a healthy one. 30m covers the
    # starved node; it is temporary headroom, not the fix -- the hypervisor
    # resize is already declared in the cluster repo's vms.auto.tfvars and just
    # needs applying. Revisit once it lands.
    #
    # A timeout here is also self-perpetuating: setup-go's cache-save post step
    # is skipped when the job fails, so a run that times out on a cold cache
    # leaves the next run cold too. One green run warms it to ~2 min.
    #
    # Job timeout = setup (~3 min) + 2 x 30m, rounded up. Keep in sync with
    # run.timeout in .golangci.yml and the Makefile _ci-module target.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned for reproducible CI — bumping golangci-lint (and adopting any
          # new linter findings) is a deliberate, reviewed change, not a float.
          version: v2.13.2
          args: --config=.golangci.yml --timeout=30m
      - name: Lint core module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          working-directory: core
          args: --config=../.golangci.yml --timeout=30m

  # ── Security scan (gosec) ───────────────────────────────────────────────────
  gosec:
    name: Security (gosec)
    runs-on: arc-cauda-golusoris-golusoris
    # Measured with gosec v2.27.1 (171 root + 16 core pkgs) on a 32-core box:
    # root scan 61 s with an empty GOCACHE (2.4 GB of export data), 2 s warm;
    # core <1 s. The ARC runner pod is capped at 4 vCPU (750m request, so it can
    # be throttled lower) -> a cold scan there is ~8 min (it failed to finish
    # install + two root scans in 9m44s). A warm cache (go.sum unchanged)
    # finishes the whole job in ~2 min.
    #
    # 30 was not a hard enough bound: on the office worker that loses 1-3 cores
    # to hypervisor steal, a cold run passed 30m and was killed (32.7 min wall,
    # 2026-09-14). 45 is temporary headroom for that node, not the fix -- see
    # the Lint job comment above for the pending hypervisor resize.
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gosec
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          # gosec type-checks but never fetches: against a partially restored
          # module cache it reports `could not import ... (invalid package
          # name: "")` and exits 1 with zero findings. Populate the cache first.
          go mod download
          (cd core && go mod download)
          # .gosec.json is the ONE config shared with `make ci-all` (Makefile
          # _ci-module) and praetor's own `gosec -conf .gosec.json` gate, so the
          # three cannot drift. Path-scoped suppressions were retired in favor of
          # targeted inline `// #nosec Gxxx -- reason` comments at each flagged
          # line (see git history for the exclusion list this replaced).
          # One root scan: `-out` writes the SARIF for code scanning, `-stdout
          # -verbose text` prints the findings to the log, and the exit code
          # still gates (gosec exits 1 on any unsuppressed issue or build error;
          # never add `-quiet`: it skips writing the SARIF when clean).
          gosec -conf .gosec.json -exclude-generated \
            -fmt sarif -out gosec.sarif -stdout -verbose text ./...
          # core/ is a separate module (not reached by ./... above) and is held
          # to the full rule set with no exclusions.
          (cd core && gosec -exclude-generated ./...)
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: gosec.sarif
        continue-on-error: true   # SARIF upload requires Advanced Security (private repos)

  # ── Vulnerability check ─────────────────────────────────────────────────────
  vuln:
    name: Vulnerabilities (govulncheck)
    runs-on: arc-cauda-golusoris-golusoris
    # 20: whichever cache-using job finishes first pays the full setup-go
    # cache SAVE (the Go build+module cache is multi-GB: 6m51s on the #447
    # run, vs 33-74s for the jobs that then find the key already written).
    # 10 was enough only for the jobs that lost that race.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          govulncheck ./...
          (cd core && govulncheck ./...)

  # ── Tests + coverage ────────────────────────────────────────────────────────
  # The repository-scoped Linux ARC scale set owns coverage, artifacts, and
  # Docker-backed integration tests without hosted-runner billing.
  # go.mod is the single source of truth for the exact Go toolchain. The
  # descriptive matrix axis keeps the primary-leg metadata explicit without a
  # mutable `stable` selector.
  test:
    name: Test (race + coverage)
    runs-on: ${{ matrix.os }}
    # 30: the Docker-backed suite took 13.5 min on a cold ARC runner before the
    # pre-pull step existed; keep headroom above the 10 min per-module go test
    # timeout plus the pre-pull.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [arc-cauda-golusoris-golusoris]
        toolchain: [module]
        include:
          - os: arc-cauda-golusoris-golusoris
            toolchain: module
            primary: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # The ARC runner has a Docker sidecar for testcontainers-backed packages.
      - name: Verify Docker is reachable
        if: runner.os == 'Linux'
        run: docker info
      # Every testcontainers-backed package pulls its image on first use. The
      # ARC runner starts each job with an empty image cache ("Images: 0") and
      # `go test ./...` launches all those packages at once, so the pulls
      # compete for the Docker sidecar and container-start bounds expired
      # mid-pull (PR #447). Pull the whole set up front, in parallel and
      # bounded, so the test step starts warm.
      - name: Pre-pull testcontainers images
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Single source of truth for CI. Keep in sync with the default images
          # in testutil/{pg,redis,nats,kafka,clickhouse} and the ryuk reaper that
          # testcontainers-go v0.44.0 spawns (internal/config/config.go:
          # ReaperDefaultImage). storage/scan's clamav image is behind the
          # `integration` build tag, which this job does not set, so it is
          # deliberately not listed.
          IMAGES=(
            postgres:17-alpine
            timescale/timescaledb:2.30.0-pg17
            redis:7-alpine
            nats:2-alpine
            clickhouse/clickhouse-server:24
            redpandadata/redpanda:v24.3.1
            testcontainers/ryuk:0.14.0
          )
          PULL_TIMEOUT_SECONDS=300  # per image; HISS-02 bounded I/O
          pids=()
          for image in "${IMAGES[@]}"; do
            timeout "$PULL_TIMEOUT_SECONDS" docker pull --quiet "$image" &
            pids+=("$!")
          done
          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::docker pull failed or exceeded ${PULL_TIMEOUT_SECONDS}s: ${IMAGES[$i]}"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::pre-pull incomplete — the test step would otherwise pull under contention"
            exit 1
          fi
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      # On macOS there is no Docker daemon; skip the testcontainers-backed
      # packages so the portability leg passes instead of failing on infra.
      - name: Run tests (Linux — full suite with Docker)
        if: runner.os == 'Linux'
        run: |
          go test -race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic ./...
          (cd core && go test -race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic ./...)
          # One merged profile: the threshold below covers root + core together.
          tail -n +2 core/coverage.out >> coverage.out
      - name: Run tests (macOS — skip Docker-requiring packages)
        if: runner.os != 'Linux'
        run: |
          # testutil/pg and its dependents need a Docker daemon (testcontainers),
          # which macOS runners lack. Exclude those packages so the leg still
          # exercises the pure-Go code paths for portability signal.
          # macOS ships bash 3.2, which has no `mapfile`; word-splitting is safe
          # here because Go import paths never contain spaces.
          PKGS=$(go list ./... | grep -vE '/testutil(/|$)|/testutil/pg' || true)
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout=10m $PKGS
      - name: Check coverage threshold (70%)
        if: matrix.primary
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total' | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !($COVERAGE < 70) }"; then
            echo "::error::Coverage ${COVERAGE}% is below the required 70%"
            exit 1
          fi
      - name: Upload coverage artifact
        if: matrix.primary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: arc-cauda-golusoris-golusoris
    # 20: whichever cache-using job finishes first pays the full setup-go
    # cache SAVE (the Go build+module cache is multi-GB: 6m51s on the #447
    # run, vs 33-74s for the jobs that then find the key already written).
    # 10 was enough only for the jobs that lost that race.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: cd core && go build ./... && go vet ./...

  # ── OpenAPI spec lint (spectral) ─────────────────────────────────────────────
  # The framework has no single openapi.yaml (apps generate their own with ogen).
  # This step lints the example app spec if present; apps use ci-go.yml's
  # openapi-spec input to wire spectral for their own spec.
  spectral:
    name: OpenAPI lint (spectral)
    if: github.actor != 'renovate[bot]'
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check if example spec exists
        id: spec-check
        run: |
          if [ -f examples/full/openapi.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install spectral (hash-pinned via lockfile)
        if: steps.spec-check.outputs.exists == 'true'
        run: npm ci --prefix tools/spectral --no-audit --no-fund
      - name: Lint spec
        if: steps.spec-check.outputs.exists == 'true'
        run: tools/spectral/node_modules/.bin/spectral lint examples/full/openapi.yaml --ruleset tools/spectral.yaml --fail-severity warn
      - name: No spec to lint
        if: steps.spec-check.outputs.exists != 'true'
        run: echo "No OpenAPI spec found at examples/full/openapi.yaml — skipping spectral."

  # ── API compatibility (apidiff vs previous tag) ──────────────────────────────
  apidiff:
    name: API compatibility (apidiff)
    if: github.actor != 'renovate[bot]'
    runs-on: arc-cauda-golusoris-golusoris
    # 20: whichever cache-using job finishes first pays the full setup-go
    # cache SAVE (the Go build+module cache is multi-GB: 6m51s on the #447
    # run, vs 33-74s for the jobs that then find the key already written).
    # 10 was enough only for the jobs that lost that race.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # need full history for git describe
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20250218142911-aa4b98e5adaa
      - name: Run apidiff vs previous tag (informational pre-1.0)
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^1 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — skipping apidiff (first release)"
            exit 0
          fi
          MOD=github.com/golusoris/golusoris
          echo "Comparing HEAD against $PREV_TAG"

          # Correct export form: `apidiff -m -w FILE MODULE`, run in the module dir.
          apidiff -m -w /tmp/cur-api.txt "$MOD"

          # Export the previous tag from an isolated worktree (no stash dance).
          git worktree add -q --detach /tmp/apidiff-prev "$PREV_TAG"
          ( cd /tmp/apidiff-prev && go mod download && apidiff -m -w /tmp/prev-api.txt "$MOD" ) \
            || echo "::warning::could not export $PREV_TAG API"
          git worktree remove /tmp/apidiff-prev --force || true

          echo "## API changes vs $PREV_TAG"
          apidiff /tmp/prev-api.txt /tmp/cur-api.txt \
            || echo "::warning::apidiff comparison unavailable (export-data version mismatch)"

          # Pre-1.0 (SemVer v0.x) permits breaking changes, so this is INFORMATIONAL.
          # At v1.0, gate on incompatibles:
          #   apidiff -incompatible /tmp/prev-api.txt /tmp/cur-api.txt | tee /tmp/inc
          #   [ -s /tmp/inc ] && { echo "::error::breaking API change"; exit 1; } || true

  # ── Dependency review (PR-only supply-chain gate) ────────────────────────────
  # Diffs the PR's dependency manifest/lockfile changes and fails on
  # high/critical advisories or copyleft (GPL/AGPL) licences entering the tree.
  dependency-review:
    name: Dependency review
    if: github.actor != 'renovate[bot]' && github.event_name == 'pull_request'
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Block copyleft licences that would impose obligations on adopters.
          # Lists both the `-or-later` (preferred) and plain SPDX forms so a
          # dependency declaring either variant is caught.
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later

  # ── Secret scan (gitleaks) ───────────────────────────────────────────────────
  # Scans the PR diff (and full history on push) for committed secrets.
  gitleaks:
    name: Secret scan (gitleaks)
    if: github.actor != 'renovate[bot]'
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits
      # The gitleaks-action wrapper requires a paid GITLEAKS_LICENSE for ORG
      # repos; the gitleaks binary itself is free (MIT). Run it directly with
      # the repo's .gitleaks.toml. Native secret-scanning + push-protection are
      # the first line; this adds a full-history custom-regex sweep.
      - name: gitleaks
        run: |
          set -euo pipefail
          command -v gitleaks
          test "$(gitleaks version)" = "8.30.1"
          gitleaks git . -c .gitleaks.toml --redact --no-banner --verbose

  # ── Custom SAST (semgrep) ────────────────────────────────────────────────────
  # Runs the project-specific .semgrep.yml ruleset (golusoris invariants the
  # AST-unaware linters can't express). ADVISORY: continue-on-error + absent from
  # the ci-success gate, so a new rule can land and surface findings without
  # blocking unrelated PRs. Promote to required once the ruleset has soaked.
  semgrep:
    name: Custom SAST (semgrep)
    if: github.actor != 'renovate[bot]'
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned for reproducible CI — bumping semgrep (and adopting any new
      # parser behaviour) is a deliberate, reviewed change, not a float.
      - name: Run semgrep
        run: |
          pipx run semgrep==1.166.0 scan \
            --config .semgrep.yml \
            --error \
            --metrics=off \
            --disable-version-check \
            --oss-only

  # ── Changelog fragments (render --check) ─────────────────────────────────────
  # Validates the per-PR changelog.d/ fragments and that the rendered body
  # matches the "## [Unreleased]" block in CHANGELOG.md. Advisory: a drift here
  # should not block merging a code PR — run scripts/changelog/render.sh --write
  # locally to resync. See changelog.d/README.md.
  changelog:
    name: Changelog fragments (render --check)
    if: github.actor != 'renovate[bot]' && github.event_name == 'pull_request'
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Render check
        run: bash scripts/changelog/render.sh --check

  # ── Developer Certificate of Origin ─────────────────────────────────────────
  # Every PR commit must carry a Signed-off-by trailer (LICENSING.md, CONTRIBUTING.md).
  dco:
    name: DCO sign-off
    if: github.actor != 'renovate[bot]' && github.event_name == 'pull_request'
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha lacks a Signed-off-by trailer (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  # ── REUSE / SPDX licensing compliance ────────────────────────────────────────
  reuse:
    name: Licensing (reuse lint)
    if: github.actor != 'renovate[bot]'
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: reuse lint
        run: |
          python3 -m pip install --user --quiet 'reuse==6.2.0'
          python3 -m reuse lint

  # ── Aggregate gate ───────────────────────────────────────────────────────────
  # Single "green only if every gating job passed" check, so branch protection
  # can require ONE stable context instead of enumerating each job (whose names
  # shift when the test matrix changes). CodeQL is a separate workflow and stays
  # its own required check.
  ci-success:
    name: CI success
    # Runs for renovate[bot] too: the gating jobs above now run on
    # dependency PRs, and a skipped aggregator would satisfy the required
    # check vacuously. Skipped needs (e.g. reuse) are still tolerated.
    if: always()
    needs: [lint, gosec, vuln, test, build, reuse]
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 2
    steps:
      - name: Verify all gating jobs passed
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "gating results: $results"
          case ",$results," in
            *,failure,*|*,cancelled,*) echo "::error::a gating job did not pass: $results"; exit 1 ;;
          esac
          echo "all gating jobs passed"
