# GitHub-only supply-chain gate. Gitea uses `.gitea/workflows/` and never
# evaluates this file. Downstream apps may call this workflow directly.
#
# Scorecard requires:
#   - global permissions read-only (contents: read only)
#   - security-events: write and id-token: write set at the JOB level only
name: Scorecard

# Cancel a stale run when a newer commit supersedes it (#196).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  # Required PR context. OpenSSF publication stays disabled below for PRs.
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Can't publish from a PR context (no id-token to the OpenSSF API).
          publish_results: ${{ github.event_name != 'pull_request' }}
          # Fine-grained PAT with `Administration: Read-only` +
          # `Contents: Read-only` + `Metadata: Read-only` + `Webhooks:
          # Read-only`. Required for the Branch-Protection + Webhooks
          # checks — the default GITHUB_TOKEN can't read classic branch
          # protection rules. Docs:
          # https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md
          # Secret is optional — the action falls back to GITHUB_TOKEN
          # and those two checks remain unscored (-1).
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
