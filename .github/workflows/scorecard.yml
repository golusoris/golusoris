# DISABLED on this Gitea instance: ossf/scorecard-action requires the GitHub
# API and publishes to the OpenSSF results endpoint keyed on a GitHub
# repository, so 'Scorecard analysis' fails on every run here. Left in place
# rather than deleted so the intent survives if these repositories ever return
# to GitHub; triggers reduced to manual only so it stops consuming the shared
# self-hosted runner, which also builds the cluster's container images.
# OSSF Scorecard — runs on the framework itself AND is callable as a
# reusable workflow by downstream apps.
#
# Scorecard requires:
#   - global permissions read-only (contents: read only)
#   - security-events: write and id-token: write set at the JOB level only
name: Scorecard

# Cancel a stale run when a newer commit supersedes it (#196).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Can't publish from a PR context (no id-token to the OpenSSF API).
          publish_results: ${{ github.event_name != 'pull_request' }}
          # Fine-grained PAT with `Administration: Read-only` +
          # `Contents: Read-only` + `Metadata: Read-only` + `Webhooks:
          # Read-only`. Required for the Branch-Protection + Webhooks
          # checks — the default GITHUB_TOKEN can't read classic branch
          # protection rules. Docs:
          # https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md
          # Secret is optional — the action falls back to GITHUB_TOKEN
          # and those two checks remain unscored (-1).
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
