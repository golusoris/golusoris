# GitHub-only supply-chain gate. Gitea uses `.gitea/workflows/` and never
# evaluates this file. Downstream apps may call this workflow directly.
#
# Scorecard requires:
#   - global permissions read-only (contents: read only)
#   - security-events: write and id-token: write set at the JOB level only
name: Scorecard

# Cancel a stale run when a newer commit supersedes it (#196).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  # Required PR context. OpenSSF publication stays disabled below for PRs.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # main requires this context; scorecard-action rejects merge_group refs, so the
  # queue leg reports the result the pull request head already had to pass.
  merge_group:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Stop on a draft pull request
        uses: golusoris/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - name: Report the pull request result in the merge queue
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          MESSAGE: >-
            Scorecard did not run on the merge queue commit: scorecard-action
            accepts only pull request events and the default branch. The
            pull request head passed it before it could join the queue.
        run: |
          echo "::notice title=Scorecard ran on the pull request head::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'merge_group'
        with:
          persist-credentials: false
      - name: Run Scorecard
        if: github.event_name != 'merge_group'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Can't publish from a PR context (no id-token to the OpenSSF API).
          publish_results: ${{ github.event_name != 'pull_request' }}
          # Fine-grained PAT with `Administration: Read-only` +
          # `Contents: Read-only` + `Metadata: Read-only` + `Webhooks:
          # Read-only`. Required for the Branch-Protection + Webhooks
          # checks — the default GITHUB_TOKEN can't read classic branch
          # protection rules. Docs:
          # https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md
          # Secret is optional — the action falls back to GITHUB_TOKEN
          # and those two checks remain unscored (-1).
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - name: Upload SARIF artifact
        if: github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        if: github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
