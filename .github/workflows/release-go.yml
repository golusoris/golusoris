# Reusable release workflow for golusoris-based Go applications.
# Runs on version tags (v*.*.*) and produces:
#   - Multi-arch OCI image pushed to GHCR
#   - syft SBOM (SPDX) uploaded to the GitHub Release + attested
#   - cosign keyless signature (via goreleaser)
#   - SLSA build provenance via actions/attest-build-provenance (in-toto
#     attestation pushed to the registry). NOTE: provenance is emitted by
#     actions/attest-build-provenance, NOT slsa-framework/slsa-github-generator.
#
# Apps call it with:
#   jobs:
#     release:
#       uses: golusoris/golusoris/.github/workflows/release-go.yml@main
#       secrets: inherit
name: release-go (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: OCI image name (e.g. ghcr.io/myorg/myapp)
        type: string
        required: true
      go-version-file:
        description: Path to go.mod
        type: string
        default: go.mod
      goreleaser-config:
        description: Path to .goreleaser.yml
        type: string
        default: tools/.goreleaser.yml
    secrets:
      COSIGN_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: arc-cauda-golusoris-golusoris
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write   # needed for cosign keyless + SLSA
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.37.0

      - name: Verify pre-baked release tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in cosign syft goreleaser; do command -v "$tool"; done
          cosign version | grep -Eq 'GitVersion:[[:space:]]+v?3\.1\.3([[:space:]]|$)'
          syft version | grep -Eq 'Version:[[:space:]]+1\.51\.1([[:space:]]|$)'
          goreleaser --version | grep -Eq 'GitVersion:[[:space:]]+v?2\.18\.0([[:space:]]|$)'

      - name: Run GoReleaser
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CONFIG: ${{ inputs.goreleaser-config }}
        run: goreleaser release --config="$GORELEASER_CONFIG" --clean

      - name: Resolve pushed image digest
        id: digest
        run: |
          set -euo pipefail
          # goreleaser-action exposes no digest output; resolve it from the
          # registry for the tag goreleaser just pushed.
          DIGEST=$(docker buildx imagetools inspect \
            "${{ inputs.image-name }}:${{ github.ref_name }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        shell: bash
        env:
          IMAGE: ${{ inputs.image-name }}@${{ steps.digest.outputs.digest }}
        run: syft packages "$IMAGE" -o spdx-json > sbom.spdx.json

      - name: Upload SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # SBOM is generated above but was never attached — upload it so the
          # release carries the SPDX SBOM alongside the goreleaser artifacts.
          gh release upload "${{ github.ref_name }}" sbom.spdx.json --clobber

      - name: Attest SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
