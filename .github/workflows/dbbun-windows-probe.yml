# Temporary probe for the db/bun Windows access violation; never merged.
name: db-bun Windows probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    name: db-bun Windows probe
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Run db/bun under go test and under GC pressure
        shell: bash
        env:
          GOTRACEBACK: all
        run: |
          go test -c -o "$RUNNER_TEMP/bun.test.exe" ./db/bun/
          fails=0
          for i in $(seq 1 150); do
            if ! go test -short -count=1 ./db/bun/ > "$RUNNER_TEMP/gt.txt" 2>&1; then
              fails=$((fails + 1))
              if [ $fails -le 2 ]; then echo "--- gotest run $i"; head -c 6000 "$RUNNER_TEMP/gt.txt"; fi
            fi
          done
          echo "RESULT gotest-parent fails=$fails of 150"
          loop() {
            local f=0
            for i in $(seq 1 150); do
              if ! GOGC=1 "$RUNNER_TEMP/bun.test.exe" -test.short > "$RUNNER_TEMP/gc$1.txt" 2>&1; then
                f=$((f + 1))
                if [ $f -le 1 ]; then echo "--- gogc1 worker $1 run $i"; head -c 6000 "$RUNNER_TEMP/gc$1.txt"; fi
              fi
            done
            echo "RESULT gogc1 worker $1 fails=$f of 150"
          }
          for w in 1 2 3 4; do loop $w & done
          wait
