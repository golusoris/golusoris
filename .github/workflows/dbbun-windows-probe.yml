# Temporary probe for the db/bun Windows access violation; never merged.
name: db-bun Windows probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    name: db-bun Windows probe (host ${{ matrix.host }})
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host: ['1', '2', '3', '4']
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Host CPU
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name
      - name: Stress the formerly faulting packages
        shell: bash
        env:
          GOTRACEBACK: all
        run: |
          fails=0
          for pkg in ./db/bun/ ./db/timescale/ ./jobs/ ./storage/safety/; do
            if ! go test -short -count=100 -p 4 "$pkg" > "$RUNNER_TEMP/out.txt" 2>&1; then
              fails=$((fails + 1))
              echo "--- $pkg failed"; head -c 6000 "$RUNNER_TEMP/out.txt"
            fi
            echo "RESULT $pkg $(tail -1 "$RUNNER_TEMP/out.txt")"
          done
          echo "RESULT failed packages=$fails of 4"
          exit "$fails"
